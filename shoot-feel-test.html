<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shoot Feel Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1419;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}button,input{font:inherit}
#screen,#phone{position:absolute;inset:0;display:none}
.hud{position:absolute;left:14px;top:14px;background:#000c;padding:12px 14px;border-radius:12px;z-index:20;line-height:1.45;min-width:230px}.good{color:#7CFC93}.warn{color:#ffd166}.bad{color:#ff6b6b}
#joinbox{position:absolute;right:18px;top:18px;background:#fff;color:#111;padding:12px;border-radius:12px;text-align:center;z-index:20}#qr{width:180px;height:180px}.room{font-family:ui-monospace,Consolas,monospace;font-size:25px;font-weight:900;letter-spacing:3px;margin:8px 0}
#arena{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,#27313b 0,#151b22 45%,#0d1116 100%);overflow:hidden}
#horizon{position:absolute;left:0;right:0;bottom:12%;height:2px;background:#ffffff18}
#target{position:absolute;width:54px;height:54px;border-radius:50%;background:#f7a531;border:4px solid #ffcf7a;box-shadow:0 0 18px #ff9e2c88;display:none;transform:translate(-50%,-50%)}
#target:after{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid #7a3210}
.pop{animation:pop .16s ease-out forwards}@keyframes pop{to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
#center{position:absolute;left:50%;top:10%;transform:translateX(-50%);background:#000a;padding:10px 14px;border-radius:10px;font-weight:800;z-index:15}
#phone{background:#090b0e;touch-action:none}.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.panel{width:min(430px,100%)}
.big{width:100%;padding:20px;border:0;border-radius:16px;background:#f0b429;color:#111;font-weight:900;font-size:21px;margin-top:10px}.fire{position:absolute;inset:0;border:0;background:#151b22;color:white;font-size:36px;font-weight:900;display:none;touch-action:none}.fire:active{background:#7d1d1d}.sub{color:#aab;font-size:14px;line-height:1.4;margin-top:12px}#roomInput{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#151922;color:#fff;text-transform:uppercase;margin-top:10px}
</style>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="screen">
  <div id="arena"><div id="horizon"></div><div id="target"></div></div>
  <div class="hud">
    <div id="status" class="warn"><b>INICIANDO…</b></div>
    <div>RTT P2P: <b><span id="rtt">—</span> ms</b></div>
    <div>One-way aprox.: <b><span id="ow">—</span> ms</b></div>
    <div>Velocidad: <b><span id="speed">1.00×</span></b></div>
    <div>Disparos: <b><span id="shots">0</span></b></div>
  </div>
  <div id="center">Esperando teléfono…</div>
  <div id="joinbox"><div id="qr"></div><small>Escaneá con el celular</small><div class="room" id="roomBig"></div></div>
</div>
<div id="phone">
  <div class="wrap" id="setup"><div class="panel">
    <button class="big" id="connect">CONECTAR</button>
    <input id="roomInput" placeholder="CÓDIGO DE SALA">
    <div class="sub">Después tocá cualquier parte de la pantalla para disparar.</div>
  </div></div>
  <button class="fire" id="fire">DISPARAR</button>
</div>
<script>
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);let mode=q.get('mode');if(!mode)mode=/Android|iPhone|iPad/i.test(navigator.userAgent)?'phone':'screen';const isPhone=mode==='phone';$('#screen').style.display=isPhone?'none':'block';$('#phone').style.display=isPhone?'block':'none';
let room=(q.get('room')||'').toUpperCase();if(!room&&!isPhone)room=Math.random().toString(36).slice(2,7).toUpperCase();if(isPhone&&room)$('#roomInput').value=room;
let peer,conn,pending=new Map(),seq=0,rtts=[],target=null,lastT=performance.now(),speedMul=1,shots=0,spawnTimer=null;
if(!isPhone){$('#roomBig').textContent=room;let u=new URL(location.href);u.search='?mode=phone&room='+room;new QRCode($('#qr'),{text:u.toString(),width:180,height:180,correctLevel:QRCode.CorrectLevel.M});peer=new Peer('shoot-'+room+'-pc');peer.on('open',()=>setStatus('ESPERANDO TELÉFONO','warn'));peer.on('connection',c=>{conn=c;wire(false)});peer.on('error',e=>setStatus('ERROR '+e.type,'bad'));requestAnimationFrame(loop)}
$('#connect')?.addEventListener('click',()=>{room=$('#roomInput').value.trim().toUpperCase();if(!room)return alert('Ingresá el código');peer=new Peer();peer.on('open',()=>{conn=peer.connect('shoot-'+room+'-pc',{serialization:'json'});wire(true)});peer.on('error',e=>alert('Error: '+e.type))});
function wire(phone){conn.on('open',()=>{if(phone){$('#setup').style.display='none';$('#fire').style.display='block';conn.send({t:'hello'})}else{setStatus('CONECTADO','good');$('#center').textContent='Sale un plato cada 3 segundos';startPing();scheduleSpawn(500)}});conn.on('data',m=>{if(phone){if(m.t==='ping')conn.send({t:'pong',id:m.id})}else{if(m.t==='pong'){let t0=pending.get(m.id);if(t0!=null){rtts.push(performance.now()-t0);if(rtts.length>40)rtts.shift();pending.delete(m.id);let med=median(rtts);$('#rtt').textContent=med.toFixed(1);$('#ow').textContent=(med/2).toFixed(1)}}if(m.t==='fire')doFire()}})}
$('#fire')?.addEventListener('pointerdown',e=>{e.preventDefault();navigator.vibrate?.(18);if(conn?.open)conn.send({t:'fire',ts:performance.now()})});
function startPing(){setInterval(()=>{if(!conn?.open)return;let id=++seq;pending.set(id,performance.now());conn.send({t:'ping',id});setTimeout(()=>pending.delete(id),2000)},150)}
function scheduleSpawn(delay=3000){clearTimeout(spawnTimer);spawnTimer=setTimeout(()=>{spawn();scheduleSpawn(3000)},delay)}
function spawn(){const side=Math.floor(Math.random()*4),w=innerWidth,h=innerHeight;let x,y,ang;
 if(side===0){x=-40;y=h*(.35+Math.random()*.45);ang=(-35+Math.random()*70)*Math.PI/180}
 else if(side===1){x=w+40;y=h*(.35+Math.random()*.45);ang=(145+Math.random()*70)*Math.PI/180}
 else if(side===2){x=w*(.15+Math.random()*.7);y=h+40;ang=(-115+Math.random()*50)*Math.PI/180}
 else{x=w*(.15+Math.random()*.7);y=-40;ang=(65+Math.random()*50)*Math.PI/180}
 const base=250*speedMul;target={x,y,vx:Math.cos(ang)*base,vy:Math.sin(ang)*base,alive:true};let el=$('#target');el.className='';el.style.display='block';el.style.opacity='1';}
function doFire(){shots++;$('#shots').textContent=shots;if(!target||!target.alive)return;target.alive=false;let el=$('#target');el.classList.add('pop');setTimeout(()=>{el.style.display='none';el.className=''},180);speedMul=Math.min(4,speedMul*1.08);$('#speed').textContent=speedMul.toFixed(2)+'×';}
function loop(t){let dt=Math.min(.05,(t-lastT)/1000);lastT=t;if(target&&target.alive){target.x+=target.vx*dt;target.y+=target.vy*dt;let el=$('#target');el.style.left=target.x+'px';el.style.top=target.y+'px';if(target.x<-100||target.x>innerWidth+100||target.y<-100||target.y>innerHeight+100){target.alive=false;el.style.display='none'}}requestAnimationFrame(loop)}
function setStatus(t,c){$('#status').innerHTML='<b>'+t+'</b>';$('#status').className=c}function median(a){if(!a.length)return 0;let s=[...a].sort((a,b)=>a-b);return s[Math.floor(s.length/2)]}
</script>
</body>
</html>
