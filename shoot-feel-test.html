<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shoot Feel Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1419;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}button,input{font:inherit}
#screen,#phone{position:absolute;inset:0;display:none}.hud{position:absolute;left:14px;top:14px;background:#000c;padding:12px 14px;border-radius:12px;z-index:20;line-height:1.45;min-width:250px}.good{color:#7CFC93}.warn{color:#ffd166}.bad{color:#ff6b6b}
#joinbox{position:absolute;right:18px;top:18px;background:#fff;color:#111;padding:12px;border-radius:12px;text-align:center;z-index:20}#qr{width:180px;height:180px}.room{font-family:ui-monospace,Consolas,monospace;font-size:25px;font-weight:900;letter-spacing:3px;margin:8px 0}
#arena{position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,#27313b 0,#151b22 45%,#0d1116 100%);overflow:hidden}#horizon{position:absolute;left:0;right:0;bottom:12%;height:2px;background:#ffffff18}
#target{position:absolute;width:54px;height:54px;border-radius:50%;background:#f7a531;border:4px solid #ffcf7a;box-shadow:0 0 18px #ff9e2c88;display:none;transform:translate(-50%,-50%)}#target:after{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid #7a3210}
#aim{position:absolute;width:34px;height:34px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:none;z-index:8;pointer-events:none;box-shadow:0 0 10px #fff8}#aim:before,#aim:after{content:"";position:absolute;background:#fff}#aim:before{left:15px;top:-10px;width:2px;height:50px}#aim:after{top:15px;left:-10px;height:2px;width:50px}
.cal{position:absolute;width:58px;height:58px;border:3px solid #6d7480;border-radius:50%;transform:translate(-50%,-50%);z-index:9}.cal:before,.cal:after{content:"";position:absolute;background:#6d7480}.cal:before{left:26px;top:8px;width:2px;height:36px}.cal:after{top:26px;left:8px;height:2px;width:36px}.cal.on{border-color:#ffd166;box-shadow:0 0 24px #ffd166}.cal.on:before,.cal.on:after{background:#ffd166}.cal.ok{opacity:.12}
.pop{animation:pop .16s ease-out forwards}@keyframes pop{to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
#center{position:absolute;left:50%;top:10%;transform:translateX(-50%);background:#000a;padding:10px 14px;border-radius:10px;font-weight:800;z-index:15;white-space:nowrap}
#phone{background:#090b0e;touch-action:none}.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.panel{width:min(430px,100%)}.big{width:100%;padding:20px;border:0;border-radius:16px;background:#f0b429;color:#111;font-weight:900;font-size:21px;margin-top:10px}.fire{position:absolute;inset:0;border:0;background:#151b22;color:white;font-size:34px;font-weight:900;display:none;touch-action:none}.fire:active{background:#7d1d1d}.sub{color:#aab;font-size:14px;line-height:1.4;margin-top:12px}#roomInput{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#151922;color:#fff;text-transform:uppercase;margin-top:10px}#pstate{position:absolute;left:12px;right:12px;top:12px;color:#aab;font-size:12px;z-index:5;text-align:left}
</style>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="screen">
  <div id="arena"><div id="horizon"></div><div id="target"></div><div id="aim"></div></div>
  <div class="hud"><div id="status" class="warn"><b>INICIANDO…</b></div><div>RTT P2P: <b><span id="rtt">—</span> ms</b></div><div>One-way aprox.: <b><span id="ow">—</span> ms</b></div><div>Velocidad: <b><span id="speed">1.00×</span></b></div><div>Aciertos: <b><span id="hits">0</span></b></div><div>Disparos: <b><span id="shots">0</span></b></div></div>
  <div id="center">Esperando teléfono…</div><div id="joinbox"><div id="qr"></div><small>Escaneá con el celular</small><div class="room" id="roomBig"></div></div>
</div>
<div id="phone"><div id="pstate">DESCONECTADO</div><div class="wrap" id="setup"><div class="panel"><button class="big" id="connect">CONECTAR Y ACTIVAR SENSORES</button><input id="roomInput" placeholder="CÓDIGO DE SALA"><div class="sub">Primero calibrás la mira con 4 blancos. Después toda la pantalla del celular funciona como gatillo.</div></div></div><button class="fire" id="fire">CALIBRÁ LA MIRA</button></div>
<script>
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);let mode=q.get('mode');if(!mode)mode=/Android|iPhone|iPad/i.test(navigator.userAgent)?'phone':'screen';const isPhone=mode==='phone';$('#screen').style.display=isPhone?'none':'block';$('#phone').style.display=isPhone?'block':'none';
let room=(q.get('room')||'').toUpperCase();if(!room&&!isPhone)room=Math.random().toString(36).slice(2,7).toUpperCase();if(isPhone&&room)$('#roomInput').value=room;
const targets=[{x:.10,y:.16},{x:.90,y:.16},{x:.90,y:.84},{x:.10,y:.84}];
let peer,conn,pending=new Map(),seq=0,rtts=[],target=null,lastT=performance.now(),speedMul=1,shots=0,hits=0,spawnTimer=null,step=0,playing=false,aim={x:.5,y:.5};
let sens={last:null,a:0,b:0,g:0},samples=[],cal=null,lastSend=0,filtered={x:.5,y:.5};
if(!isPhone){$('#roomBig').textContent=room;targets.forEach((p,i)=>{const d=document.createElement('div');d.id='c'+i;d.className='cal';d.style.left=(p.x*100)+'%';d.style.top=(p.y*100)+'%';$('#arena').appendChild(d)});updateCalUI();let u=new URL(location.href);u.search='?mode=phone&room='+room;new QRCode($('#qr'),{text:u.toString(),width:180,height:180,correctLevel:QRCode.CorrectLevel.M});peer=new Peer('shoot-'+room+'-pc');peer.on('open',()=>setStatus('ESPERANDO TELÉFONO','warn'));peer.on('connection',c=>{conn=c;wire(false)});peer.on('error',e=>setStatus('ERROR '+e.type,'bad'));requestAnimationFrame(loop)}
$('#connect')?.addEventListener('click',async()=>{room=$('#roomInput').value.trim().toUpperCase();if(!room)return alert('Ingresá el código');try{if(typeof DeviceOrientationEvent?.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Permiso de sensores denegado')}window.addEventListener('deviceorientation',onOri,true);peer=new Peer();peer.on('open',()=>{conn=peer.connect('shoot-'+room+'-pc',{serialization:'json',reliable:false});wire(true)});peer.on('error',e=>alert('Error: '+e.type));$('#setup').style.display='none';$('#fire').style.display='block';$('#pstate').textContent='CONECTANDO…'}catch(e){alert(e.message||e)}});
function wire(phone){conn.on('open',()=>{if(phone){$('#pstate').textContent='CALIBRACIÓN 1/4';$('#fire').textContent='APUNTÁ AL BLANCO 1 Y TOCÁ';conn.send({t:'hello'})}else{setStatus('CONECTADO','good');$('#center').textContent='Calibración 1/4';startPing()}});conn.on('data',m=>{if(phone){if(m.t==='ping')conn.send({t:'pong',id:m.id});if(m.t==='play'){playing=true;$('#pstate').textContent='LISTO · TOCÁ PARA DISPARAR';$('#fire').textContent='DISPARAR'}}else{if(m.t==='pong'){let t0=pending.get(m.id);if(t0!=null){rtts.push(performance.now()-t0);if(rtts.length>40)rtts.shift();pending.delete(m.id);let med=median(rtts);$('#rtt').textContent=med.toFixed(1);$('#ow').textContent=(med/2).toFixed(1)}}if(m.t==='step'){step=m.n;updateCalUI();$('#center').textContent=step<4?'Calibración '+(step+1)+'/4':'CAL OK · empiezan los blancos';if(step>=4)startPlay()}if(m.t==='aim'){aim.x=m.x;aim.y=m.y;let a=$('#aim');a.style.left=(aim.x*100)+'%';a.style.top=(aim.y*100)+'%'}if(m.t==='fire')doFire()}})}
$('#fire')?.addEventListener('pointerdown',e=>{e.preventDefault();navigator.vibrate?.(18);if(samples.length<4){if(!sens.last)return;samples.push({a:sens.a,b:sens.b,g:sens.g});const n=samples.length;conn?.send({t:'step',n});$('#pstate').textContent=n<4?'CALIBRACIÓN '+(n+1)+'/4':'CALIBRACIÓN OK';$('#fire').textContent=n<4?'APUNTÁ AL BLANCO '+(n+1)+' Y TOCÁ':'LISTO';if(n===4){cal=buildCal(samples);if(!cal){alert('Calibración inválida. Recargá y repetí.');return}}return}if(playing&&conn?.open)conn.send({t:'fire',ts:performance.now()})});
function onOri(e){const r={a:num(e.alpha),b:num(e.beta),g:num(e.gamma)};if(!sens.last){sens.a=r.a;sens.b=r.b;sens.g=r.g;sens.last=r}else{sens.a+=delta(r.a,sens.last.a);sens.b+=delta(r.b,sens.last.b);sens.g+=delta(r.g,sens.last.g);sens.last=r}if(!cal||!conn?.open)return;const p=applyCal(cal,sens);if(!p)return;filtered.x+=(clamp(p.x)-filtered.x)*.60;filtered.y+=(clamp(p.y)-filtered.y)*.60;const now=performance.now();if(now-lastSend>8){lastSend=now;conn.send({t:'aim',x:filtered.x,y:filtered.y})}}
function startPlay(){if(playing)return;playing=true;$('.cal')?.remove;document.querySelectorAll('.cal').forEach(e=>e.remove());$('#aim').style.display='block';$('#center').textContent='Sale un plato cada 3 segundos';conn?.send({t:'play'});scheduleSpawn(500)}
function updateCalUI(){if(isPhone)return;targets.forEach((_,i)=>{const e=$('#c'+i);if(e)e.className='cal '+(i<step?'ok':i===step?'on':'')})}
function startPing(){setInterval(()=>{if(!conn?.open)return;let id=++seq;pending.set(id,performance.now());conn.send({t:'ping',id});setTimeout(()=>pending.delete(id),2000)},150)}
function scheduleSpawn(delay=3000){clearTimeout(spawnTimer);spawnTimer=setTimeout(()=>{spawn();scheduleSpawn(3000)},delay)}
function spawn(){if(!playing)return;const side=Math.floor(Math.random()*4),w=innerWidth,h=innerHeight;let x,y,ang;if(side===0){x=-40;y=h*(.35+Math.random()*.45);ang=(-35+Math.random()*70)*Math.PI/180}else if(side===1){x=w+40;y=h*(.35+Math.random()*.45);ang=(145+Math.random()*70)*Math.PI/180}else if(side===2){x=w*(.15+Math.random()*.7);y=h+40;ang=(-115+Math.random()*50)*Math.PI/180}else{x=w*(.15+Math.random()*.7);y=-40;ang=(65+Math.random()*50)*Math.PI/180}const base=250*speedMul;target={x,y,vx:Math.cos(ang)*base,vy:Math.sin(ang)*base,alive:true};let el=$('#target');el.className='';el.style.display='block';el.style.opacity='1'}
function doFire(){shots++;$('#shots').textContent=shots;if(!target||!target.alive)return;const ax=aim.x*innerWidth,ay=aim.y*innerHeight,dx=ax-target.x,dy=ay-target.y;const hit=Math.hypot(dx,dy)<=42;if(!hit)return;hits++;$('#hits').textContent=hits;target.alive=false;let el=$('#target');el.classList.add('pop');setTimeout(()=>{el.style.display='none';el.className=''},180);speedMul=Math.min(5,speedMul*1.08);$('#speed').textContent=speedMul.toFixed(2)+'×'}
function loop(t){let dt=Math.min(.05,(t-lastT)/1000);lastT=t;if(target&&target.alive){target.x+=target.vx*dt;target.y+=target.vy*dt;let el=$('#target');el.style.left=target.x+'px';el.style.top=target.y+'px';if(target.x<-100||target.x>innerWidth+100||target.y<-100||target.y>innerHeight+100){target.alive=false;el.style.display='none'}}requestAnimationFrame(loop)}
function buildCal(s){const pairs=[['a','b'],['a','g'],['b','g']];let best=null;for(const ax of pairs){const pts=s.map(v=>({x:v[ax[0]],y:v[ax[1]]})),ar=Math.abs(area(pts));if(!best||ar>best.ar)best={ax,pts,ar}}if(!best||best.ar<8)return null;const H=homography(best.pts,targets);return H?{ax:best.ax,H}:null}
function applyCal(m,s){const x=s[m.ax[0]],y=s[m.ax[1]],h=m.H,d=h[6]*x+h[7]*y+1;if(Math.abs(d)<1e-8)return null;return{x:(h[0]*x+h[1]*y+h[2])/d,y:(h[3]*x+h[4]*y+h[5])/d}}
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const x=src[i].x,y=src[i].y,X=dst[i].x,Y=dst[i].y;A.push([x,y,1,0,0,0,-X*x,-X*y]);b.push(X);A.push([0,0,0,x,y,1,-Y*x,-Y*y]);b.push(Y)}return solve(A,b)}
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;if(Math.abs(M[p][c])<1e-10)return null;[M[c],M[p]]=[M[p],M[c]];const q=M[c][c];for(let j=c;j<=n;j++)M[c][j]/=q;for(let r=0;r<n;r++)if(r!==c){const f=M[r][c];for(let j=c;j<=n;j++)M[r][j]-=f*M[c][j]}}return M.map(r=>r[n])}
function area(p){let a=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i].x*p[j].y-p[j].x*p[i].y}return a/2}
function delta(a,b){let d=a-b;while(d>180)d-=360;while(d<-180)d+=360;return d}function num(v){v=Number(v);return Number.isFinite(v)?v:0}function clamp(v){return Math.max(0,Math.min(1,v))}function setStatus(t,c){$('#status').innerHTML='<b>'+t+'</b>';$('#status').className=c}function median(a){if(!a.length)return 0;let s=[...a].sort((a,b)=>a-b);return s[Math.floor(s.length/2)]}
</script>
</body>
</html>
