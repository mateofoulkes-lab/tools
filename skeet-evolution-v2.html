<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de tiro al disco — evolución</title><style>:root{--bg:#f5f0e8;--ink:#102031;--muted:#687789;--orange:#ef8b22;--green:#4f9764;--yellow:#d7a033;--red:#c85b50;--line:#d8dde3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}.slide{position:absolute;inset:0;display:none;padding:34px 54px 86px;background:radial-gradient(circle at 92% 10%,#fce8d4,transparent 30%),var(--bg)}.slide.on{display:block}.top{display:flex;justify-content:space-between;color:#788596;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.stage{color:var(--orange);font-weight:900}h1,h2{margin:22px 0 0;line-height:1;letter-spacing:-.04em}h1{font-size:60px;max-width:920px}h2{font-size:46px;max-width:980px}em{font-style:normal;color:var(--orange)}.lead{font-size:21px;color:var(--muted);max-width:900px;line-height:1.35}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;margin-top:24px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 38px #10203114}.bullets{display:grid;gap:14px;font-size:19px;font-weight:800}.bullets div:before{content:'◆';color:var(--orange);margin-right:12px}.metrics{display:grid;grid-template-columns:1.1fr 1fr 1.6fr 1fr 1.2fr;gap:10px;margin-top:18px}.m{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.m b{display:block;font-size:10px;color:#7c8997;letter-spacing:.12em;text-transform:uppercase}.m strong{display:block;font-size:22px;margin-top:6px}.stars{color:var(--orange);font-size:22px}.problem{margin-top:14px;padding:14px 18px;background:#fff1e4;border-left:5px solid var(--orange);border-radius:14px;font-weight:850}.legend{position:absolute;top:20px;right:26px;width:360px;background:#ffffffee;border:1px solid var(--line);border-radius:20px;padding:14px;z-index:10}.legend h3{margin:0 0 8px;font-size:13px;color:#7f8c99;letter-spacing:.12em}.scaleTitle{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin:7px 0}.band{position:relative;height:28px;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg{position:absolute;top:0;bottom:0}.lat1{left:0;width:20%;background:#4f9764}.lat2{left:20%;width:18%;background:#6ca968}.lat3{left:38%;width:18%;background:#d7a033}.lat4{left:56%;width:19%;background:#d98233}.lat5{left:75%;width:25%;background:#c85b50}.pr1{left:0;width:35%;background:#c85b50}.pr2{left:35%;width:20%;background:#d58c39}.pr3{left:55%;width:20%;background:#80a85f}.pr4{left:75%;width:25%;background:#4f9764}.marker,.target{position:absolute;top:-3px;height:34px;border-left:3px solid #0e1720;z-index:3}.target{border-left-style:dashed;opacity:.45}.marknote{font-size:10px;color:#6c7988;margin-top:3px}.visual{min-height:285px;display:grid;place-items:center}.pivot{position:relative;width:100%;height:270px;background:linear-gradient(#d7e8ee 0 62%,#8eaa7b 62%);border-radius:22px;overflow:hidden}.person,.person2{position:absolute;left:95px;bottom:50px;width:20px;height:95px;background:#42556a;border-radius:10px}.person:before,.person2:before{content:'';position:absolute;left:-4px;top:-25px;width:28px;height:28px;border-radius:50%;background:inherit}.person:after,.person2:after{content:'';position:absolute;left:10px;top:20px;width:145px;height:10px;border-radius:10px;background:#2e3842;transform:rotate(-14deg);transform-origin:left center}.person2{left:190px;background:#c85b50;opacity:.75}.person2:after{background:#c85b50}.screen{position:absolute;right:30px;top:45px;width:150px;height:170px;border:9px solid #1e2b38;background:linear-gradient(#8bc8e2 0 60%,#7da367 60%);border-radius:18px}.dot1,.dot2{position:absolute;right:92px;top:105px;width:24px;height:24px;border-radius:50%;background:#fff}.dot2{right:48px;background:#c85b50}.arrowtxt{position:absolute;font-weight:900;font-size:14px;background:#fff;padding:6px 9px;border-radius:10px}.a1{left:20px;top:16px}.a2{left:20px;bottom:18px}.quest{display:grid;grid-template-columns:1fr 1fr;gap:16px}.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.q.best{border:2px solid var(--orange)}.q h3{text-align:center;font-size:25px;margin:0 0 12px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{background:#f4f6f8;border-radius:12px;padding:10px}.caps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}.footer{position:absolute;left:0;right:0;bottom:0;padding:12px 24px;display:flex;justify-content:space-between;color:#6f7d8d;font-size:12px}.dots{display:flex;gap:6px}.dotnav{width:9px;height:9px;border-radius:50%;background:#d6dce2}.dotnav.on{background:var(--orange)}@media(max-width:1100px){.legend{position:static;width:auto;margin:10px 0}.slide{overflow:auto}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.caps{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="legend"><h3>ESCALAS DE REFERENCIA</h3><div class="scaleTitle"><span>Latencia total</span><span id="latRead"></span></div><div class="band"><span class="seg lat1"></span><span class="seg lat2"></span><span class="seg lat3"></span><span class="seg lat4"></span><span class="seg lat5"></span><span class="target" id="latTarget"></span><span class="marker" id="latMarker"></span></div><div class="marknote">Línea punteada = 30 ms aceptable · línea negra = esta etapa</div><div class="scaleTitle"><span>Precisión del control</span><span id="precRead"></span></div><div class="band"><span class="seg pr1"></span><span class="seg pr2"></span><span class="seg pr3"></span><span class="seg pr4"></span><span class="target" id="precTarget"></span><span class="marker" id="precMarker"></span></div><div class="marknote">Línea punteada = 7/10 aceptable · línea negra = esta etapa</div></div><div id="deck"></div><div class="footer"><div>← → / espacio · avanzar · F pantalla completa</div><div class="dots" id="dots"></div></div><script>const data=[{st:'01 · EL PROBLEMA REAL',t:'No queríamos hacer un jueguito.',a:'Queríamos que se sintiera como tirar de verdad.',l:'El proyecto arrancó simple, pero enseguida aparecieron tres exigencias: respuesta rápida, puntería estable y una experiencia cómoda para cualquier cliente.',lat:30,p:7,b:['< 30 ms de respuesta total','7/10 de precisión mínima','≥ 90° de campo visual útil','Una mira asistida sólo sirve si responde en vivo de verdad.'],m:['Objetivo','—','—','—','—'],x:'La actividad está basada en reflejos, seguimiento y coordinación ojo–mano.'},{st:'02 · CELULAR + PÁGINA WEB',t:'Primera idea: celular apuntando a la pantalla',l:'El celular movía la mira, se calibraba en 4 puntos y ya se podía jugar.',lat:140,p:4,b:['Celular como control','Página web simple','Calibración visual de 4 puntos','Muy rápido para prototipar'],m:['~100–200 ms','4 / 10','USD 800 (AR$ 1,2 M)','2 / 10','4 / 10'],x:'Era divertido, pero el delay se notaba mucho.'},{st:'03 · CONEXIÓN MÁS DIRECTA',t:'Quitamos Internet del medio lo máximo posible',l:'Pasamos a una conexión más directa entre el celular y la PC. Mejoró, pero no tanto como esperábamos.',lat:82,p:4.5,b:['Menos viaje de ida y vuelta','Prueba real: 21,1 ms de ida y vuelta','La conexión dejó de ser el gran villano','El problema seguía sintiéndose al apuntar'],m:['~75–90 ms','4,5 / 10','USD 800 (AR$ 1,2 M)','3 / 10','5 / 10'],x:'La red mejoró, pero la sensación final seguía siendo lenta.'},{st:'04 · SENSORES + RADIO PROPIA',t:'Intentamos sacar el celular de la ecuación',l:'Pensamos en un módulo propio montado en el arma, con sensor de movimiento y un enlace inalámbrico más rápido y controlado.',lat:72,p:6,b:['Módulo más liviano y repetible','Sensor de movimiento dedicado','Enlace inalámbrico propio','5–12 ms posibles en la parte sensor → PC'],m:['~65–80 ms','6 / 10','USD 900 (AR$ 1,35 M)','5 / 10','6 / 10'],x:'La cadena del sensor mejoró, pero la pantalla y la precisión espacial seguían ahí.'},{st:'05 · ROTACIÓN ≠ POSICIÓN',t:'El sensor medía bien el giro del arma…',a:'…pero no el desplazamiento del tirador.',l:'Si la persona cambia el peso, se inclina o se mueve, cambia el punto real desde donde sale el cañón.',lat:72,p:6.5,b:['El giro del arma se mide bien','El cambio de posición del cuerpo no','La mira puede correrse con el tiempo','Ese corrimiento es la famosa deriva'],m:['~65–80 ms','6,5 / 10','USD 900 (AR$ 1,35 M)','5 / 10','6,5 / 10'],x:'Sin una referencia externa, la mira puede separarse de la realidad.',v:'pivot'},{st:'06 · CÁMARA COMO AYUDA',t:'Probamos sumar una cámara para corregir',l:'La cámara no controlaría todo el tiempo: sólo ayudaría a recentrar la mira y corregir el corrimiento.',lat:80,p:7.5,b:['Más precisión general','Ayuda a corregir deriva','La cámara también agrega demora','Más piezas y más calibración'],m:['~80–95 ms','7,5 / 10','USD 980 (AR$ 1,47 M)','8 / 10','5,5 / 10'],x:'Servía para corregir, pero el sistema se estaba volviendo un Frankenstein.'},{st:'07 · LÁSER INFRARROJO + CÁMARA',t:'Otra idea: seguir directamente el punto del arma',l:'El arma podía proyectar un punto infrarrojo y una cámara fija podía ver exactamente dónde estaba apuntando.',lat:85,p:8.5,b:['Muy buena precisión de puntería','Posible mira en vivo real','Más hardware e instalación','Seguíamos dependiendo de cámara y pantalla'],m:['~80–110 ms','8,5 / 10','USD 1.050 (AR$ 1,58 M)','9 / 10','6 / 10'],x:'La precisión era prometedora, pero ya no era un producto simple.'},{st:'08 · MEDIMOS LA PANTALLA',t:'Y apareció la gran sorpresa',a:'la pantalla también era parte del producto.',l:'Habíamos afinado sensores y comunicación, pero la pantalla seguía pesando muchísimo en la sensación final.',lat:61,p:8,b:['Medición bruta: 156 ms','Demora de cámara estimada: 95 ms','Pantalla aprox.: 61 ms','Si la pantalla es lenta, el sistema entero se cae'],m:['61 ms sólo pantalla','8 / 10','USD 900–1.450','7 / 10','7,5 / 10'],x:'Depender del monitor o proyector del cliente era un riesgo enorme.'},{st:'09 · REALIDAD VIRTUAL',t:'Y entonces apareció la opción que resolvía todo junto',a:'Quest.',l:'El visor ya trae el seguimiento de movimiento, la pantalla, el campo visual y la lógica de baja demora en un solo producto.',lat:24,p:9.2,b:['Quest 3S: más económico','Quest 3: mejor campo visual y claridad','Sin PC externa','Sin proyector ni cámara externa'],m:['~20–30 ms','9–9,5 / 10','USD 450–650','3 / 10','8–9 / 10'],x:'Lo que intentábamos resolver pieza por pieza, Quest ya lo trae de fábrica.',v:'quest'},{st:'10 · NUEVAS POSIBILIDADES',t:'Con Quest no sólo resolvemos el seguimiento.',a:'También ganamos producto.',l:'Una vez adentro de realidad virtual, se abren funciones que antes eran muy difíciles o directamente no valían la pena.',lat:22,p:9.5,b:['Entornos 360°','Selección de armas','Clima y luz variables','Modos de simulación, estadísticas y mira asistida en vivo'],m:['~20–30 ms','9,5 / 10','USD 650 aprox.','3 / 10','9 / 10'],x:'Ya no pensamos sólo en hacer que funcione: pensamos en una plataforma vendible.',v:'caps'},{st:'11 · PRODUCTO FINAL RECOMENDADO',t:'La versión más limpia: Quest + montaje en la escopeta',l:'Es la única ruta que nos dejó buena respuesta, buena puntería, buen campo visual y un producto fácil de explicar.',lat:22,p:9.5,b:['No depende de TV o proyector','No depende de PC externa','No necesita cámara externa ni láser','Más fácil de vender, instalar y soportar'],m:['~20–30 ms','9,5 / 10','USD 650 (AR$ 975 mil)','3 / 10','9 / 10'],x:'Quest 3S puede ser la versión económica; Quest 3 cierra mejor como producto premium.'},{st:'12 · IDEA FUERZA',t:'Intentamos resolver cada problema por separado.',a:'Quest los resolvió todos juntos.',l:'El viaje sirvió para entender el problema real. Y eso hace que la conclusión sea más fuerte.',lat:22,p:9.5,b:['Antes: celular + pantalla + sensores + cámara','Ahora: visor + control montado + software propio','Después: escenarios, armas, clima, modos y métricas','La solución más simple terminó siendo la más completa'],m:['✅','✅','Producto cerrado','✅','Conclusión'],x:'La mejor solución resolvió latencia, precisión, campo visual y simplicidad al mismo tiempo.'}];let i=0;const deck=document.getElementById('deck'),dots=document.getElementById('dots');data.forEach((_,n)=>{let d=document.createElement('span');d.className='dotnav';dots.appendChild(d)});function stars(s){let n=parseFloat(String(s).replace(',','.'))||0,v=Math.round(n/2*2)/2,o='';for(let k=1;k<=5;k++)o+=k<=Math.floor(v)?'★':(k-.5===v?'◐':'☆');return o}function visual(v){if(v==='pivot')return `<div class="pivot"><div class="person"></div><div class="person2"></div><div class="screen"></div><div class="dot1"></div><div class="dot2"></div><div class="arrowtxt a1">Giro: sí lo mide</div><div class="arrowtxt a2">Desplazamiento del cuerpo: no</div></div>`;if(v==='quest')return `<div class="quest"><div class="q"><h3>Quest 3S</h3><div class="specs"><div class="spec">Campo visual<br><b>96° × 90°</b></div><div class="spec">Frecuencia<br><b>120 Hz</b></div><div class="spec">Costo aprox.<br><b>USD 450</b></div><div class="spec">Opción<br><b>económica</b></div></div></div><div class="q best"><h3>Quest 3</h3><div class="specs"><div class="spec">Campo visual<br><b>110° × 96°</b></div><div class="spec">Frecuencia<br><b>120 Hz</b></div><div class="spec">Costo aprox.<br><b>USD 650</b></div><div class="spec">Opción<br><b>recomendada</b></div></div></div></div>`;if(v==='caps')return `<div class="caps">${['🌍 Entornos 360°','🔫 Armas','🌦️ Clima','🎮 Modos','🧿 Mira asistida','📊 Estadísticas','🧳 Producto cerrado','⬆️ Actualizaciones'].map(x=>`<div class="cap">${x}</div>`).join('')}</div>`;return `<div class="visual"><div style="font-size:72px;color:var(--orange)">◎</div><div style="font-size:22px;font-weight:900">Evolución paso a paso</div></div>`}function render(){const s=data[i];deck.innerHTML=`<section class="slide on"><div class="top"><div>SIMULADOR DE TIRO AL DISCO</div><div class="stage">${s.st}</div></div><h2>${s.t}${s.a?`<br><em>${s.a}</em>`:''}</h2><p class="lead">${s.l}</p><div class="grid"><div class="card"><div class="bullets">${s.b.map(x=>`<div>${x}</div>`).join('')}</div></div><div class="card">${visual(s.v)}</div></div><div class="metrics">${['Latencia','Precisión','Costo total','Complejidad','Puntaje'].map((x,n)=>`<div class="m"><b>${x}</b><strong class="${n===4?'stars':''}">${n===4&&String(s.m[n]).includes('/')?stars(s.m[n])+'<br>':''}${s.m[n]}</strong></div>`).join('')}</div><div class="problem">${s.x}</div></section>`;document.querySelectorAll('.dotnav').forEach((d,n)=>d.classList.toggle('on',n===i));document.getElementById('latRead').textContent=s.lat+' ms aprox.';document.getElementById('precRead').textContent=s.p+'/10';document.getElementById('latTarget').style.left=(30/120*100)+'%';document.getElementById('latMarker').style.left=(Math.min(s.lat,120)/120*100)+'%';document.getElementById('precTarget').style.left='70%';document.getElementById('precMarker').style.left=(s.p*10)+'%';location.hash=i+1}function go(n){i=(n+data.length)%data.length;render()}addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}if(e.key==='Home')go(0);if(e.key==='End')go(data.length-1);if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});let n=parseInt(location.hash.slice(1));if(n>=1&&n<=data.length)i=n-1;render();</script></body></html>
