<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstantDB Paddle · Screen/Controller</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
.wrap{max-width:760px;margin:0 auto;padding:16px}
canvas{display:block;margin:0 auto;border:1px solid #333;border-radius:12px;background:#fff;max-width:100%;touch-action:none}
.card{border:1px solid #333;border-radius:12px;padding:12px;margin:12px 0;background:#181818}
button{padding:12px 14px;font-size:16px;border:1px solid #444;border-radius:10px;background:#222;color:#eee;cursor:pointer;margin:4px}
button.active{background:#3b43ff;border-color:#6d72ff}
button:active{transform:translateY(1px)}
.muted{color:#9aa0a6;font-size:13px}
.big{font-size:22px}
.center{text-align:center}
.debug{white-space:pre-wrap;background:#0b0b0b;border:1px solid #333;border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cfd3dc;text-align:left;overflow:auto}
</style>
</head>
<body>

<script>
// ============================
// CONFIG
// ============================
window.APP_ID = "b1444761-2c88-4438-ae19-4c29c727d227";
const urlParams = new URLSearchParams(window.location.search);
const MODE = urlParams.get("mode") || "screen";
</script>

<div id="root">Cargando...</div>

<script type="module">
import React, {useEffect,useRef,useState} from "https://esm.sh/react@18.2.0";
import {createRoot} from "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0";
import {init} from "https://esm.sh/@instantdb/react?deps=react@18.2.0";

const db = init({ appId: window.APP_ID });
const room = db.room("latency-test", "main");
const CLIENT_ID = localStorage.clientId ?? (localStorage.clientId = crypto.randomUUID());

function App(){
  const publish = db.rooms.usePublishTopic(room, "move");

  const paddleAngleRef = useRef(0);
  const canvasRef = useRef(null);
  const lastSend = useRef(0);
  const dragging = useRef(false);
  const ballsRef = useRef([]);
  const lastTimeRef = useRef(performance.now());
  const sensorEvents = useRef({orientation:0,motion:0,lastOrientationTime:0,lastMotionTime:0});
  const sensorMode = useRef("none");

  const [status,setStatus] = useState("Inicializando...");
  const [angleUI,setAngleUI] = useState(0);
  const [debug,setDebug] = useState("Sin datos de sensores todavía.");

  db.rooms.useTopicEffect(room, "move", (msg) => {
    if (!msg || msg.clientId === CLIENT_ID) return;
    if (msg.type === "paddle"){
      paddleAngleRef.current = clamp(Number(msg.angle||0), -60, 60);
    }
  });

  function switchMode(nextMode){
    const url = new URL(window.location.href);
    url.searchParams.set("mode", nextMode);
    window.location.href = url.toString();
  }

  function sendAngle(angle, immediate=false){
    const now = Date.now();
    if (!immediate && now - lastSend.current < 16) return;
    lastSend.current = now;
    publish({ type:"paddle", angle, clientId: CLIENT_ID, sentAt: Date.now() });
  }

  function applyAngle(angle, source){
    const clean = clamp(Number(angle || 0), -60, 60);
    paddleAngleRef.current = clean;
    sensorMode.current = source;
    setAngleUI(clean);
    sendAngle(clean);
  }

  async function activateSensors(){
    try{
      const secure = window.isSecureContext;
      const hasOrientation = !!window.DeviceOrientationEvent;
      const hasMotion = !!window.DeviceMotionEvent;
      const orientationPermission = hasOrientation && typeof DeviceOrientationEvent.requestPermission === "function";
      const motionPermission = hasMotion && typeof DeviceMotionEvent.requestPermission === "function";

      setStatus("Activando sensores...");
      setDebug(
        `secureContext: ${secure}\n` +
        `DeviceOrientationEvent: ${hasOrientation}\n` +
        `DeviceMotionEvent: ${hasMotion}\n` +
        `orientation permission API: ${orientationPermission}\n` +
        `motion permission API: ${motionPermission}`
      );

      if (!secure){
        setStatus("Necesita HTTPS. Probalo desde GitHub Pages, no file://.");
        return;
      }

      if (!hasOrientation && !hasMotion){
        setStatus("Este navegador no expone sensores de orientación/movimiento.");
        return;
      }

      if (orientationPermission){
        const p = await DeviceOrientationEvent.requestPermission();
        if (p !== "granted"){
          setStatus("Permiso de orientación denegado.");
          return;
        }
      }

      if (motionPermission){
        const p = await DeviceMotionEvent.requestPermission();
        if (p !== "granted"){
          setStatus("Permiso de movimiento denegado.");
          return;
        }
      }

      window.removeEventListener("deviceorientation", onOrientation, true);
      window.removeEventListener("devicemotion", onMotion, true);

      if (hasOrientation) window.addEventListener("deviceorientation", onOrientation, true);
      if (hasMotion) window.addEventListener("devicemotion", onMotion, true);

      setStatus("Sensores activos. Incliná el celular.");

      setTimeout(() => {
        const ev = sensorEvents.current;
        if (ev.orientation === 0 && ev.motion === 0){
          setStatus("Sensores activados, pero no llegó ningún evento. Puede estar bloqueado por navegador/sistema.");
        } else if (ev.orientation <= 1 && ev.motion <= 1){
          setStatus("Llegaron muy pocos eventos. El navegador podría estar congelando sensores.");
        } else {
          setStatus(`Sensores OK · orientation: ${ev.orientation} · motion: ${ev.motion} · usando: ${sensorMode.current}`);
        }
      }, 2500);
    }catch(e){
      setStatus("Error: "+(e?.message||e));
      setDebug(e?.stack || String(e));
    }
  }

  function onOrientation(e){
    sensorEvents.current.orientation++;
    sensorEvents.current.lastOrientationTime = Date.now();

    const alpha = Number(e.alpha ?? 0);
    const beta = Number(e.beta ?? 0);
    const gamma = Number(e.gamma ?? 0);

    // Usamos BETA como eje principal, como pediste.
    applyAngle(beta, "orientation.beta");

    setDebug(
      `orientation events: ${sensorEvents.current.orientation}\n` +
      `motion events: ${sensorEvents.current.motion}\n` +
      `modo usado: ${sensorMode.current}\n` +
      `alpha: ${alpha.toFixed(2)}\n` +
      `beta: ${beta.toFixed(2)}\n` +
      `gamma: ${gamma.toFixed(2)}\n` +
      `angle enviado: ${paddleAngleRef.current.toFixed(2)}°`
    );
  }

  function onMotion(e){
    sensorEvents.current.motion++;
    sensorEvents.current.lastMotionTime = Date.now();

    const acc = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
    const ax = Number(acc.x ?? 0);
    const ay = Number(acc.y ?? 0);
    const az = Number(acc.z ?? 0);

    // Fallback del otro eje: pitch por gravedad.
    const pitchRad = Math.atan2(ay, Math.sqrt(ax*ax + az*az));
    const pitchDeg = pitchRad * 180 / Math.PI;

    const now = Date.now();
    const orientationStale = now - sensorEvents.current.lastOrientationTime > 250;

    if (orientationStale || sensorMode.current === "none"){
      applyAngle(pitchDeg, "motion.pitch");
    }

    setDebug(
      `orientation events: ${sensorEvents.current.orientation}\n` +
      `motion events: ${sensorEvents.current.motion}\n` +
      `modo usado: ${sensorMode.current}\n` +
      `ax: ${ax.toFixed(2)}\n` +
      `ay: ${ay.toFixed(2)}\n` +
      `az: ${az.toFixed(2)}\n` +
      `pitch fallback: ${pitchDeg.toFixed(2)}°\n` +
      `angle enviado: ${paddleAngleRef.current.toFixed(2)}°`
    );
  }

  useEffect(() => {
    if (MODE !== "screen") return;
    ballsRef.current = [spawnBall()];
    lastTimeRef.current = performance.now();
    requestAnimationFrame(loop);
  }, []);

  function loop(now){
    const canvas = canvasRef.current;
    if (!canvas) return requestAnimationFrame(loop);

    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;
    const dt = Math.min(0.033, (now - lastTimeRef.current) / 1000);
    lastTimeRef.current = now;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,w,h);

    const cx = w/2;
    const cy = h-35;
    const paddleW = 120;
    const paddleH = 8;
    const angle = paddleAngleRef.current * Math.PI/180;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = "#3b43ff";
    roundedRect(ctx, -paddleW/2, -paddleH/2, paddleW, paddleH, 5);
    ctx.fill();
    ctx.restore();

    const balls = ballsRef.current;
    for (let i = balls.length-1; i>=0; i--){
      const b = balls[i];
      b.x += b.vx*dt;
      b.y += b.vy*dt;

      const relX = b.x - cx;
      const relY = b.y - cy;
      const cosA = Math.cos(-angle);
      const sinA = Math.sin(-angle);
      const localX = relX*cosA - relY*sinA;
      const localY = relX*sinA + relY*cosA;
      const r = 6;

      if (b.vy>0 && Math.abs(localX)<=paddleW/2+r && Math.abs(localY)<=paddleH/2+r){
        const speed = Math.hypot(b.vx,b.vy);
        b.vx = speed*Math.sin(angle);
        b.vy = -Math.abs(speed*Math.cos(angle));
        const correctedLocalY = -paddleH/2 - r - 1;
        b.x = cx + localX*Math.cos(angle) - correctedLocalY*Math.sin(angle);
        b.y = cy + localX*Math.sin(angle) + correctedLocalY*Math.cos(angle);
      }

      if (b.y > h+20 || b.y < -20 || b.x < -20 || b.x > w+20){
        balls.splice(i,1);
        balls.push(spawnBall());
        continue;
      }

      ctx.beginPath();
      ctx.arc(b.x,b.y,6,0,Math.PI*2);
      ctx.fillStyle = "#222";
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }

  function onDown(e){ dragging.current=true; e.currentTarget.setPointerCapture(e.pointerId); updateFromPointer(e,true); }
  function onMove(e){ if(!dragging.current) return; updateFromPointer(e,false); }
  function onUp(e){ dragging.current=false; updateFromPointer(e,true); }

  function updateFromPointer(e,immediate){
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const norm = (x/rect.width)*2-1;
    const angle = clamp(norm*60,-60,60);
    paddleAngleRef.current = angle;
    setAngleUI(angle);
    sendAngle(angle,immediate);
  }

  return React.createElement("div", {className:"wrap"},
    React.createElement("div", {className:"card center"},
      React.createElement("div", {className:"big"}, "Modo actual: ", MODE),
      React.createElement("button", {className:MODE==="screen"?"active":"", onClick:()=>switchMode("screen")}, "Pantalla / PC"),
      React.createElement("button", {className:MODE==="controller"?"active":"", onClick:()=>switchMode("controller")}, "Mando / Celular")
    ),

    MODE === "controller"
      ? React.createElement(React.Fragment, null,
          React.createElement("div", {className:"card center"},
            React.createElement("div", {className:"big"}, "Modo mando"),
            React.createElement("p", {className:"muted"}, status),
            React.createElement("button", {onClick:activateSensors}, "Activar sensores"),
            React.createElement("p", {className:"big"}, angleUI.toFixed(1), "°")
          ),
          React.createElement("div", {className:"card"},
            React.createElement("p", {className:"muted"}, "Fallback: arrastrá horizontalmente"),
            React.createElement("canvas", {
              width:400,height:160,
              onPointerDown:onDown,onPointerMove:onMove,onPointerUp:onUp,onPointerCancel:onUp
            })
          ),
          React.createElement("div", {className:"card debug"}, debug)
        )
      : React.createElement("div", {className:"card"},
          React.createElement("canvas", {
            ref:canvasRef,
            width:400,
            height:300,
            onPointerDown:onDown,onPointerMove:onMove,onPointerUp:onUp,onPointerCancel:onUp
          }),
          React.createElement("p", {className:"muted center"}, "Pantalla de juego. Usá el modo mando en el celular.")
        )
  );
}

function spawnBall(){
  const speed = 160;
  const a = Math.random()*0.6-0.3;
  return { x:200, y:40, vx:Math.sin(a)*speed, vy:speed };
}

function roundedRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
