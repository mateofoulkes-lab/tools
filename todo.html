<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstantDB Latency Test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px}
#error{white-space:pre-wrap;color:#b00020;background:#ffecec;padding:12px;border-radius:10px;display:none}
.card{border:1px solid #ddd;border-radius:14px;padding:16px;margin:16px 0}
canvas{border:1px solid #ddd;border-radius:12px;touch-action:none;max-width:100%;background:#fff;display:block;margin:auto}
input{width:100%}
textarea{width:100%;min-height:140px;padding:10px;font-size:16px;box-sizing:border-box;resize:vertical;font-family:system-ui,sans-serif}
button{padding:10px 14px;font-size:16px;border:1px solid #bbb;border-radius:10px;background:#f7f7f7;cursor:pointer;margin-right:8px;margin-bottom:8px}
button:active{transform:translateY(1px)}
.muted{color:#666;font-size:14px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0ff;color:#3036b8;font-size:13px;margin-left:6px}
.debug{white-space:pre-wrap;background:#f6f6f6;border:1px solid #ddd;border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#333}
</style>
</head>
<body>

<script>
window.APP_ID = "b1444761-2c88-4438-ae19-4c29c727d227";
</script>

<h1>InstantDB Latency Test</h1>
<div id="error"></div>
<div id="root">Cargando módulo...</div>

<script type="module">
import React, {useEffect,useRef,useState} from "https://esm.sh/react@18.2.0";
import {createRoot} from "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0";
import {init} from "https://esm.sh/@instantdb/react?deps=react@18.2.0";

const db = init({ appId: window.APP_ID });
const room = db.room("latency-test", "main");
const CLIENT_ID = localStorage.clientId ?? (localStorage.clientId = crypto.randomUUID());

function App(){
  const publishMove = db.rooms.usePublishTopic(room, "move");

  const [slider,setSlider] = useState(50);
  const [lat,setLat] = useState("Esperando movimiento remoto...");
  const [textArea,setTextArea] = useState("");
  const [paddleAngle,setPaddleAngle] = useState(0);
  const [sensorStatus,setSensorStatus] = useState("Sensor no iniciado");
  const [sensorInfo,setSensorInfo] = useState("Abrí esta misma página en el celular y tocá ‘Activar sensores’. En la PC deberías ver moverse la paleta.");
  const [debug,setDebug] = useState("Sin datos de sensores todavía.");

  const canvasRef = useRef(null);
  const sliderRef = useRef(slider);
  const textAreaRef = useRef("");
  const paddleAngleRef = useRef(0);
  const lastSend = useRef(0);
  const draggingPaddle = useRef(false);
  const sensorEvents = useRef({orientation:0,motion:0,lastOrientationTime:0,lastMotionTime:0});
  const sensorMode = useRef("none");

  db.rooms.useTopicEffect(room, "move", (msg) => {
    if (!msg || msg.clientId === CLIENT_ID) return;

    if (msg.type === "text") {
      const incomingText = String(msg.text ?? "");
      textAreaRef.current = incomingText;
      setTextArea(incomingText);
      setLat("Latencia texto aprox: " + (Date.now() - Number(msg.sentAt)) + " ms");
      return;
    }

    if (msg.type === "paddle") {
      const incomingAngle = clamp(Number(msg.angle ?? 0), -60, 60);
      paddleAngleRef.current = incomingAngle;
      setPaddleAngle(incomingAngle);
      setLat("Latencia paleta aprox: " + (Date.now() - Number(msg.sentAt)) + " ms");
      return;
    }

    if (msg.type === "slider") {
      const s = Number(msg.slider);
      sliderRef.current = s;
      setSlider(s);
      setLat("Latencia slider aprox: " + (Date.now() - Number(msg.sentAt)) + " ms");
    }
  });

  useEffect(()=>drawPaddle(canvasRef.current, paddleAngle), [paddleAngle]);

  function publish(payload){
    publishMove({
      ...payload,
      clientId: CLIENT_ID,
      sentAt: Date.now()
    });
  }

  function sendSlider(){
    const now = Date.now();
    if (now - lastSend.current < 33) return;
    lastSend.current = now;

    publish({
      type: "slider",
      slider: sliderRef.current
    });
  }

  function sendPaddle(angle, immediate=false){
    const now = Date.now();
    if (!immediate && now - lastSend.current < 33) return;
    lastSend.current = now;

    publish({
      type: "paddle",
      angle
    });
  }

  function applyPaddleAngle(angle, sourceLabel){
    const clean = clamp(Number(angle || 0), -60, 60);
    paddleAngleRef.current = clean;
    setPaddleAngle(clean);
    sendPaddle(clean);
    sensorMode.current = sourceLabel;
  }

  function onSlider(e){
    const v = Number(e.target.value);
    sliderRef.current = v;
    setSlider(v);
    sendSlider();
  }

  function onTextArea(e){
    const value = e.target.value;
    textAreaRef.current = value;
    setTextArea(value);

    publish({
      type: "text",
      text: value
    });
  }

  async function activateSensors(){
    try{
      const secure = window.isSecureContext;
      const hasOrientation = !!window.DeviceOrientationEvent;
      const hasMotion = !!window.DeviceMotionEvent;

      setSensorStatus("Pidiendo/activando sensores...");
      setDebug(
        `secureContext: ${secure}\n` +
        `DeviceOrientationEvent: ${hasOrientation}\n` +
        `DeviceMotionEvent: ${hasMotion}\n` +
        `orientation permission API: ${typeof DeviceOrientationEvent?.requestPermission === "function"}\n` +
        `motion permission API: ${typeof DeviceMotionEvent?.requestPermission === "function"}`
      );

      if (!secure) {
        setSensorStatus("Esta página no está en contexto seguro. Probalo en GitHub Pages/HTTPS, no en file://.");
        return;
      }

      if (hasOrientation && typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          setSensorStatus("Permiso de orientación denegado.");
          return;
        }
      }

      if (hasMotion && typeof DeviceMotionEvent.requestPermission === "function") {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission !== "granted") {
          setSensorStatus("Permiso de movimiento denegado.");
          return;
        }
      }

      window.removeEventListener("deviceorientation", onDeviceOrientation, true);
      window.removeEventListener("devicemotion", onDeviceMotion, true);

      if (hasOrientation) window.addEventListener("deviceorientation", onDeviceOrientation, true);
      if (hasMotion) window.addEventListener("devicemotion", onDeviceMotion, true);

      setSensorStatus("Sensores activados. Mové/incliná el celular.");
      setSensorInfo("Usando deviceorientation y devicemotion en paralelo. El sistema toma el dato que cambie mejor.");

      setTimeout(() => {
        const ev = sensorEvents.current;
        if (ev.orientation === 0 && ev.motion === 0) {
          setSensorStatus("Sensores activados, pero no llegó ningún evento. Revisá permisos del navegador/sistema.");
        } else if (ev.orientation <= 1 && ev.motion <= 1) {
          setSensorStatus("Llegó solo uno o pocos eventos. El navegador podría estar congelando sensores.");
        } else {
          setSensorStatus(`Sensores activos · orientation: ${ev.orientation} · motion: ${ev.motion} · modo: ${sensorMode.current}`);
        }
      }, 2500);
    }catch(err){
      setSensorStatus("Error activando sensor: " + (err?.message || String(err)));
    }
  }

  function onDeviceOrientation(e){
    sensorEvents.current.orientation++;
    sensorEvents.current.lastOrientationTime = Date.now();

    const gamma = Number(e.gamma ?? 0); // izquierda/derecha en vertical
    const beta = Number(e.beta ?? 0);
    const alpha = Number(e.alpha ?? 0);

    // Si gamma está disponible y cambia, es el dato más directo para nuestro paddle.
    const angle = clamp(gamma, -60, 60);
    applyPaddleAngle(angle, "deviceorientation.gamma");

    setSensorInfo(`orientation → alpha: ${alpha.toFixed(1)}° · beta: ${beta.toFixed(1)}° · gamma: ${gamma.toFixed(1)}°`);
    updateDebug(alpha,beta,gamma,null,null,null);
  }

  function onDeviceMotion(e){
    sensorEvents.current.motion++;
    sensorEvents.current.lastMotionTime = Date.now();

    const acc = e.accelerationIncludingGravity || e.acceleration || {x:0,y:0,z:0};
    const ax = Number(acc.x ?? 0);
    const ay = Number(acc.y ?? 0);
    const az = Number(acc.z ?? 0);

    // Fallback por gravedad: estimación de roll/inclinación izquierda-derecha.
    // En muchos Android, x cambia bastante al inclinar el celular lateralmente.
    const rollRad = Math.atan2(ax, Math.sqrt(ay*ay + az*az));
    const rollDeg = rollRad * 180 / Math.PI;

    // Solo usamos motion como fuente principal si orientation no está llegando fluido
    // o si el modo actual todavía no se estableció.
    const now = Date.now();
    const orientationStale = now - sensorEvents.current.lastOrientationTime > 250;
    if (orientationStale || sensorMode.current === "none") {
      applyPaddleAngle(clamp(rollDeg, -60, 60), "devicemotion.gravity");
      setSensorInfo(`motion → ax: ${ax.toFixed(2)} · ay: ${ay.toFixed(2)} · az: ${az.toFixed(2)} · roll: ${rollDeg.toFixed(1)}°`);
    }

    updateDebug(null,null,null,ax,ay,az);
  }

  function updateDebug(alpha,beta,gamma,ax,ay,az){
    const ev = sensorEvents.current;
    setDebug(
      `secureContext: ${window.isSecureContext}\n` +
      `eventos orientation: ${ev.orientation}\n` +
      `eventos motion: ${ev.motion}\n` +
      `modo usado: ${sensorMode.current}\n` +
      `paddle: ${paddleAngleRef.current.toFixed(2)}°\n` +
      `alpha: ${fmt(alpha)} · beta: ${fmt(beta)} · gamma: ${fmt(gamma)}\n` +
      `ax: ${fmt(ax)} · ay: ${fmt(ay)} · az: ${fmt(az)}`
    );
  }

  function calibrateZero(){
    paddleAngleRef.current = 0;
    setPaddleAngle(0);
    sendPaddle(0, true);
    setSensorInfo("Paleta centrada manualmente. Ahora incliná el celular para probar cambios.");
  }

  function onCanvasPointerDown(e){
    draggingPaddle.current = true;
    e.currentTarget.setPointerCapture(e.pointerId);
    updatePaddleFromPointer(e, true);
  }

  function onCanvasPointerMove(e){
    if (!draggingPaddle.current) return;
    updatePaddleFromPointer(e, false);
  }

  function onCanvasPointerUp(e){
    draggingPaddle.current = false;
    updatePaddleFromPointer(e, true);
  }

  function updatePaddleFromPointer(e, immediate){
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const normalized = (x / rect.width) * 2 - 1;
    const angle = clamp(normalized * 60, -60, 60);

    paddleAngleRef.current = angle;
    setPaddleAngle(angle);
    sendPaddle(angle, immediate);
  }

  return React.createElement("div", null,
    React.createElement("div", {className:"card"},
      React.createElement("p", {className:"muted"}, lat),
      React.createElement("label", null, "Slider: ", React.createElement("b", null, slider)),
      React.createElement("input", {type:"range", min:0, max:100, value:slider, onInput:onSlider})
    ),
    React.createElement("div", {className:"card"},
      React.createElement("p", {className:"muted"}, "Textarea colaborativo por topic. Si dos dispositivos escriben a la vez, gana el último mensaje recibido."),
      React.createElement("textarea", {
        value:textArea,
        onChange:onTextArea,
        placeholder:"Escribí acá y mirá cómo aparece en el otro dispositivo..."
      })
    ),
    React.createElement("div", {className:"card"},
      React.createElement("p", null,
        "Paleta por inclinación ",
        React.createElement("span", {className:"badge"}, paddleAngle.toFixed(1), "°")
      ),
      React.createElement("p", {className:"muted"}, sensorInfo),
      React.createElement("p", {className:"muted"}, sensorStatus),
      React.createElement("button", {onClick:activateSensors}, "Activar sensores"),
      React.createElement("button", {onClick:calibrateZero}, "Centrar paleta"),
      React.createElement("br"),
      React.createElement("br"),
      React.createElement("canvas", {
        ref:canvasRef,
        width:400,
        height:300,
        onPointerDown:onCanvasPointerDown,
        onPointerMove:onCanvasPointerMove,
        onPointerUp:onCanvasPointerUp,
        onPointerCancel:onCanvasPointerUp
      }),
      React.createElement("p", {className:"muted"}, "Fallback: también podés arrastrar horizontalmente sobre el canvas para simular la inclinación."),
      React.createElement("div", {className:"debug"}, debug)
    )
  );
}

function drawPaddle(canvas, angleDeg){
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,w,h);

  const paddleW = 120;
  const paddleH = 8;
  const cx = w / 2;
  const cy = h - 35;
  const r = 5;
  const angle = angleDeg * Math.PI / 180;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  const grad = ctx.createLinearGradient(-paddleW/2,0,paddleW/2,0);
  grad.addColorStop(0,"#3036d8");
  grad.addColorStop(0.5,"#4a4ff0");
  grad.addColorStop(1,"#3036d8");
  ctx.fillStyle = grad;

  roundedRect(ctx, -paddleW/2, -paddleH/2, paddleW, paddleH, r);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.font = "13px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(`${angleDeg.toFixed(1)}°`, cx, h - 12);
}

function roundedRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function clamp(n, min, max){
  return Math.max(min, Math.min(max, n));
}

function fmt(v){
  return v === null || v === undefined || Number.isNaN(Number(v)) ? "-" : Number(v).toFixed(2);
}

function showError(err){
  const el=document.getElementById("error");
  el.style.display="block";
  el.textContent=err?.stack || err?.message || String(err);
  document.getElementById("root").textContent="Error cargando app.";
}

try{
  createRoot(document.getElementById("root")).render(React.createElement(App));
}catch(err){
  showError(err);
}
window.addEventListener("error", e=>showError(e.error || e.message));
window.addEventListener("unhandledrejection", e=>showError(e.reason));
</script>
</body>
</html>
