<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fighter MP · P2P test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.card{background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;backdrop-filter:blur(6px);font-size:12px}.net{font-family:ui-monospace,monospace}.ok{color:#9cffb5}.wait{color:#ffd77d}.bad{color:#ff8a8a}
#bars{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(620px,64vw);display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.hp{height:14px;background:#3a1515;border:1px solid #ffffff35;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#d74,#f8d56b);transition:width .1s linear}.right .fill{margin-left:auto}.vs{font-weight:900;font-size:12px;opacity:.8}
#help{position:absolute;left:12px;bottom:12px;max-width:380px;line-height:1.45}.clips{opacity:.58;margin-top:5px;font:10px ui-monospace,monospace;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mobile{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}.pad{pointer-events:auto;position:absolute;bottom:18px;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff40;background:#ffffff18;color:#fff;font-weight:800;display:grid;place-items:center;user-select:none;touch-action:none}.move{bottom:22px}.btnA{right:92px}.btnB{right:25px}.btnG{right:58px;bottom:92px}.left{left:24px}.rightmove{left:92px}.back{left:58px;bottom:92px}
#splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#111;text-align:center}.spin{width:36px;height:36px;border:4px solid #ffffff25;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}
@media(pointer:coarse){#mobile{display:block}#help{display:none}.card{font-size:10px}#bars{width:92vw;top:58px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div id="splash"><div><div class="spin"></div><b>Cargando fighter P2P…</b><div style="opacity:.55;font-size:12px;margin-top:7px">KayKit Barbarian · CC0</div></div></div>
<div id="hud">
 <div class="top"><div class="card"><b>FIGHTER MP</b><br><span style="opacity:.6">prototipo WebRTC P2P</span></div><div class="card net"><span id="netState" class="wait">P2P · CONECTANDO</span><br><span id="peerCount">JUGADORES · 1</span><br><span id="rtt">RTT · — ms</span></div></div>
 <div id="bars"><div class="hp"><div id="hp1" class="fill"></div></div><div class="vs">VS</div><div class="hp right"><div id="hp2" class="fill"></div></div></div>
 <div id="help" class="card"><b>A/D</b> mover · <b>W/S</b> profundidad · <b>J</b> golpe · <b>K</b> patada · <b>L</b> bloquear · <b>R</b> reset<div id="clips" class="clips">clips: cargando…</div></div>
</div>
<div id="mobile">
 <div class="pad move left" data-key="a">◀</div><div class="pad move rightmove" data-key="d">▶</div><div class="pad back" data-key="w">▲</div>
 <div class="pad btnA" data-key="j">P</div><div class="pad btnB" data-key="k">K</div><div class="pad btnG" data-key="l">B</div>
</div>
<script>
window.addEventListener('error',e=>{const s=document.getElementById('splash');if(s){s.style.display='grid';s.innerHTML='<div><b style=\"color:#ff9b9b\">ERROR DE ARRANQUE</b><br><small style=\"display:block;max-width:80vw;margin-top:8px;opacity:.8\">'+String(e.message||e.error||'Error desconocido')+'</small></div>';}});
window.addEventListener('unhandledrejection',e=>{const s=document.getElementById('splash');if(s){s.style.display='grid';s.innerHTML='<div><b style=\"color:#ff9b9b\">ERROR DE ARRANQUE</b><br><small style=\"display:block;max-width:80vw;margin-top:8px;opacity:.8\">'+String(e.reason?.message||e.reason||'Promise rechazada')+'</small></div>';}});
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {joinRoom,selfId} from 'https://esm.sh/trystero@0.25.3';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x17191d);scene.fog=new THREE.Fog(0x17191d,12,28);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,60);camera.position.set(0,4.2,8.5);camera.lookAt(0,1.3,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdde7ff,0x362a25,2.1));const sun=new THREE.DirectionalLight(0xfff1da,3.2);sun.position.set(3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(5.4,5.4,.32,48),new THREE.MeshStandardMaterial({color:0x4a4e55,roughness:.9,metalness:.05}));floor.position.y=-.18;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(4.72,.07,12,72),new THREE.MeshStandardMaterial({color:0xe2bd63,emissive:0x513912,emissiveIntensity:.4}));ring.rotation.x=Math.PI/2;ring.position.y=.005;scene.add(ring);
for(let i=0;i<20;i++){const a=i/20*Math.PI*2;const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.8,.12),new THREE.MeshStandardMaterial({color:0x30343a}));m.position.set(Math.cos(a)*5.25,.4,Math.sin(a)*5.25);scene.add(m)}

const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['j','k'].includes(e.key.toLowerCase())&&!e.repeat)tryAttack(e.key.toLowerCase()==='j'?'punch':'kick');if(e.key.toLowerCase()==='r')resetLocal(true)});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);if(k==='j')tryAttack('punch');if(k==='k')tryAttack('kick')});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys.delete(k))) });

const loader=new GLTFLoader();let source=null,clips=[];let clipMap={};const fighters=new Map();let local=null;let remoteId=null;let lastSend=0;let lastPing=0;let pingSeq=0;const pingSent=new Map();let rtts=[];
const ROOM='mateo-fightermp-v1';const room=joinRoom({appId:'mateo-tools-fightermp'},ROOM);const [sendState,getState]=room.makeAction('fighter-state');const [sendHit,getHit]=room.makeAction('fighter-hit');const [sendPing,getPing]=room.makeAction('fighter-ping');const [sendPong,getPong]=room.makeAction('fighter-pong');const [sendReset,getReset]=room.makeAction('fighter-reset');

function pickClip(rx,fallback){return clips.find(c=>rx.test(c.name))||fallback||clips[0]||null}
function buildClipMap(){const idle=pickClip(/idle|stand/i);const walk=pickClip(/walk|run/i,idle);const attacks=clips.filter(c=>/attack|punch|slash|melee|swing|kick/i.test(c.name));const block=pickClip(/block|guard|defen/i,idle);const hit=pickClip(/hit|impact|damage|hurt/i,idle);const death=pickClip(/death|die|knock/i,hit);clipMap={idle,walk,punch:attacks[0]||pickClip(/attack/i,idle),kick:attacks[1]||attacks[0]||idle,block,hit,death};document.getElementById('clips').textContent='clips: '+clips.map(c=>c.name).slice(0,15).join(' · ')}
function makeFighter(id,isLocal){const g=new THREE.Group();scene.add(g);const model=SkeletonUtils.clone(source);g.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(!isLocal){o.material=o.material.clone();o.material.color.multiplyScalar(.72);o.material.emissive=new THREE.Color(0x132544);o.material.emissiveIntensity=.32}}});
 const box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3();box.getSize(size);const scale=1.82/Math.max(size.y,.001);model.scale.setScalar(scale);const box2=new THREE.Box3().setFromObject(model);model.position.y-=box2.min.y;
 const mixer=new THREE.AnimationMixer(model);const acts={};for(const [k,c] of Object.entries(clipMap))if(c){const a=mixer.clipAction(c);a.enabled=true;acts[k]=a}const f={id,isLocal,g,model,mixer,acts,current:'',x:isLocal?-1.75:1.75,z:0,yaw:0,hp:100,block:false,attack:null,attackT:0,attackHit:false,targetX:isLocal?-1.75:1.75,targetZ:0,targetYaw:0,targetHp:100,lastSeen:performance.now()};fighters.set(id,f);play(f,'idle',.01);return f}
function play(f,name,fade=.12){if(f.current===name)return;const n=f.acts[name]||f.acts.idle;if(!n)return;const old=f.acts[f.current];if(old)old.fadeOut(fade);n.reset().fadeIn(fade).play();if(['punch','kick','hit','death'].includes(name)){n.setLoop(THREE.LoopOnce,1);n.clampWhenFinished=true}else n.setLoop(THREE.LoopRepeat,Infinity);f.current=name}

function assignSides(){const ids=[selfId,...fighters.keys()].filter((v,i,a)=>a.indexOf(v)===i).sort();const mySide=ids.indexOf(selfId)<=0?0:1;if(local&&local.side!==mySide){local.side=mySide;if(local.spawned!==true){local.x=mySide===0?-1.75:1.75;local.spawned=true}}}
function tryAttack(type){if(!local||local.hp<=0||local.attack||local.block)return;local.attack=type;local.attackT=0;local.attackHit=false;play(local,type,.05)}
function resetLocal(broadcast=false){if(!local)return;local.hp=100;local.attack=null;local.block=false;local.x=local.side===1?1.75:-1.75;local.z=0;play(local,'idle',.05);if(broadcast)sendReset({t:Date.now()})}
function faceOpponent(f,opp){if(!opp)return;f.yaw=Math.atan2(opp.x-f.x,opp.z-f.z);f.g.rotation.y=f.yaw}
function attackActive(f){if(!f.attack)return false;return f.attack==='punch'?(f.attackT>.18&&f.attackT<.38):(f.attackT>.22&&f.attackT<.5)}
function attackRange(f){return f.attack==='kick'?1.5:1.18}
function damageFor(f){return f.attack==='kick'?16:10}
function updateLocal(dt){if(!local)return;local.block=keys.has('l')&&!local.attack&&local.hp>0;let dx=0,dz=0;if(!local.attack&&!local.block&&local.hp>0){if(keys.has('a'))dx-=1;if(keys.has('d'))dx+=1;if(keys.has('w'))dz-=1;if(keys.has('s'))dz+=1}const len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;local.x=THREE.MathUtils.clamp(local.x+dx*2.25*dt,-4,4);local.z=THREE.MathUtils.clamp(local.z+dz*1.65*dt,-2.7,2.7);const r=Math.hypot(local.x,local.z);if(r>4.25){local.x*=4.25/r;local.z*=4.25/r}local.g.position.set(local.x,0,local.z);const opp=remoteId&&fighters.get(remoteId);faceOpponent(local,opp);
 if(local.attack){local.attackT+=dt;if(attackActive(local)&&!local.attackHit&&opp&&opp.hp>0){const d=Math.hypot(opp.x-local.x,opp.z-local.z);if(d<attackRange(local)){local.attackHit=true;sendHit({id:crypto.randomUUID(),from:selfId,to:remoteId,damage:damageFor(local),type:local.attack,t:Date.now()})}}const end=local.attack==='kick'?.78:.62;if(local.attackT>end){local.attack=null;local.attackT=0;play(local,'idle')}}
 else if(local.block)play(local,'block');else if(Math.hypot(dx,dz)>.1)play(local,'walk');else play(local,'idle');
}
function updateRemote(dt){if(!remoteId)return;const f=fighters.get(remoteId);if(!f)return;f.x=THREE.MathUtils.lerp(f.x,f.targetX,1-Math.pow(.001,dt));f.z=THREE.MathUtils.lerp(f.z,f.targetZ,1-Math.pow(.001,dt));f.yaw=THREE.MathUtils.lerp(f.yaw,f.targetYaw,1-Math.pow(.001,dt));f.hp=THREE.MathUtils.lerp(f.hp,f.targetHp,1-Math.pow(.02,dt));f.g.position.set(f.x,0,f.z);f.g.rotation.y=f.yaw}
function sendLocalState(now){if(!local||now-lastSend<50)return;lastSend=now;sendState({x:local.x,z:local.z,yaw:local.yaw,hp:local.hp,block:local.block,action:local.attack||local.current,t:Date.now()})}
function hud(){document.getElementById('peerCount').textContent='JUGADORES · '+(1+(remoteId?1:0));document.getElementById('hp1').style.width=(local?.side===1?(fighters.get(remoteId)?.hp??100):(local?.hp??100))+'%';document.getElementById('hp2').style.width=(local?.side===1?(local?.hp??100):(fighters.get(remoteId)?.hp??100))+'%'}

room.onPeerJoin(id=>{remoteId=id;document.getElementById('netState').textContent='P2P · CONECTADO';document.getElementById('netState').className='ok';if(source&&!fighters.has(id))makeFighter(id,false);assignSides()});room.onPeerLeave(id=>{if(fighters.has(id)){scene.remove(fighters.get(id).g);fighters.delete(id)}if(remoteId===id)remoteId=null;document.getElementById('netState').textContent='P2P · ESPERANDO RIVAL';document.getElementById('netState').className='wait'});
getState((d,id)=>{if(!source)return;if(!fighters.has(id))makeFighter(id,false);remoteId=id;const f=fighters.get(id);f.targetX=d.x;f.targetZ=d.z;f.targetYaw=d.yaw;f.targetHp=d.hp;f.block=!!d.block;f.lastSeen=performance.now();const a=d.action||'idle';if(a!==f.current)play(f,a,.08);assignSides()});
const seenHits=new Set();getHit((d,id)=>{if(!local||d.to!==selfId||seenHits.has(d.id))return;seenHits.add(d.id);let dmg=d.damage||10;if(local.block)dmg=Math.max(2,Math.round(dmg*.25));local.hp=Math.max(0,local.hp-dmg);if(local.hp<=0)play(local,'death',.03);else play(local,'hit',.03)});getReset(()=>resetLocal(false));
getPing((d,id)=>sendPong({seq:d.seq,t:d.t},id));getPong((d,id)=>{const sent=pingSent.get(d.seq);if(sent){const v=performance.now()-sent;pingSent.delete(d.seq);rtts.push(v);if(rtts.length>8)rtts.shift();document.getElementById('rtt').textContent='RTT · '+Math.round(rtts.reduce((a,b)=>a+b,0)/rtts.length)+' ms'}});

loader.load('fightermp/Barbarian.glb',g=>{source=g.scene;clips=g.animations||[];buildClipMap();local=makeFighter(selfId,true);local.side=0;assignSides();document.getElementById('splash').style.display='none';document.getElementById('netState').textContent='P2P · ESPERANDO RIVAL';document.getElementById('netState').className='wait'},undefined,e=>{document.querySelector('#splash div').innerHTML='<b>Error cargando Barbarian.glb</b><br><small>'+e.message+'</small>';console.error(e)});

const clock=new THREE.Clock();function frame(now){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(local){updateLocal(dt);updateRemote(dt);for(const f of fighters.values())f.mixer.update(dt);sendLocalState(now);if(remoteId&&now-lastPing>1000){lastPing=now;const seq=++pingSeq;pingSent.set(seq,performance.now());sendPing({seq,t:Date.now()},remoteId)}hud()}renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
