<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fighter MP · P2P test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{display:block}.card{background:#0008;border:1px solid #ffffff25;border-radius:10px;padding:8px 10px;backdrop-filter:blur(6px)}#hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:10px;font-size:12px}.net{font-family:ui-monospace,monospace}.ok{color:#9cffb5}.wait{color:#ffd77d}.bad{color:#ff8a8a}#bars{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(620px,62vw);display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.hp{height:14px;background:#3a1515;border:1px solid #ffffff35;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#d74,#f8d56b);transition:width .08s linear}.right .fill{margin-left:auto}.vs{font-weight:900;font-size:12px}.help{position:absolute;left:12px;bottom:12px;font-size:12px;line-height:1.45;max-width:430px}.clips{opacity:.55;font:10px ui-monospace,monospace;margin-top:5px;max-width:400px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#splash{position:fixed;inset:0;z-index:20;background:#111;display:grid;place-items:center;text-align:center}.spin{width:36px;height:36px;border:4px solid #ffffff25;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}#mobile{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}.pad{pointer-events:auto;position:absolute;width:62px;height:62px;border-radius:50%;border:1px solid #ffffff45;background:#ffffff18;display:grid;place-items:center;font-weight:900;user-select:none;touch-action:none}.left1{left:22px;bottom:24px}.right1{left:94px;bottom:24px}.up1{left:58px;bottom:96px}.down1{left:58px;bottom:24px;transform:translateY(72px)}.punch{right:96px;bottom:25px}.kick{right:24px;bottom:25px}.block{right:60px;bottom:98px}@media(pointer:coarse){#mobile{display:block}.help{display:none}#bars{width:94vw;top:58px}.top{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div id="splash"><div><div class="spin"></div><b>Cargando fighter P2P…</b><div style="opacity:.55;font-size:12px;margin-top:7px">KayKit Barbarian · CC0</div></div></div>
<div id="hud">
  <div class="top"><div class="card"><b>FIGHTER MP</b><br><span style="opacity:.6">WebRTC P2P · 1v1</span></div><div class="card net"><span id="netState" class="wait">P2P · CONECTANDO</span><br><span id="peerCount">JUGADORES · 1</span><br><span id="rtt">RTT · — ms</span></div></div>
  <div id="bars"><div class="hp"><div id="hp1" class="fill"></div></div><div class="vs">VS</div><div class="hp right"><div id="hp2" class="fill"></div></div></div>
  <div class="help card"><b>A/D</b> lateral · <b>W/S</b> profundidad · <b>J</b> golpe · <b>K</b> patada · <b>L</b> bloqueo · <b>R</b> reset<div id="clips" class="clips">clips: cargando…</div></div>
</div>
<div id="mobile"><div class="pad left1" data-key="a">◀</div><div class="pad right1" data-key="d">▶</div><div class="pad up1" data-key="w">▲</div><div class="pad punch" data-key="j">P</div><div class="pad kick" data-key="k">K</div><div class="pad block" data-key="l">B</div></div>
<script>
function fatal(msg){const s=document.getElementById('splash');if(s){s.style.display='grid';s.innerHTML='<div><b style="color:#ff9b9b">ERROR DE ARRANQUE</b><br><small style="display:block;max-width:82vw;margin-top:8px;opacity:.8">'+String(msg)+'</small></div>'}}
window.addEventListener('error',e=>fatal(e.message||e.error||'Error desconocido'));
window.addEventListener('unhandledrejection',e=>fatal(e.reason?.message||e.reason||'Promise rechazada'));
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {joinRoom,selfId} from 'https://esm.sh/trystero@0.25.3';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x17191d);scene.fog=new THREE.Fog(0x17191d,12,28);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,60);camera.position.set(0,4.1,8.7);camera.lookAt(0,1.25,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdde7ff,0x362a25,2));const sun=new THREE.DirectionalLight(0xfff1da,3);sun.position.set(3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(5.4,5.4,.3,48),new THREE.MeshStandardMaterial({color:0x4a4e55,roughness:.9}));floor.position.y=-.17;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(4.72,.07,12,72),new THREE.MeshStandardMaterial({color:0xe2bd63,emissive:0x513912,emissiveIntensity:.4}));ring.rotation.x=Math.PI/2;ring.position.y=.006;scene.add(ring);
for(let i=0;i<20;i++){const a=i/20*Math.PI*2;const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.8,.12),new THREE.MeshStandardMaterial({color:0x30343a}));m.position.set(Math.cos(a)*5.25,.4,Math.sin(a)*5.25);scene.add(m)}

const netState=document.getElementById('netState'),peerCount=document.getElementById('peerCount'),rttEl=document.getElementById('rtt');
const room=joinRoom({appId:'mateo-tools-fightermp'},'mateo-fightermp-v2',{onJoinError:({error})=>{netState.textContent='P2P · ERROR';netState.className='bad';console.warn(error)}});
const stateAction=room.makeAction('fighter-state-v2');
const hitAction=room.makeAction('fighter-hit-v2');
const resetAction=room.makeAction('fighter-reset-v2');

const keys=new Set();let source=null,clips=[],clipMap={},local=null,remote=null,remoteId=null,lastSend=0,lastPing=0,rtts=[];
function press(k,on){k=k.toLowerCase();if(on){keys.add(k);if((k==='j'||k==='k')&&!local?.attack)tryAttack(k==='j'?'punch':'kick');if(k==='r')reset(true)}else keys.delete(k)}
addEventListener('keydown',e=>{if(!e.repeat)press(e.key,true);else keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>press(e.key,false));
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);press(k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>press(k,false))) });

function pick(rx,fallback){return clips.find(c=>rx.test(c.name))||fallback||clips[0]||null}
function buildClipMap(){const idle=pick(/idle|stand/i),walk=pick(/walk|run/i,idle),att=clips.filter(c=>/attack|punch|slash|melee|swing|kick/i.test(c.name));clipMap={idle,walk,punch:att[0]||idle,kick:att[1]||att[0]||idle,block:pick(/block|guard|defen/i,idle),hit:pick(/hit|impact|damage|hurt/i,idle),death:pick(/death|die|knock/i,idle)};document.getElementById('clips').textContent='clips: '+clips.map(c=>c.name).slice(0,18).join(' · ')}
function makeFighter(isLocal){const root=new THREE.Group();scene.add(root);const model=SkeletonUtils.clone(source);root.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(!isLocal){const mats=Array.isArray(o.material)?o.material:[o.material];const cm=mats.map(m=>{const n=m.clone();if(n.color)n.color.multiplyScalar(.72);n.emissive=new THREE.Color(0x132544);n.emissiveIntensity=.28;return n});o.material=Array.isArray(o.material)?cm:cm[0]}}});const b=new THREE.Box3().setFromObject(model),sz=new THREE.Vector3();b.getSize(sz);model.scale.setScalar(1.82/Math.max(sz.y,.001));const b2=new THREE.Box3().setFromObject(model);model.position.y-=b2.min.y;const mixer=new THREE.AnimationMixer(model),acts={};for(const [k,c] of Object.entries(clipMap))if(c)acts[k]=mixer.clipAction(c);return {root,model,mixer,acts,current:'',x:isLocal?-1.7:1.7,z:0,yaw:0,hp:100,block:false,attack:null,attackT:0,attackHit:false,targetX:isLocal?-1.7:1.7,targetZ:0,targetYaw:0,targetHp:100}}
function play(f,name,fade=.1){if(!f||f.current===name)return;const next=f.acts[name]||f.acts.idle;if(!next)return;const prev=f.acts[f.current];if(prev)prev.fadeOut(fade);next.reset().fadeIn(fade).play();if(['punch','kick','hit','death'].includes(name)){next.setLoop(THREE.LoopOnce,1);next.clampWhenFinished=true}else next.setLoop(THREE.LoopRepeat,Infinity);f.current=name}
function setSides(){if(!local)return;const side=remoteId&&selfId>remoteId?1:0;local.side=side;if(!local.spawned){local.x=side?1.7:-1.7;local.spawned=true}if(remote&&!remote.spawned){remote.x=side?-1.7:1.7;remote.targetX=remote.x;remote.spawned=true}}
function ensureRemote(id){if(remoteId!==id){if(remote){scene.remove(remote.root)}remoteId=id;remote=source?makeFighter(false):null;if(remote)play(remote,'idle',.01);setSides()}return remote}
function tryAttack(type){if(!local||local.hp<=0||local.attack||local.block)return;local.attack=type;local.attackT=0;local.attackHit=false;play(local,type,.04)}
function reset(broadcast=false){if(!local)return;local.hp=100;local.attack=null;local.block=false;local.x=local.side?1.7:-1.7;local.z=0;play(local,'idle',.05);if(broadcast)resetAction.send({t:Date.now()}).catch(()=>{})}
function face(f,o){if(!f||!o)return;f.yaw=Math.atan2(o.x-f.x,o.z-f.z);f.root.rotation.y=f.yaw}
function active(f){return f.attack==='punch'?(f.attackT>.16&&f.attackT<.34):(f.attackT>.2&&f.attackT<.47)}
function updateLocal(dt){if(!local)return;local.block=keys.has('l')&&!local.attack&&local.hp>0;let dx=0,dz=0;if(!local.attack&&!local.block&&local.hp>0){if(keys.has('a'))dx--;if(keys.has('d'))dx++;if(keys.has('w'))dz--;if(keys.has('s'))dz++}const len=Math.hypot(dx,dz)||1;dx/=len;dz/=len;local.x+=dx*2.35*dt;local.z+=dz*1.7*dt;local.x=THREE.MathUtils.clamp(local.x,-4,4);local.z=THREE.MathUtils.clamp(local.z,-2.7,2.7);const rad=Math.hypot(local.x,local.z);if(rad>4.25){local.x*=4.25/rad;local.z*=4.25/rad}local.root.position.set(local.x,0,local.z);face(local,remote);
if(local.attack){local.attackT+=dt;if(active(local)&&!local.attackHit&&remote&&remote.hp>0){const d=Math.hypot(remote.x-local.x,remote.z-local.z),range=local.attack==='kick'?1.55:1.2;if(d<range){local.attackHit=true;hitAction.send({id:crypto.randomUUID(),to:remoteId,damage:local.attack==='kick'?16:10,type:local.attack},{target:remoteId}).catch(()=>{})}}const end=local.attack==='kick'?.76:.6;if(local.attackT>end){local.attack=null;local.attackT=0;play(local,'idle')}}else if(local.block)play(local,'block');else if(Math.hypot(dx,dz)>.1)play(local,'walk');else play(local,'idle')}
function updateRemote(dt){if(!remote)return;const k=1-Math.exp(-dt*18);remote.x=THREE.MathUtils.lerp(remote.x,remote.targetX,k);remote.z=THREE.MathUtils.lerp(remote.z,remote.targetZ,k);let d=(remote.targetYaw-remote.yaw+Math.PI)%(Math.PI*2)-Math.PI;if(d<-Math.PI)d+=Math.PI*2;remote.yaw+=d*k;remote.hp=THREE.MathUtils.lerp(remote.hp,remote.targetHp,k);remote.root.position.set(remote.x,0,remote.z);remote.root.rotation.y=remote.yaw}
function sendState(now){if(!local||now-lastSend<50)return;lastSend=now;stateAction.send({x:local.x,z:local.z,yaw:local.yaw,hp:local.hp,block:local.block,action:local.attack||local.current}).catch(()=>{})}
function drawHud(){peerCount.textContent='JUGADORES · '+(remoteId?2:1);const leftHp=local?.side===1?(remote?.hp??100):(local?.hp??100),rightHp=local?.side===1?(local?.hp??100):(remote?.hp??100);document.getElementById('hp1').style.width=Math.max(0,leftHp)+'%';document.getElementById('hp2').style.width=Math.max(0,rightHp)+'%'}

room.onPeerJoin=id=>{ensureRemote(id);netState.textContent='P2P · CONECTADO';netState.className='ok';setSides()};
room.onPeerLeave=id=>{if(id!==remoteId)return;if(remote)scene.remove(remote.root);remote=null;remoteId=null;netState.textContent='P2P · ESPERANDO RIVAL';netState.className='wait';rttEl.textContent='RTT · — ms'};
stateAction.onMessage=(d,{peerId})=>{if(!d||!source)return;const f=ensureRemote(peerId);if(!f)return;f.targetX=Number(d.x)||0;f.targetZ=Number(d.z)||0;f.targetYaw=Number(d.yaw)||0;f.targetHp=Number.isFinite(d.hp)?d.hp:f.targetHp;f.block=!!d.block;const act=d.action||'idle';if(act!==f.current)play(f,act,.06)};
const seen=new Set();hitAction.onMessage=(d,{peerId})=>{if(!local||!d||d.to!==selfId||seen.has(d.id))return;seen.add(d.id);let dmg=Number(d.damage)||10;if(local.block)dmg=Math.max(2,Math.round(dmg*.25));local.hp=Math.max(0,local.hp-dmg);play(local,local.hp<=0?'death':'hit',.03)};
resetAction.onMessage=()=>reset(false);

new GLTFLoader().load('fightermp/Barbarian.glb',g=>{source=g.scene;clips=g.animations||[];buildClipMap();local=makeFighter(true);play(local,'idle',.01);if(remoteId){remote=makeFighter(false);play(remote,'idle',.01)}setSides();document.getElementById('splash').style.display='none';netState.textContent=remoteId?'P2P · CONECTADO':'P2P · ESPERANDO RIVAL';netState.className=remoteId?'ok':'wait'},undefined,e=>fatal('No se pudo cargar Barbarian.glb: '+(e?.message||e)));

const clock=new THREE.Clock();function frame(now){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(local){updateLocal(dt);updateRemote(dt);local.mixer.update(dt);if(remote)remote.mixer.update(dt);sendState(now);if(remoteId&&now-lastPing>1200){lastPing=now;room.ping(remoteId).then(v=>{if(Number.isFinite(v)){rtts.push(v);if(rtts.length>8)rtts.shift();rttEl.textContent='RTT · '+Math.round(rtts.reduce((a,b)=>a+b,0)/rtts.length)+' ms'}}).catch(()=>{})}drawHud()}renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
