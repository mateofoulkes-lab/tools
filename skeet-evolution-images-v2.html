<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de tiro al disco — slideshow en imágenes</title><style>:root{--bg:#0e1620;--panel:#162230;--ink:#f5f7fa;--muted:#afbbc9;--accent:#ef8b22}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}header,footer{padding:12px 18px;background:#101b27;border-bottom:1px solid rgba(255,255,255,.08)}footer{border-top:1px solid rgba(255,255,255,.08);border-bottom:0;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:18px}header h1{margin:0;font-size:18px}header .meta{color:var(--muted);font-size:13px}main{position:relative;display:grid;place-items:center;padding:18px;overflow:hidden}.frame{max-width:min(96vw,1600px);max-height:calc(100vh - 130px);display:grid;place-items:center}img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px;box-shadow:0 25px 65px rgba(0,0,0,.35)}button.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(16,27,39,.82);border:1px solid rgba(255,255,255,.12);color:#fff;width:52px;height:52px;border-radius:999px;font-size:24px;cursor:pointer}button.nav:hover{background:rgba(31,48,68,.95)}#prev{left:18px}#next{right:18px}#dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.dot{width:10px;height:10px;border-radius:999px;background:#445568;cursor:pointer}.dot.on{background:var(--accent)}#caption b{color:#fff}</style></head><body><header><div><h1>Simulador de tiro al disco · slideshow en imágenes</h1><div class="meta">Versión visual exportada en PNG · 12 diapositivas</div></div><div class="meta">Teclas: ← → espacio · F para pantalla completa</div></header><main><button class="nav" id="prev" aria-label="Anterior">‹</button><div class="frame"><img id="slide" alt="Diapositiva"></div><button class="nav" id="next" aria-label="Siguiente">›</button></main><footer><div id="caption"></div><div id="dots"></div></footer><script>const slides=[{src:'skeet_evolution_image_slides/slide_01.png',title:'El problema real'},{src:'skeet_evolution_image_slides/slide_02.png',title:'Celular + página web'},{src:'skeet_evolution_image_slides/slide_03.png',title:'Conexión más directa'},{src:'skeet_evolution_image_slides/slide_04.png',title:'Sensores + radio propia'},{src:'skeet_evolution_image_slides/slide_05.png',title:'Rotación ≠ posición'},{src:'skeet_evolution_image_slides/slide_06.png',title:'Cámara como ayuda'},{src:'skeet_evolution_image_slides/slide_07.png',title:'Láser infrarrojo + cámara'},{src:'skeet_evolution_image_slides/slide_08.png',title:'Medimos la pantalla'},{src:'skeet_evolution_image_slides/slide_09.png',title:'Quest 3S vs Quest 3'},{src:'skeet_evolution_image_slides/slide_10.png',title:'Nuevas posibilidades'},{src:'skeet_evolution_image_slides/slide_11.png',title:'Producto final recomendado'},{src:'skeet_evolution_image_slides/slide_12.png',title:'Cierre'}];const img=document.getElementById('slide'),caption=document.getElementById('caption'),dotsWrap=document.getElementById('dots');let index=Math.max(0,(parseInt(location.hash.replace('#',''))||1)-1);slides.forEach((s,i)=>{const dot=document.createElement('span');dot.className='dot';dot.onclick=()=>show(i);dotsWrap.appendChild(dot)});const dots=[...dotsWrap.children];function show(i){index=(i+slides.length)%slides.length;const s=slides[index];img.src=s.src;img.alt=s.title;caption.innerHTML=`<b>${index+1}/${slides.length}</b> · ${s.title}`;dots.forEach((d,j)=>d.classList.toggle('on',j===index));location.hash=`${index+1}`;document.title=`${s.title} — Simulador de tiro al disco`}function next(){show(index+1)}function prev(){show(index-1)}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;window.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.replace('#',''));if(!isNaN(n)&&n>=1&&n<=slides.length)show(n-1)});show(index);</script></body></html>
