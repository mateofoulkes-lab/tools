<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mazmorra Planetaria RPG — MVP</title>
<style>
  :root{
    --bg:#0b0d10;
    --panel:#151922;
    --panel2:#1d2330;
    --panel3:#242c3b;
    --line:#343d50;
    --text:#edf2ff;
    --muted:#9aa7bd;
    --accent:#8fd3ff;
    --good:#79e28c;
    --bad:#ff6f6f;
    --warn:#ffd166;
    --magic:#c49bff;
    --gold:#ffd36b;
    --green:#71e6a2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(circle at top,#182033 0,#0b0d10 45%,#07080b 100%);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    overflow:hidden;
  }
  button,select{font:inherit;}
  button{
    background:#263044;
    color:var(--text);
    border:1px solid #3a465d;
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    transition:.12s;
  }
  button:hover{background:#33405a; transform:translateY(-1px)}
  button:disabled{opacity:.45; cursor:not-allowed; transform:none}
  .app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;}
  .topbar{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(13,16,22,.88);backdrop-filter:blur(8px);}
  .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pill{border:1px solid var(--line);background:rgba(255,255,255,.045);padding:7px 10px;border-radius:999px;color:var(--muted);white-space:nowrap;}
  .pill strong{color:var(--text)} .timer strong{color:var(--warn)}
  .main{display:grid;grid-template-columns:290px 1fr 330px;gap:12px;padding:12px;min-height:0;}
  .panel{background:linear-gradient(180deg,rgba(31,38,52,.94),rgba(18,22,31,.94));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;min-height:0;}
  .panel h2,.panel h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;letter-spacing:.3px;color:#dfe8ff;background:rgba(255,255,255,.035);}
  .panel-body{padding:12px;overflow:auto;max-height:100%;}
  .map-grid{display:grid;grid-template-columns:repeat(7,32px);grid-auto-rows:32px;gap:5px;justify-content:center;padding:10px 0;}
  .cell{border:1px solid #2c3446;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#101520;color:#657086;position:relative;font-size:17px;}
  .cell.known{background:#202838;color:#cfd8ef}.cell.current{outline:2px solid var(--accent);box-shadow:0 0 14px rgba(143,211,255,.5)}.cell.safe{background:rgba(61,146,94,.25)}.cell.boss{background:rgba(150,72,72,.25)}
  .cell.enemy::after,.cell.corpse::after{content:"";width:7px;height:7px;border-radius:50%;position:absolute;right:4px;top:4px}.cell.enemy::after{background:var(--bad)}.cell.corpse::after{background:#b9b9b9}
  .legend{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
  .scene{display:grid;grid-template-rows:auto 1fr auto;}
  .scene-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .scene-title{font-size:22px;font-weight:800}.scene-subtitle{color:var(--muted);margin-top:3px}.scene-icon{font-size:40px;line-height:1;}
  .scene-content{padding:16px;overflow:auto;min-height:0}.description{line-height:1.55;color:#dce5f6;white-space:pre-line;}
  .actions{padding:12px;border-top:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;gap:8px;flex-wrap:wrap;}
  .log{font-size:13px;line-height:1.35}.log-entry{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.07)}.log-entry.good{color:#b7ffc4}.log-entry.bad{color:#ffb4b4}.log-entry.warn{color:#ffe3a1}.log-entry.magic{color:#ddc3ff}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border-bottom:1px solid var(--line)}.tabs button{font-size:12px;padding:7px 5px}.tabs button.active{background:#3e5275;border-color:#6682af;}
  .statline,.itemline,.skillline,.questline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .muted{color:var(--muted)}.small{font-size:12px}.bar{height:9px;background:#0c1018;border:1px solid #30394c;border-radius:999px;overflow:hidden;min-width:90px}.bar>span{display:block;height:100%;background:var(--good)}.bar.mana>span{background:var(--magic)}.bar.bad>span{background:var(--bad)}
  .char-card{padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.035);margin-bottom:10px}.char-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{padding:8px;border:1px dashed #4a556f;border-radius:12px;min-height:48px;background:rgba(0,0,0,.13)}.slot b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.show{display:flex}.modal-card{width:min(920px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#1f2736,#111722);border:1px solid #4a5872;border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.6)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.modal-body{padding:16px}.combat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.enemy-card{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);margin-bottom:8px}.big-versus{text-align:center;font-size:42px;font-weight:900;color:#ff7676;text-shadow:0 0 20px rgba(255,70,70,.35);margin:10px 0}.footer{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;background:rgba(13,16,22,.9)}.badge{color:#111;background:var(--gold);border-radius:999px;padding:2px 7px;font-size:12px;font-weight:700}.dangerText{color:var(--bad);font-weight:700}.goodText{color:var(--good);font-weight:700}.goldText{color:var(--gold);font-weight:700}.magicText{color:var(--magic);font-weight:700}
  @media(max-width:1050px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.panel{min-height:auto}}
</style>
</head>

function pickLocationEvent(loc){if(loc.type==='safe'||loc.type==='boss'||loc.type==='door')return null;if(!game.storyFlags.janitorSeen&&Math.random()<.16&&loc.type!=='corpse')return 'janitor';const pool=['trap','corpse','bath','minorBox','rare','noise'];if(loc.id==='service_bathroom')return 'bath';if(loc.type==='corpse')return 'corpse';return pool[rnd(0,pool.length-1)]}
function showCurrentEvent(){const ev=game.currentEvent;if(!ev)return;document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').textContent=ev.title;document.getElementById('modalBody').innerHTML=`<p>${ev.text}</p><div class="actions" style="padding:0;border:0;background:none">${ev.choices.map((c,i)=>`<button onclick="resolveEventChoice(${i})">${c.label}</button>`).join('')}</div>`}
function maybeTriggerLocationEvent(locId){if(game.mode!=='explore')return false;const loc={...locations[locId],id:locId};if(!loc||Math.random()>.28)return false;const eventId=pickLocationEvent(loc);if(!eventId||!randomEvents[eventId])return false;game.currentEvent=deepClone(randomEvents[eventId]);showCurrentEvent();return true}
function resolveEventChoice(idx){const ev=game.currentEvent;if(!ev||!ev.choices[idx])return;const res=ev.choices[idx].result||{};if(res.damage){const dmg=rnd(res.damage[0],res.damage[1]);game.player.hp=clamp(game.player.hp-dmg,0,maxHp('player'));notify(`Evento: recibís ${dmg} de daño.`,dmg>14?'bad':'warn')}if(res.loot)(res.loot||[]).forEach(([id,q])=>{addItem(id,q);notify(`Evento loot: ${getItem(id).icon} ${getItem(id).name} x${q}`,'good')});if(res.xp){const g=gainXP(res.xp);notify(`Evento XP: Carl +${g.playerXp} / Dónut +${g.donutXp}.`,'magic')}if(res.status&&addStatus(game.player,res.status))notify(`Estado aplicado: ${statusLabel(res.status)}.`,'bad');if(res.statusRemove){game.player.statuses=game.player.statuses.filter(s=>s!==res.statusRemove);notify(`Estado removido: ${statusLabel(res.statusRemove)}.`,'good')}if(res.permanent&&res.permanent.stat){game.player.stats[res.permanent.stat]=(game.player.stats[res.permanent.stat]||0)+res.permanent.value;notify(`Bonus permanente: ${res.permanent.label||res.permanent.stat} +${res.permanent.value}.`,'gold')}if(res.setFlag)game.storyFlags[res.setFlag]=true;if(res.reveal)(res.reveal||[]).forEach(id=>{if(locations[id]&&!game.revealed.includes(id))game.revealed.push(id)});if(res.log)notify(res.log,res.damage?'warn':'magic');game.currentEvent=null;closeModal();render();if(res.combat)startCombat(res.combat)}
function moveTo(id){if(game.mode!=="explore")return; if(!locations[id])return; if(id==='stairs_to_floor2'&&!isStairsVisible()){notify('La escalera todavía no está desbloqueada.','warn');return} game.location=id; if(!game.explored.includes(id))game.explored.push(id); if(!game.revealed.includes(id))game.revealed.push(id); advanceTime(.15); if(maybeTriggerLocationEvent(id))return; if(locations[id].type!=="safe"&&Math.random()<.18&&(locations[id].encounter||encounterPools[id]))startCombat(generateEncounterForLocation(id)); else render()}
function setSideTab(tab){game.sideTab=tab;renderSide()}
function renderSide(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));const bt=document.getElementById('tab-'+game.sideTab);if(bt)bt.classList.add('active');const panel=document.getElementById("sidePanel");if(game.sideTab==="personaje")panel.innerHTML=renderCharacters()+renderQuests();if(game.sideTab==="inv")panel.innerHTML=renderInventory();if(game.sideTab==="skills")panel.innerHTML=renderSkills();if(game.sideTab==="log")panel.innerHTML=`<div class="log">${game.log.map(e=>`<div class="log-entry ${e.type}">${e.msg}</div>`).join("")}</div>`}
function hpBar(cur,max,type=""){return `<div class="bar ${type}"><span style="width:${pct(cur,max)}%"></span></div>`}
function renderCharacters(){const pS=calcStats("player"),dS=calcStats("donut");return `<div class="char-card"><div class="char-top"><b>🧍 Carl #${game.player.crawlerId}</b><span class="badge">${game.player.badges.join(' ')}</span></div>${hpBar(game.player.hp,maxHp("player"))}<div class="small muted">HP ${game.player.hp}/${maxHp("player")} · MP ${game.player.mana}/${maxMana("player")}</div>${Object.entries(pS).map(([k,v])=>`<div class="statline"><span>${statName(k)}</span><b>${v}</b></div>`).join("")}<div class="small muted">Puntos bloqueados hasta piso 3: ${game.player.statPoints}</div></div><div class="char-card"><div class="char-top"><b>🐱 Princesa Dónut</b><span class="badge">Líder</span></div>${hpBar(game.donut.hp,maxHp("donut"),'mana')}<div class="small muted">HP ${game.donut.hp}/${maxHp("donut")} · MP ${game.donut.mana}/${maxMana("donut")}</div>${Object.entries(dS).map(([k,v])=>`<div class="statline"><span>${statName(k)}</span><b>${v}</b></div>`).join("")}</div>`}
function statName(k){return {strength:"Fuerza",intelligence:"Inteligencia",constitution:"Constitución",dexterity:"Destreza",charisma:"Carisma"}[k]||k}
function renderQuests(){return `<h3>🎯 Objetivos</h3>${game.quests.map(q=>`<div class="questline"><span>${q.done?'✅':'⬜'} ${q.text}</span></div>`).join("")}`}
function itemBonusText(item){if(!item||!item.bonuses)return 'Sin bonus';const keys={strength:'FUE',intelligence:'INT',constitution:'CON',dexterity:'DES',charisma:'CAR',regen:'Regeneración',ironFistGear:'Puño de hierro',powerStrike:'Golpe poderoso',lightFeet:'Pies ligeros',firstImpression:'Buena impresión',reflect:'Reflejo daño %',armor:'Armadura',kickDamage:'Daño patada',stompDamage:'Daño pisotón',explosives:'Explosivos',poisonResist:'Resist veneno %',bleedResist:'Resist hemorragia %',manaRegen:'Regen maná',stunChance:'Aturdir %',punchDamage:'Daño puño',thorns:'Espinas',recoilReduction:'Retroceso',pierceResist:'Resist perforación %'};return Object.entries(item.bonuses).map(([k,v])=>`${keys[k]||k} ${v>=0?'+':''}${v}`).join(' · ')}
function itemCategory(id){if(DB.lootBoxes[id])return 'Cajas';const it=DB.items[id];if(!it)return 'Otros';if(it.type==='consumable'||it.type==='food'||it.type==='explosive'||it.type==='utility'||it.type==='scroll')return 'Consumibles';if(it.slot)return 'Equipo';if(it.type==='material')return 'Materiales';if(it.type==='quest')return 'Quest';return 'Otros'}
function showItemDetail(id){const it=getItem(id);const item=DB.items[id];openModal('help');document.getElementById('modalTitle').textContent=`${it.icon||'📦'} ${it.name}`;document.getElementById('modalBody').innerHTML=`<div class="small muted">${it.desc||'Sin descripción.'}</div>${item?`<div style="margin-top:10px"><b>Tipo:</b> ${item.type||'—'}${item.slot?` · <b>Slot:</b> ${item.slot}`:''}${item.build?` · <b>Estilo:</b> ${item.build}`:''}</div><div style="margin-top:6px"><b>Bonus:</b> ${itemBonusText(item)}</div>`:''}`}
function renderInventory(){let html=`<h3>🧍 Equipo de Carl</h3><div class="equipment-grid">`;const slots={weapon:"Arma",fist:"Puño",hands:"Manos",innerTorso:"Torso",cloak:"Capa",head:"Cabeza",neck:"Cuello",toe:"Anillo",legs:"Piernas",pants:"Pantalones"};for(const [slot,label] of Object.entries(slots)){const id=game.player.equipment[slot],it=DB.items[id];html+=`<div class="slot"><b>${label}</b>${id?`${getItem(id).icon} ${getItem(id).name}<div class="small muted">${itemBonusText(it)}</div><button onclick="unequipItem('${slot}')">Desequipar</button>`:'— vacío —'}</div>`}html+=`</div><h3>🎒 Inventario</h3>`;const grouped={Consumibles:[],Equipo:[],Materiales:[],Cajas:[],Quest:[],Otros:[]};Object.entries(game.inventory).filter(([id,q])=>q>0).forEach(([id,q])=>grouped[itemCategory(id)].push([id,q]));Object.entries(grouped).forEach(([cat,rows])=>{if(!rows.length)return;html+=`<h3>${cat}</h3>`;rows.forEach(([id,q])=>{const it=getItem(id);const item=DB.items[id];const equippable=item&&item.slot;const usable=item&&item.use;const box=DB.lootBoxes[id];const build=item&&item.build?` · Estilo: ${item.build}`:'';html+=`<div class="itemline"><span title="${it.desc||''}">${it.icon||'📦'} ${it.name} <span class="muted">x${q}</span><div class="small muted">${item?itemBonusText(item):''}${build}</div></span><span>${equippable?`<button onclick="equipItem('${id}')">Equipar</button>`:''}${usable?`<button onclick="useItem('${id}')">Usar</button>`:''}${box?`<button onclick="openOneBox('${id}')">Abrir</button>`:''}<button onclick="showItemDetail('${id}')">Detalle</button></span></div>`})});return html}
function renderSkills(){const names={pugilism:"Pugilismo",unarmed:"Combate sin armas",footSoldier:"Soldado de a pie",squish:"Despachurrar",regen:"Regeneración",ironFist:"Puño de hierro",powerStrike:"Golpe poderoso",explosives:"Explosivos",magicMissile:"Proyectil mágico",lightFeet:"Pies ligeros",slicing:"Ataque rebanador",rearClaw:"Garra trasera",firstImpression:"Buena primera impresión"};let html="<h3>📚 Carl</h3>";Object.entries(game.player.skills).forEach(([k,v])=>html+=`<div class="skillline"><span>${names[k]||k}</span><b>${calcSkill('player',k)}</b></div>`);html+="<h3>🐱 Dónut</h3>";Object.entries(game.donut.skills).forEach(([k,v])=>html+=`<div class="skillline"><span>${names[k]||k}</span><b>${calcSkill('donut',k)}</b></div>`);return html}
function equipItem(id){const it=DB.items[id];if(!it||!it.slot)return; if(!(it.slot in game.player.equipment)){notify(`No podés equipar ${it.name} en Carl (slot inválido).`,'warn');return} if((game.inventory[id]||0)<=0)return; const old=game.player.equipment[it.slot];const oldIt=old?DB.items[old]:null;const msg=`Slot: ${it.slot}\nActual: ${oldIt?`${oldIt.icon} ${oldIt.name} (${itemBonusText(oldIt)})`:'— vacío —'}\nNuevo: ${it.icon} ${it.name} (${itemBonusText(it)})\n\n¿Equipar?`;if(!confirm(msg))return; if(old)addItem(old,1); removeItem(id,1); game.player.equipment[it.slot]=id; notify(`Equipado: ${it.icon} ${it.name}`,'good'); if(id==='pants')game.quests.find(q=>q.id==='pants').done=true; if(id==='warGauntlets'||id==='brassKnuckles')game.quests.find(q=>q.id==='gauntlets').done=true; render()}
function unequipItem(slot){if(!(slot in game.player.equipment))return;const old=game.player.equipment[slot];if(!old){notify('Ese slot ya está vacío.','warn');return}game.player.equipment[slot]=null;addItem(old,1);notify(`Desequipado: ${getItem(old).icon} ${getItem(old).name}`,'warn');render()}
function useItem(id){const it=DB.items[id];if(!it||!removeItem(id,1))return; if(it.use==='heal'){game.player.hp=clamp(game.player.hp+Math.floor(maxHp('player')*it.value),0,maxHp('player'));notify('Te tomás una poción. La carne vuelve a acordarse de su forma.','good')} if(it.use==='mana'){game.player.mana=clamp(game.player.mana+it.value,0,maxMana('player'));notify('Recuperás maná. No mucho, pero algo es algo.','magic')} if(it.use==='bleed'){game.player.statuses=game.player.statuses.filter(s=>s!=='bleed');notify('Te vendás como podés. Menos sangre en el piso.','good')} if(it.use==='ironSkin'){game.player.temp.ironSkin=true;notify('Tu piel se endurece como si fueras una estatua con problemas de autoestima.','magic')} if(it.use==='reflex'){game.player.statuses.push('reflex');notify('Sentís que el tiempo baja de velocidad por un rato.','magic')} if(it.use==='confuse'){if(game.mode==='combat'&&game.combat&&game.combat.enemies.length){const e=activeEnemy();if(e&&addStatus(e,'stunned'))notify(`${e.name} queda confundido y aturdido.`, 'magic')}else notify('Guardás el pergamino para una pelea real.','warn');} render()}
function openOneBox(id){if(!DB.lootBoxes[id]||!removeItem(id,1))return; const box=DB.lootBoxes[id];notify(`Abrís ${box.icon} ${box.name}.`,'magic');box.drops.forEach(([item,q])=>{addItem(item,q);notify(`Recibido: ${getItem(item).icon} ${getItem(item).name} x${q}`,'good')});render()}
function openBoxes(){const boxes=Object.keys(DB.lootBoxes).filter(id=>(game.inventory[id]||0)>0).sort((a,b)=>DB.lootBoxes[a].rarity-DB.lootBoxes[b].rarity);if(!boxes.length){notify('No tenés cajas para abrir. Qué pobreza conceptual.','warn');render();return}boxes.forEach(id=>{while((game.inventory[id]||0)>0)openOneBox(id)});}
function sleep(){game.player.hp=maxHp('player');game.donut.hp=maxHp('donut');game.player.mana=maxMana('player');game.donut.mana=maxMana('donut');advanceTime(8);notify('Dormís en una habitación segura. AGOTADO eliminado. Dónut usó tu cuello como almohada real.','good');render()}
function eat(){notify('Tally sirve vindaloo perfecto y paté de salmón. Moral restaurada; hambre cancelada.','good');advanceTime(.5);render()} function shower(){notify('Ducha caliente. El agua sale negra un rato. La dignidad sube 1 punto imaginario.','good');advanceTime(.35);render()} function talkTally(){notify('Tally: “Comida sí. Preguntas de mazmorra no. No fumar.”','warn');render()} function askMordecai(){notify('Mordecai: “Los primeros pisos son para descubrir tu build. No aceptes tratos malos antes del piso 12.”','magic');render()} function enterDangerZone(){if(!(locations[game.location].encounter||encounterPools[game.location])){notify('Acá no hay zona peligrosa para forzar.','warn');return}const pack=generateEncounterForLocation(game.location);pack.push(pack[rnd(0,pack.length-1)]);game.riskBonusXp=24;notify('Entrás a lo bruto: más enemigos, pero recompensa de XP si sobrevivís.','bad');startCombat(pack)} function lootRebeccaFast(){if(game.quests.find(q=>q.id==='lootRebeccaDone')){notify('Ya saqueaste este cadáver. No queda ni vergüenza.','warn');return}addItem('dignityBox',1);addItem('healingPotion',3);if(Math.random()<.55){const dmg=rnd(8,16);game.player.hp=clamp(game.player.hp-dmg,1,maxHp('player'));notify(`Saqueo rápido: te cortás con metal oxidado (-${dmg} HP).`,'bad')}if(Math.random()<.45){notify('El ruido del saqueo rápido atrae enemigos.','warn');startCombat(['rat','scatterer'])}game.quests.push({id:'lootRebeccaDone',text:'Saqueaste el cadáver de Rebecca W. y eso te dejó una sensación horrible.',done:true});notify('Saqueás rápido: más botín, más riesgo.','warn');render()} function lootRebeccaCareful(){if(game.quests.find(q=>q.id==='lootRebeccaDone')){notify('Ya saqueaste este cadáver. No queda ni vergüenza.','warn');return}addItem('dignityBox',1);addItem('healingPotion',1);addItem('bandage',1);game.quests.push({id:'lootRebeccaDone',text:'Saqueaste el cadáver de Rebecca W. y eso te dejó una sensación horrible.',done:true});notify('Saqueás con cuidado: menos botín, sin riesgos extra.','good');render()}
function peekNest(){notify('Dónut ve montones de cucarachas y algo grande. El olor atraviesa el concepto de nariz.','warn');render()} function throwDynamite(){if(!removeItem('dynamite',1)){notify('No tenés dinamita. La prudencia gana por falta de recursos.','warn');return}game.player.hp=clamp(game.player.hp-35,1,maxHp('player'));game.bossLootPenalty=true;addItem('goldCrowd',1);addItem('silverGoblin',1);notify('¡BUM! Limpiás parte del nido, pero te dañás y podés arruinar loot del jefe.','bad');startBoss(true)}

function startCombat(ids){let enemies=ids.map(id=>{const e=deepClone(DB.enemies[id]);e.id=id;e.maxHp=e.hp;e.statuses=[];return e});if((game.inventory.goblinPass||0)>0){const before=enemies.length;enemies=enemies.filter(e=>!e.neutralWithGoblinPass);if(before!==enemies.length)notify('🎟️ El pase goblin evita un combate innecesario.','good')}if(enemies.length>MAX_COMBAT_ENEMIES){enemies=enemies.slice(0,MAX_COMBAT_ENEMIES);notify('⚙️ Sistema: límite de combate alcanzado, se recorta la horda para mantener fluidez.','warn')}if(!enemies.length){notify('Los enemigos te dejan pasar por ahora. Raro pero útil.','magic');render();return}targetIndex=0;game.combat={boss:false,enemies,round:1,log:[],phase:'player'};game.mode='combat';openCombatModal(false)} function startBoss(preDamaged=false){const e=deepClone(DB.enemies.hoarder);e.id='hoarder';e.maxHp=e.hp;if(preDamaged)e.hp=45;e.statuses=[];game.location='boss_room';if(!game.explored.includes('boss_room'))game.explored.push('boss_room');targetIndex=0;game.combat={boss:true,enemies:[e],round:1,log:["VERSUS: El séquito de la Princesa Dónut vs La Acaparadora"],phase:'player',addsTimer:2};game.mode='combat';openCombatModal(true)}
function openCombatModal(isBoss){document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').textContent=isBoss?'☠️ ¡Batalla contra jefe!':'⚔️ Combate';renderCombatModal()}
function renderCombatModal(){const c=game.combat;if(!c)return;let body=c.boss?`<div class="big-versus">VERSUS</div>`:"";body+=`<div class="combat-grid"><div><h3>Party</h3><div class="enemy-card"><b>🧍 Carl</b>${hpBar(game.player.hp,maxHp('player'))}<div class="small muted">MP ${game.player.mana}/${maxMana('player')}</div><div class="small">Estados: ${formatStatuses(game.player.statuses,'player')}</div></div><div class="enemy-card"><b>🐱 Dónut</b>${hpBar(game.donut.hp,maxHp('donut'),'mana')}<div class="small muted">MP ${game.donut.mana}/${maxMana('donut')}</div><div class="small">Estados: ${formatStatuses(game.donut.statuses,'donut')}</div></div><h3>Acciones</h3><div class="actions" style="padding:0;border:0;background:none"><button onclick="combatAction('punch')">👊 Puñetazo</button><button onclick="combatAction('kick')">🦶 Patada</button><button onclick="combatAction('stomp')">🦶💥 Pisar</button><button onclick="combatAction('dynamite')">💣 Dinamita</button><button onclick="combatAction('heal')">🧪 Poción</button><button onclick="combatAction('iron')">🧴 Piel hierro</button><button onclick="inspectTarget()">🔎 Inspeccionar</button>${c.boss?'':`<button onclick="fleeCombat()">🏃 Huir</button>`}</div></div><div><h3>Enemigos</h3>${c.enemies.map((e,i)=>`<div class="enemy-card"><b>${e.icon} ${e.name} Nv.${e.level}</b>${hpBar(e.hp,e.maxHp,e.hp/e.maxHp<.35?'bad':'')}<div class="small muted">${e.desc}</div><div class="small">Estados: ${formatStatuses(e.statuses,'enemy')}</div><button onclick="targetIndex=${i};renderCombatModal()">${targetIndex===i?'🎯 Objetivo':'Elegir'}</button></div>`).join('')}</div></div><h3>Log de combate</h3><div class="log">${c.log.slice(-10).reverse().map(x=>`<div class="log-entry">${x}</div>`).join('')}</div>`;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalTitle').textContent=c.boss?'☠️ ¡Batalla contra jefe!':'⚔️ Combate'}
let targetIndex=0;
function activeEnemy(){const e=game.combat.enemies[targetIndex];return e||game.combat.enemies[0]}
function combatLog(s){game.combat.log.push(s)}
function statusLabel(s){return {poison:'☠️ Veneno',bleed:'🩸 Hemorragia',stunned:'💫 Aturdido',septicemia:'🧫 Septicemia'}[s]||s}
function formatStatuses(list,who='enemy'){if(!list||!list.length)return '—';return list.map(statusLabel).join(' · ')}
function addStatus(target,status){if(!target.statuses)target.statuses=[];if(status==='septicemia'&&target.statuses.includes('septicemia'))return false;if(target.statuses.includes(status))return false;target.statuses.push(status);return true}
function removeStatus(target,status){if(!target.statuses)return;target.statuses=target.statuses.filter(s=>s!==status)}
function inspectTarget(){const e=activeEnemy();if(!e)return;const tips=[];if(e.statusOnHit==='poison')tips.push('• Sus golpes pueden aplicar veneno.');if(e.momentum)tips.push('• Si queda aturdido, evitás su ataque de impulso.');if(e.boss)tips.push('• Es jefe: priorizá dinamita y control de estados.');tips.push('• Hemorragia y veneno hacen daño por turno.');tips.push('• Septicemia pega fuerte y no se acumula.');combatLog(`Inspección ${e.icon} ${e.name}: ${e.desc}`);tips.forEach(t=>combatLog(t));renderCombatModal()}
function unarmedDamage(kind){const st=calcStats('player');let dmg=st.strength+calcSkill('player','unarmed')*2+calcSkill('player','pugilism')*2; if(kind==='kick')dmg+=calcSkill('player','footSoldier')*3+calcBonus('player','kickDamage');if(kind==='stomp')dmg+=calcSkill('player','squish')*4+calcBonus('player','stompDamage');if(kind==='punch')dmg+=calcBonus('player','punchDamage');if(game.player.equipment.fist==='brassKnuckles'||game.player.equipment.hands==='warGauntlets')dmg+=8+calcSkill('player','ironFist')*2;return rnd(Math.floor(dmg*.75),Math.ceil(dmg*1.15))}
function combatAction(a){const c=game.combat;if(!c)return;let e=activeEnemy();if(!e)return;trackCombatCombo(a);if(a==='heal'){if(removeItem('healingPotion',1)){const healed=Math.floor(maxHp('player')*.5);game.player.hp=clamp(game.player.hp+healed,0,maxHp('player'));combatLog(`Carl usa poción y cura ${healed} HP.`)}else combatLog('No quedan pociones.');enemyTurn();return} if(a==='iron'){if(removeItem('ironSkin',1)){game.player.temp.ironSkin=true;combatLog('Carl usa Piel de hierro (mitad de daño físico este combate).')}else combatLog('No queda Piel de hierro.');enemyTurn();return} if(a==='dynamite'){if(!removeItem('dynamite',1)){combatLog('No queda dinamita.')}else{const chaos=calcBonus('player','explosives');const self=rnd(8,22)+Math.max(0,Math.floor(chaos/3));game.player.hp=clamp(game.player.hp-self,0,maxHp('player'));c.enemies.forEach(en=>{const hit=rnd(35,60)+chaos;en.hp-=hit;en.lastHit={method:'dynamite',crit:false};combatLog(`💣 ${en.name} recibe ${hit} de explosión.`)});combatLog(`Dinamita goblin: Carl recibe ${self}.`);trackShow('dynamite',5,'Explosión en vivo. La audiencia pide repetición.');skillUp('player','explosives',1);checkDeadEnemies()}enemyTurn();return}
 let dmg=unarmedDamage(a); if(a==='punch'&&!hasHandProtection()) {const recoil=Math.max(0,rnd(2,6)-calcBonus('player','recoilReduction'));game.player.hp=clamp(game.player.hp-recoil,0,maxHp('player'));if(recoil>0)combatLog(`Te lastimás la mano (${recoil}) por pegarle a algo demasiado sólido.`);else combatLog('Los guanteletes absorben el retroceso.')} const crit=(a==='stomp'&&e.statuses.includes('stunned'))||Math.random()<((calcBonus('player','critChance')||0)/100); if(crit){dmg=Math.floor(dmg*1.7);combatLog('¡Crítico preparado! Aturdido + pisotón al punto débil.');trackShow('critical',7,'Crítico brutal en prime time.')} if(e.weakToStomp&&a==='stomp'){dmg=Math.floor(dmg*1.25);combatLog('El objetivo es débil al pisotón.')} if(e.physicalResist&&a!=='dynamite'){dmg=Math.floor(dmg*0.8);combatLog('La armadura del enemigo amortigua el golpe.')} e.hp-=dmg;e.lastHit={method:a,crit};combatLog(`Carl usa ${a==='punch'?'puñetazo':a==='kick'?'patada':'pisotón'} e inflige ${dmg}.`); const stunChance=.25+(calcBonus('player','stunChance')||0)/100; if(Math.random()<stunChance&&addStatus(e,'stunned'))combatLog(`${e.name} queda aturdido.`); if((a==='punch'||a==='kick')&&Math.random()<.2&&addStatus(e,'bleed'))combatLog(`${e.name} entra en hemorragia.`); checkDeadEnemies(); donutAuto(); enemyTurn()}
function hasHandProtection(){return game.player.equipment.hands==='warGauntlets'||game.player.equipment.fist==='brassKnuckles'}
function donutAuto(){const c=game.combat;if(!c||!c.enemies.length)return;let e=c.enemies.find(x=>x.hp>0);if(!e)return;if(game.donut.mana>=5){game.donut.mana-=5;let dmg=rnd(22,34)+calcSkill('donut','magicMissile')*3+calcBonus('donut','magicDamage');if(e.magicResist)dmg=Math.floor(dmg*.75);if(e.weakToMagic)dmg=Math.floor(dmg*1.25);e.hp-=dmg;combatLog(`Dónut dispara Proyectil mágico (${dmg}).`);if(e.magicResist)combatLog('La criatura resiste parte de la magia.');if(Math.random()<.15&&addStatus(e,'septicemia')&&!e.immuneToPoison)combatLog(`${e.name} contrae SEPTICEMIA.`)}else if((game.inventory.manaPotion||0)>0&&game.donut.potionCooldown<=0){removeItem('manaPotion',1);game.donut.mana=clamp(game.donut.mana+8,0,maxMana('donut'));game.donut.potionCooldown=2;combatLog('Dónut bebe una poción de maná con indignación.')}else{let dmg=rnd(10,18)+Math.floor(calcStats('donut').strength/3);e.hp-=dmg;combatLog(`Dónut usa garras (${dmg}) y se queja del trabajo manual.`)}checkDeadEnemies()}
function enemyTurn(){const c=game.combat;if(!c)return;if(game.donut.potionCooldown>0)game.donut.potionCooldown--;c.enemies=c.enemies.filter(e=>e.hp>0);if(!c.enemies.length){winCombat();return}if(c.boss&&c.round%2===0&&c.enemies.length<MAX_COMBAT_ENEMIES){const add=deepClone(DB.enemies.guardian);add.id='guardian';add.maxHp=add.hp;add.statuses=[];c.enemies.push(add);combatLog('La Acaparadora vomita un guardián de nidada. Lamentablemente.')}const playerTick=[['poison',6],['bleed',8]];playerTick.forEach(([st,d])=>{if(game.player.statuses.includes(st)){game.player.hp=clamp(game.player.hp-d,0,maxHp('player'));combatLog(`🧍 Carl sufre ${d} por ${statusLabel(st)}.`)}});c.enemies.forEach(e=>{if(e.statuses.includes('septicemia')&&!e.immuneToPoison){e.hp-=18;combatLog(`${e.name} sufre 18 por septicemia.`)}if(e.statuses.includes('poison')&&!e.immuneToPoison){e.hp-=7;combatLog(`${e.name} sufre 7 por veneno.`)}if(e.statuses.includes('bleed')){e.hp-=9;combatLog(`${e.name} pierde 9 por hemorragia.`)}if(e.hp<=0)return;if(e.statuses.includes('stunned')){combatLog(`${e.name} pierde el turno por aturdimiento.`);removeStatus(e,'stunned');return}let target=Math.random()<.35?'donut':'player';let dmg=rnd(Math.floor(e.atk*.7),Math.ceil(e.atk*1.3));if(target==='player'){if(!e.armorPiercing){dmg=Math.max(1,dmg-calcBonus('player','armor'));if(game.player.temp.ironSkin)dmg=Math.ceil(dmg/2)}else{dmg=Math.max(1,dmg-Math.floor((calcBonus('player','pierceResist')||0)/12));combatLog('Ataque perforante: tu armadura ayuda poco.')}if(e.hatesGoblinPass&&(game.inventory.goblinPass||0)>0){dmg=Math.floor(dmg*1.2);combatLog('El feérico reconoce el pase goblin y te odia un 20% más.')}game.player.hp=clamp(game.player.hp-dmg,0,maxHp('player'));combatLog(`${e.name} golpea a Carl por ${dmg}.`);if(e.statusOnHit==='poison'&&!hasResist('poison')&&addStatus(game.player,'poison'))combatLog('Carl queda envenenado.');if((e.bleed||Math.random()<.12)&&!hasResist('bleed')&&addStatus(game.player,'bleed'))combatLog('Carl entra en hemorragia.');if(e.stealsItem&&Math.random()<.25){const steals=Object.keys(game.inventory).filter(k=>(game.inventory[k]||0)>0&&DB.items[k]&&DB.items[k].type==='consumable');if(steals.length){const pick=steals[rnd(0,steals.length-1)];removeItem(pick,1);combatLog(`${e.name} roba ${getItem(pick).name}.`)}}const th=calcBonus('player','thorns');if(th>0){e.hp-=th;combatLog(`Tu equipo espinado devuelve ${th} daño.`)}}else{game.donut.hp=clamp(game.donut.hp-dmg,0,maxHp('donut'));combatLog(`${e.name} alcanza a Dónut por ${dmg}.`)}if(e.summons&&Math.random()<.15){if(c.enemies.length<MAX_COMBAT_ENEMIES){const add=deepClone(DB.enemies[e.summons]);add.id=e.summons;add.maxHp=add.hp;add.statuses=[];c.enemies.push(add);combatLog(`${e.name} invoca un aliado (${add.name}).`)}else combatLog('⚙️ Sistema: no entra otro invocado, arena al límite.')}if(e.fleeOnLowHp&&e.hp>0&&e.hp<Math.floor(e.maxHp*.25)&&Math.random()<.35){e.hp=0;e.fled=true;combatLog(`${e.name} huye arrastrándose.`)}});c.round++;regenTick();if(game.player.hp<=0||game.donut.hp<=0){const deadBy=c.enemies[0]?.name||'la mazmorra';const cause=game.player.hp<=0?`Carl cayó en combate contra ${deadBy}.`:`Dónut cayó en combate contra ${deadBy}.`;showDeathSummary(cause);return}checkDeadEnemies();renderCombatModal();render()}
function hasResist(r){const eq=game.player.equipment;const base=Object.values(eq).some(id=>DB.items[id]&&DB.items[id].resists&&DB.items[id].resists.includes(r));if(base)return true;if(r==='poison'&&calcBonus('player','poisonResist')>0)return Math.random()<calcBonus('player','poisonResist')/100;if(r==='bleed'&&calcBonus('player','bleedResist')>0)return Math.random()<calcBonus('player','bleedResist')/100;return false}
function regenTick(){let regen=calcSkill('player','regen');if(regen>0)game.player.hp=clamp(game.player.hp+regen*5,0,maxHp('player'));game.player.mana=clamp(game.player.mana+calcBonus('player','manaRegen'),0,maxMana('player'));game.donut.mana=clamp(game.donut.mana+2,0,maxMana('donut'))}
function checkDeadEnemies(){const c=game.combat;if(!c)return;c.enemies.forEach(e=>{if(e.hp<=0&&!e.dead){e.dead=true;if(e.fled){combatLog(`🏃 ${e.name} escapó.`);return}combatLog(`☠️ ${e.name} muere.`);game.progress.enemiesKilled++;if(e.boss)game.progress.bossKilled=true;trackShow('kill',3,'KO televisado.');if(e.lastHit&&e.lastHit.crit)trackShow('kill_crit',8,'Remate crítico, el chat se vuelve loco.');if(e.lastHit&&e.lastHit.method==='dynamite')trackShow('kill_dynamite',10,'Baja con dinamita. Esto vende camisetas.');const gained=gainXP(e.xp||10);combatLog(`XP: Carl +${gained.playerXp} / Dónut +${gained.donutXp}.`);(e.loot||[]).forEach(([it,q])=>{addItem(it,q);combatLog(`🎁 Loot: ${getItem(it).icon} ${getItem(it).name} x${q}`)})}});c.enemies=c.enemies.filter(e=>e.hp>0);if(c.enemies.length===0){targetIndex=0}else if(!c.enemies[targetIndex]){targetIndex=0;combatLog(`🎯 Objetivo automático: ${c.enemies[0].name}.`)}}
function gainXP(xp){const playerXp=Math.floor(xp*.6),donutXp=Math.floor(xp*.55);game.player.xp+=playerXp;game.donut.xp+=donutXp;while(game.player.xp>=game.player.xpNext){game.player.xp-=game.player.xpNext;game.player.level++;game.player.statPoints+=3;game.player.xpNext=Math.floor(game.player.xpNext*1.32);notify(`Carl sube a nivel ${game.player.level}. +3 puntos bloqueados.`,'good');['pugilism','unarmed','footSoldier','squish'].forEach(s=>skillUp('player',s,1))}while(game.donut.xp>=game.donut.xpNext){game.donut.xp-=game.donut.xpNext;game.donut.level++;game.donut.stats.strength++;game.donut.stats.intelligence++;game.donut.stats.charisma+=2;game.donut.xpNext=Math.floor(game.donut.xpNext*1.32);notify(`Dónut sube a nivel ${game.donut.level}. Se vuelve más insoportable y más útil.`,'magic')}return {playerXp,donutXp}}
function skillUp(who,skill,amt){const actor=who==='donut'?game.donut:game.player;actor.skills[skill]=(actor.skills[skill]||0)+amt}
function cleanupAfterCombat(){game.player.temp.ironSkin=false;game.player.audience.combo=0;targetIndex=0}
function winCombat(){const c=game.combat;if(c.boss){game.bossDefeated=true;game.progress.bossKilled=true;game.runStats.bossesDefeated++;game.quests.find(q=>q.id==='premiere').done=true;game.quests.find(q=>q.id==='nest').done=true;trackShow('boss',14,'Jefe derrotado en cadena nacional.');addItem('bronzeBoss',1);addItem('mapNeighborhood',1);if(game.bossLootPenalty){notify('La explosión previa arruinó parte del botín del jefe.','warn');game.bossLootPenalty=false}else addItem('dignityBox',1);game.player.badges.push('★ jefe');notify('¡Victoria contra jefe! Recibís caja de jefe, mapa de barrio y una estrella de prestigio.','gold');game.location='nest_door'}else{if(Math.random()<.35)addItem('bronzeAdventurer',1);notify('Combate ganado. Más sangre, más XP, más preguntas existenciales.','good')}if(game.riskBonusXp>0){const bonus=game.riskBonusXp;game.riskBonusXp=0;const g=gainXP(bonus);notify(`Zona peligrosa superada: bonus ${bonus} XP (Carl ${g.playerXp} / Dónut ${g.donutXp}).`,'magic')}if(game.player.hp<=Math.floor(maxHp('player')*.2)){trackShow('clutch',9,'Ganaste con poca vida. El público ama el drama.');game.runStats.deathsAvoided++}cleanupAfterCombat();game.combat=null;game.mode='explore';closeModal();advanceTime(.35);render()}
function fleeCombat(){if(game.combat&&game.combat.boss){combatLog('No se puede huir de un jefe. La puerta se ríe de vos.');renderCombatModal();return}if(game.riskBonusXp>0){notify('Perdés el bonus de zona peligrosa por retirarte.','warn');game.riskBonusXp=0}cleanupAfterCombat();game.combat=null;game.mode='explore';closeModal();notify('Huís del combate. No heroico, pero estadísticamente sensato.','warn');advanceTime(.2);render()}
function showVictorySummary(){game.mode='victory';const done=game.quests.filter(q=>q.done).length;const a=game.player.audience;openModal('help');document.getElementById('modalTitle').textContent='🏁 Encontraste la escalera al piso 2';document.getElementById('modalBody').innerHTML=`<p><b>Vertical slice completada.</b> Carl y Dónut salieron del piso 1 con estilo cuestionable.</p><div class="statline"><span>Nivel Carl</span><b>${game.player.level}</b></div><div class="statline"><span>Nivel Dónut</span><b>${game.donut.level}</b></div><div class="statline"><span>Jefes derrotados</span><b>${game.runStats.bossesDefeated}</b></div><div class="statline"><span>Audiencia total</span><b>${(a.views||0).toLocaleString('es-AR')} vistas · ${a.followers||0} seguidores · ${a.favorites||0} favoritos · ${a.patrons||0} mecenas</b></div><div class="statline"><span>Muertes evitadas / logros</span><b>${game.runStats.deathsAvoided} clutchs · ${done} objetivos cumplidos</b></div><div class="actions" style="padding:10px 0 0;border:0;background:none"><button onclick="resetGame()">🔁 Nueva run</button><button onclick="closeModal()">Cerrar</button></div>`;notify('Resumen final disponible: run completada.','gold')}
function showDeathSummary(cause='Desconocida'){game.mode='death';const a=game.player.audience||{};const survived=Math.max(0,FLOOR_START_HOURS-game.floorTimeHours);deathRestartBonus=Math.min(3,deathRestartBonus+1);openModal('help');document.getElementById('modalTitle').textContent='💀 Fin de run';document.getElementById('modalBody').innerHTML=`<p><b>Sistema:</b> “Buen intento, crawler. El piso igual te cobró peaje.”</p><div class="statline"><span>Causa de muerte</span><b>${cause}</b></div><div class="statline"><span>Nivel alcanzado</span><b>${game.player.level}</b></div><div class="statline"><span>Enemigos matados</span><b>${game.progress.enemiesKilled}</b></div><div class="statline"><span>Jefes derrotados</span><b>${game.runStats.bossesDefeated}</b></div><div class="statline"><span>Audiencia</span><b>${(a.views||0).toLocaleString('es-AR')} vistas · ${a.followers||0} seguidores · ${a.favorites||0} favoritos · ${a.patrons||0} mecenas</b></div><div class="statline"><span>Tiempo sobrevivido</span><b>${formatHours(survived)} · ${game.turn} turnos</b></div><div class="small muted" style="margin-top:8px">Bonus por reinicio: +${deathRestartBonus} poción(es) de sanación.</div><div class="actions" style="padding:10px 0 0;border:0;background:none"><button onclick="restartAfterDeath()">🔁 Reiniciar run</button></div>`;notify(`Fin de run: ${cause}`,'bad')}
function restartAfterDeath(){const bonus=deathRestartBonus;resetGame();if(bonus>0){addItem('healingPotion',bonus);notify(`Roguelite light: empezás con +${bonus} poción(es).`,'good')}render()}
function openModal(kind){document.getElementById('modal').classList.add('show');const title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');if(kind==='help'){title.textContent='❔ Ayuda rápida';body.innerHTML=`<p><b>Objetivo del MVP:</b> farmear, equiparte, vencer al jefe de barrio y sobrevivir.</p><p>Usá safe rooms para dormir, comer y abrir cajas. En combate, combiná Proyectil mágico de Dónut con golpes/pisotones de Carl. La dinamita pega fuerte, pero también te revienta.</p><p>Probá saquear a Rebecca, abrir cajas, equipar pantalones/guanteletes y usar el mapa de barrio.</p>`}if(kind==='notifications'){title.textContent='📁 Notificaciones';game.notifications.forEach(n=>n.read=true);body.innerHTML=game.notifications.map(n=>`<div class="log-entry ${n.type}">${n.msg}</div>`).join('')||'No hay notificaciones.';renderHUD()}}
function closeModal(){if(game.mode==='combat'&&game.combat){combatLog('No podés cerrar la ventana durante combate.');renderCombatModal();return}if(game.mode==='death'){notify('Sistema: reiniciá la run para salir de este glorioso fracaso.','warn');return}document.getElementById('modal').classList.remove('show'); }
function saveGame(){localStorage.setItem('mazmorraMVP',JSON.stringify(game));notify('Partida guardada en este navegador.','good');render()} function loadGame(){const s=localStorage.getItem('mazmorraMVP');if(!s){notify('No hay partida guardada.','warn');render();return}try{game=normalizeGameState(JSON.parse(s));if(game.mode==='combat'&&game.combat){game.mode='explore';game.combat=null}targetIndex=0;notify('Partida cargada.','good')}catch(_err){game=defaultGame();notify('La partida guardada estaba dañada. Se restauró un estado nuevo.','bad')}render()} function resetGame(){game=defaultGame();targetIndex=0;notify('Nueva mazmorra inicializada. La dignidad sigue opcional.','warn');render()}
notify('MVP iniciado: Carl y Dónut están en una estancia segura. Abrí cajas, explorá y buscá problemas.','magic');render();
</script>
