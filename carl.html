<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To Do List - InstantDB</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    .muted { color: #666; font-size: 14px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { padding: 10px; font-size: 16px; flex: 1; }
    button { padding: 10px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
    .done { text-decoration: line-through; color: #777; }
    .actions { white-space: nowrap; }
  </style>
</head>
<body>
  <h1>To Do List</h1>
  <div id="status" class="muted">Conectando...</div>

  <form id="form">
    <input id="text" placeholder="Nueva tarea..." autocomplete="off" />
    <button>Agregar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Hecha</th>
        <th>Tarea</th>
        <th>Creada</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import { init, id } from "https://esm.sh/@instantdb/core";

    const APP_ID = "b1444761-2c88-4438-ae19-4c29c727d227";

    const db = init({ appId: APP_ID });

    const status = document.querySelector("#status");
    const form = document.querySelector("#form");
    const text = document.querySelector("#text");
    const rows = document.querySelector("#rows");

    let todos = [];

    db.subscribeQuery({ todos: {} }, (resp) => {
      if (resp.error) {
        status.textContent = "Error: " + resp.error.message;
        return;
      }

      todos = (resp.data?.todos ?? [])
        .sort((a, b) => (b.createdAt ?? 0) - (a.createdAt ?? 0));

      status.textContent = `Sincronizado · ${todos.length} tarea(s)`;
      render();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const value = text.value.trim();
      if (!value) return;

      await db.transact(
        db.tx.todos[id()].create({
          text: value,
          done: false,
          createdAt: Date.now(),
          updatedAt: Date.now()
        })
      );

      text.value = "";
      text.focus();
    });

    function render() {
      rows.innerHTML = "";

      for (const todo of todos) {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>
            <input type="checkbox" ${todo.done ? "checked" : ""} data-action="toggle">
          </td>
          <td class="${todo.done ? "done" : ""}">${escapeHtml(todo.text ?? "")}</td>
          <td>${todo.createdAt ? new Date(todo.createdAt).toLocaleString() : "-"}</td>
          <td class="actions">
            <button data-action="edit">Editar</button>
            <button data-action="delete">Borrar</button>
          </td>
        `;

        tr.querySelector('[data-action="toggle"]').onclick = () => toggleTodo(todo);
        tr.querySelector('[data-action="edit"]').onclick = () => editTodo(todo);
        tr.querySelector('[data-action="delete"]').onclick = () => deleteTodo(todo);

        rows.appendChild(tr);
      }
    }

    async function toggleTodo(todo) {
      await db.transact(
        db.tx.todos[todo.id].update({
          done: !todo.done,
          updatedAt: Date.now()
        })
      );
    }

    async function editTodo(todo) {
      const newText = prompt("Editar tarea:", todo.text ?? "");
      if (newText === null) return;

      const clean = newText.trim();
      if (!clean) return;

      await db.transact(
        db.tx.todos[todo.id].update({
          text: clean,
          updatedAt: Date.now()
        })
      );
    }

    async function deleteTodo(todo) {
      if (!confirm("¿Borrar esta tarea?")) return;
      await db.transact(db.tx.todos[todo.id].delete());
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c]));
    }
  </script>
</body>
</html>
