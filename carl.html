<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />

<title>Mazmorra Planetaria RPG — MVP</title>
<style>
  :root{
    --bg:#0b0d10;
    --panel:#151922;
    --panel2:#1d2330;
    --panel3:#242c3b;
    --line:#343d50;
    --text:#edf2ff;
    --muted:#9aa7bd;
    --accent:#8fd3ff;
    --good:#79e28c;
    --bad:#ff6f6f;
    --warn:#ffd166;
    --magic:#c49bff;
    --gold:#ffd36b;
    --green:#71e6a2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(circle at top,#182033 0,#0b0d10 45%,#07080b 100%);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    overflow:hidden;
  }
  button,select{font:inherit;}
  button{
    background:#263044;
    color:var(--text);
    border:1px solid #3a465d;
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    transition:.12s;
  }
  button:hover{background:#33405a; transform:translateY(-1px)}
  button:disabled{opacity:.45; cursor:not-allowed; transform:none}
  .app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;}
  .topbar{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(13,16,22,.88);backdrop-filter:blur(8px);}
  .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pill{border:1px solid var(--line);background:rgba(255,255,255,.045);padding:7px 10px;border-radius:999px;color:var(--muted);white-space:nowrap;}
  .pill strong{color:var(--text)} .timer strong{color:var(--warn)}
  .main{display:grid;grid-template-columns:290px 1fr 330px;gap:12px;padding:12px;min-height:0;}
  .panel{background:linear-gradient(180deg,rgba(31,38,52,.94),rgba(18,22,31,.94));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;min-height:0;}
  .panel h2,.panel h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;letter-spacing:.3px;color:#dfe8ff;background:rgba(255,255,255,.035);}
  .panel-body{padding:12px;overflow:auto;max-height:100%;}
  .map-grid{display:grid;grid-template-columns:repeat(7,32px);grid-auto-rows:32px;gap:5px;justify-content:center;padding:10px 0;}
  .cell{border:1px solid #2c3446;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#101520;color:#657086;position:relative;font-size:17px;}
  .cell.known{background:#202838;color:#cfd8ef}.cell.current{outline:2px solid var(--accent);box-shadow:0 0 14px rgba(143,211,255,.5)}.cell.safe{background:rgba(61,146,94,.25)}.cell.boss{background:rgba(150,72,72,.25)}
  .cell.enemy::after,.cell.corpse::after{content:"";width:7px;height:7px;border-radius:50%;position:absolute;right:4px;top:4px}.cell.enemy::after{background:var(--bad)}.cell.corpse::after{background:#b9b9b9}
  .legend{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
  .scene{display:grid;grid-template-rows:auto 1fr auto;}
  .scene-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .scene-title{font-size:22px;font-weight:800}.scene-subtitle{color:var(--muted);margin-top:3px}.scene-icon{font-size:40px;line-height:1;}
  .scene-content{padding:16px;overflow:auto;min-height:0}.description{line-height:1.55;color:#dce5f6;white-space:pre-line;}
  .actions{padding:12px;border-top:1px solid var(--line);background:rgba(255,255,255,.025);display:flex;gap:8px;flex-wrap:wrap;}
  .log{font-size:13px;line-height:1.35}.log-entry{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.07)}.log-entry.good{color:#b7ffc4}.log-entry.bad{color:#ffb4b4}.log-entry.warn{color:#ffe3a1}.log-entry.magic{color:#ddc3ff}

  .statline,.itemline,.skillline,.questline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .muted{color:var(--muted)}.small{font-size:12px}.bar{height:9px;background:#0c1018;border:1px solid #30394c;border-radius:999px;overflow:hidden;min-width:90px}.bar>span{display:block;height:100%;background:var(--good)}.bar.mana>span{background:var(--magic)}.bar.bad>span{background:var(--bad)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.show{display:flex}.modal-card{width:min(920px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#1f2736,#111722);border:1px solid #4a5872;border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.6)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.modal-body{padding:16px}.combat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.enemy-card{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);margin-bottom:8px}.big-versus{text-align:center;font-size:42px;font-weight:900;color:#ff7676;text-shadow:0 0 20px rgba(255,70,70,.35);margin:10px 0}.footer{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;background:rgba(13,16,22,.9)}.badge{color:#111;background:var(--gold);border-radius:999px;padding:2px 7px;font-size:12px;font-weight:700}.dangerText{color:var(--bad);font-weight:700}.goodText{color:var(--good);font-weight:700}.goldText{color:var(--gold);font-weight:700}.magicText{color:var(--magic);font-weight:700}
  @media(max-width:1050px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.panel{min-height:auto}}
</style>
</head>

function getItem(id){return DB.items[id]||DB.lootBoxes[id]||{name:id,icon:"❓",desc:""}} function log(msg,type=""){game.log.unshift({msg,type,t:Date.now()});game.log=game.log.slice(0,80)} function notify(msg,type=""){game.notifications.unshift({msg,type,read:false});log(msg,type)} function addItem(id,qty=1){game.inventory[id]=(game.inventory[id]||0)+qty} function removeItem(id,qty=1){if((game.inventory[id]||0)<qty)return false;game.inventory[id]-=qty;if(game.inventory[id]<0)game.inventory[id]=0;return true}
function totalStats(who){return Object.values(calcStats(who)).reduce((a,b)=>a+b,0)} function calcStats(who){const actor=who==="donut"?game.donut:game.player;const out={...actor.stats};const eq=actor.equipment||{};for(const slot in eq){const id=eq[slot];const item=DB.items[id];if(item&&item.bonuses){for(const k in item.bonuses){if(["strength","intelligence","constitution","dexterity","charisma"].includes(k))out[k]=(out[k]||0)+item.bonuses[k]}}}return out} function calcSkill(who,skill){const actor=who==="donut"?game.donut:game.player;let val=actor.skills[skill]||0;const eq=actor.equipment||{};for(const slot in eq){const item=DB.items[eq[slot]];if(item&&item.bonuses&&item.bonuses[skill])val+=item.bonuses[skill]}return val} function maxHp(who){const s=calcStats(who);return (who==="donut"?game.donut.baseHp:game.player.baseHp)+s.constitution*10} function maxMana(who){return calcStats(who).intelligence} function syncCaps(){game.player.hp=clamp(game.player.hp,0,maxHp("player"));game.player.mana=clamp(game.player.mana,0,maxMana("player"));game.donut.hp=clamp(game.donut.hp,0,maxHp("donut"));game.donut.mana=clamp(game.donut.mana,0,maxMana("donut"))} function advanceTime(hours){game.floorTimeHours=Math.max(0,game.floorTimeHours-hours);game.premiereHours=Math.max(0,game.premiereHours-hours);game.crawlersRemaining=Math.max(100000,Math.floor(game.crawlersRemaining-hours*rnd(5000,16000)));game.turn++; if(game.floorTimeHours<=0){alert("El piso se derrumbó. Fin."); resetGame()}}

function render(){syncCaps();renderHUD();renderMap();renderScene();renderSide();document.getElementById("footerStatus").textContent=`Ubicación: ${locations[game.location].name} · Nivel Carl ${game.player.level} · Nivel Dónut ${game.donut.level}`}
function renderHUD(){const p=game.player,d=game.donut;document.getElementById("hud").innerHTML=`<div class="pill">🧍 <strong>Carl Nv.${p.level}</strong> HP ${p.hp}/${maxHp("player")} · MP ${p.mana}/${maxMana("player")}</div><div class="pill">🐱 <strong>Dónut Nv.${d.level}</strong> HP ${d.hp}/${maxHp("donut")} · MP ${d.mana}/${maxMana("donut")}</div><div class="pill timer">⏳ Derrumbe: <strong>${formatHours(game.floorTimeHours)}</strong></div><div class="pill">📺 Estreno: <strong>${formatHours(game.premiereHours)}</strong></div><div class="pill">👥 Vivos: <strong>${game.crawlersRemaining.toLocaleString("es-AR")}</strong></div><div class="pill">📁 ${game.notifications.filter(n=>!n.read).length} notif.</div>`}
function renderMap(){const grid=document.getElementById("mapGrid");grid.innerHTML="";for(let y=0;y<7;y++){for(let x=0;x<7;x++){const locId=Object.keys(locations).find(id=>locations[id].pos[0]===x&&locations[id].pos[1]===y);const div=document.createElement("div");div.className="cell";if(locId&&(game.revealed.includes(locId)||game.explored.includes(locId)||game.neighborhoodRevealed)){const loc=locations[locId];div.classList.add("known");if(loc.type==="safe")div.classList.add("safe");if(loc.type==="boss"||locId==="nest_door")div.classList.add("boss");if(loc.encounter)div.classList.add("enemy");if(loc.type==="corpse")div.classList.add("corpse");div.textContent=locId===game.location?"🟦":loc.icon;div.title=loc.name;div.onclick=()=>{if(game.explored.includes(locId)||game.neighborhoodRevealed)moveTo(locId)}}else div.textContent="·";if(locId===game.location)div.classList.add("current");grid.appendChild(div)}}}
function renderScene(){const loc=locations[game.location];document.getElementById("sceneTitle").textContent=loc.name;document.getElementById("sceneSubtitle").textContent=loc.type==="safe"?"Estancia segura · el timer sigue corriendo":loc.type==="boss"?"Arena de jefe":"Mazmorra · exploración";document.getElementById("sceneIcon").textContent=loc.icon;let extra="";if(loc.encounter)extra="\n\nHay señales de enemigos por la zona. Podés buscar combate o moverte con cuidado.";if(game.location==="nest_door"&&!game.bossDefeated)extra+="\n\nDónut eriza el lomo. Adentro hay demasiadas cosas moviéndose.";document.getElementById("sceneDescription").textContent=loc.desc+extra;const a=document.getElementById("actions");a.innerHTML="";Object.entries(loc.exits||{}).forEach(([label,id])=>addAction(`Ir: ${label} ➜`,()=>moveTo(id)));(loc.actions||[]).forEach(ac=>{const map={sleep:["😴 Dormir 8h",sleep],eat:["🍛 Comer",eat],shower:["🚿 Ducharse",shower],openBoxes:["🎁 Abrir cajas",openBoxes],talkTally:["🧌 Hablar con Tally",talkTally],askMordecai:["🐀 Consultar a Mordecai",askMordecai],lootRebecca:["✖ Saquear cadáver",lootRebecca],peekNest:["👁️ Espiar sala",peekNest],throwDynamite:["💣 Tirar dinamita",throwDynamite],enterBoss:["☠️ Entrar igual",startBoss]}; if(map[ac])addAction(map[ac][0],map[ac][1])}); if(loc.encounter)addAction("⚔️ Buscar combate",()=>startCombat(loc.encounter)); if(game.inventory.mapNeighborhood>0&&!game.neighborhoodRevealed)addAction("🗺️ Usar mapa de barrio",useNeighborhoodMap); addAction("📁 Notificaciones",()=>openModal('notifications'))}
function addAction(label,fn,disabled=false){const b=document.createElement("button");b.textContent=label;b.onclick=fn;b.disabled=disabled;document.getElementById("actions").appendChild(b)}
function moveTo(id){if(game.mode!=="explore")return; if(!locations[id])return; game.location=id; if(!game.explored.includes(id))game.explored.push(id); if(!game.revealed.includes(id))game.revealed.push(id); advanceTime(.15); if(locations[id].type!=="safe"&&Math.random()<.18&&locations[id].encounter)startCombat(locations[id].encounter); else render()}
function setSideTab(tab){game.sideTab=tab;renderSide()}
function renderSide(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));const bt=document.getElementById('tab-'+game.sideTab);if(bt)bt.classList.add('active');const panel=document.getElementById("sidePanel");if(game.sideTab==="personaje")panel.innerHTML=renderCharacters()+renderQuests();if(game.sideTab==="inv")panel.innerHTML=renderInventory();if(game.sideTab==="skills")panel.innerHTML=renderSkills();if(game.sideTab==="log")panel.innerHTML=`<div class="log">${game.log.map(e=>`<div class="log-entry ${e.type}">${e.msg}</div>`).join("")}</div>`}
function hpBar(cur,max,type=""){return `<div class="bar ${type}"><span style="width:${pct(cur,max)}%"></span></div>`}
function renderCharacters(){const pS=calcStats("player"),dS=calcStats("donut");return `<div class="char-card"><div class="char-top"><b>🧍 Carl #${game.player.crawlerId}</b><span class="badge">${game.player.badges.join(' ')}</span></div>${hpBar(game.player.hp,maxHp("player"))}<div class="small muted">HP ${game.player.hp}/${maxHp("player")} · MP ${game.player.mana}/${maxMana("player")}</div>${Object.entries(pS).map(([k,v])=>`<div class="statline"><span>${statName(k)}</span><b>${v}</b></div>`).join("")}<div class="small muted">Puntos bloqueados hasta piso 3: ${game.player.statPoints}</div></div><div class="char-card"><div class="char-top"><b>🐱 Princesa Dónut</b><span class="badge">Líder</span></div>${hpBar(game.donut.hp,maxHp("donut"),'mana')}<div class="small muted">HP ${game.donut.hp}/${maxHp("donut")} · MP ${game.donut.mana}/${maxMana("donut")}</div>${Object.entries(dS).map(([k,v])=>`<div class="statline"><span>${statName(k)}</span><b>${v}</b></div>`).join("")}</div>`}
function statName(k){return {strength:"Fuerza",intelligence:"Inteligencia",constitution:"Constitución",dexterity:"Destreza",charisma:"Carisma"}[k]||k}
function renderQuests(){return `<h3>🎯 Objetivos</h3>${game.quests.map(q=>`<div class="questline"><span>${q.done?'✅':'⬜'} ${q.text}</span></div>`).join("")}`}
function renderInventory(){let html=`<h3>🧍 Equipo de Carl</h3><div class="equipment-grid">`;const slots={weapon:"Arma",fist:"Puño",hands:"Manos",innerTorso:"Torso interno",cloak:"Capa",toe:"Dedo del pie",legs:"Piernas",pants:"Pantalones"};for(const [slot,label] of Object.entries(slots)){const id=game.player.equipment[slot];html+=`<div class="slot"><b>${label}</b>${id?`${getItem(id).icon} ${getItem(id).name}`:'— vacío —'}</div>`}html+=`</div><h3>🎒 Inventario</h3>`;Object.entries(game.inventory).filter(([id,q])=>q>0).forEach(([id,q])=>{const it=getItem(id);const equippable=DB.items[id]&&DB.items[id].slot;const usable=DB.items[id]&&DB.items[id].use;const box=DB.lootBoxes[id];html+=`<div class="itemline"><span title="${it.desc||''}">${it.icon||'📦'} ${it.name} <span class="muted">x${q}</span></span><span>${equippable?`<button onclick="equipItem('${id}')">Equipar</button>`:''}${usable?`<button onclick="useItem('${id}')">Usar</button>`:''}${box?`<button onclick="openOneBox('${id}')">Abrir</button>`:''}</span></div>`});return html}
function renderSkills(){const names={pugilism:"Pugilismo",unarmed:"Combate sin armas",footSoldier:"Soldado de a pie",squish:"Despachurrar",regen:"Regeneración",ironFist:"Puño de hierro",powerStrike:"Golpe poderoso",explosives:"Explosivos",magicMissile:"Proyectil mágico",lightFeet:"Pies ligeros",slicing:"Ataque rebanador",rearClaw:"Garra trasera",firstImpression:"Buena primera impresión"};let html="<h3>📚 Carl</h3>";Object.entries(game.player.skills).forEach(([k,v])=>html+=`<div class="skillline"><span>${names[k]||k}</span><b>${calcSkill('player',k)}</b></div>`);html+="<h3>🐱 Dónut</h3>";Object.entries(game.donut.skills).forEach(([k,v])=>html+=`<div class="skillline"><span>${names[k]||k}</span><b>${calcSkill('donut',k)}</b></div>`);return html}
function equipItem(id){const it=DB.items[id];if(!it||!it.slot)return; if((game.inventory[id]||0)<=0)return; const old=game.player.equipment[it.slot]; if(old)addItem(old,1); removeItem(id,1); game.player.equipment[it.slot]=id; notify(`Equipado: ${it.icon} ${it.name}`,'good'); if(id==='pants')game.quests.find(q=>q.id==='pants').done=true; if(id==='warGauntlets'||id==='brassKnuckles')game.quests.find(q=>q.id==='gauntlets').done=true; render()}
function useItem(id){const it=DB.items[id];if(!it||!removeItem(id,1))return; if(it.use==='heal'){game.player.hp=clamp(game.player.hp+Math.floor(maxHp('player')*it.value),0,maxHp('player'));notify('Te tomás una poción. La carne vuelve a acordarse de su forma.','good')} if(it.use==='mana'){game.player.mana=clamp(game.player.mana+it.value,0,maxMana('player'));notify('Recuperás maná. No mucho, pero algo es algo.','magic')} if(it.use==='bleed'){game.player.statuses=game.player.statuses.filter(s=>s!=='bleed');notify('Te vendás como podés. Menos sangre en el piso.','good')} if(it.use==='ironSkin'){game.player.temp.ironSkin=true;notify('Tu piel se endurece como si fueras una estatua con problemas de autoestima.','magic')} render()}
function openOneBox(id){if(!DB.lootBoxes[id]||!removeItem(id,1))return; const box=DB.lootBoxes[id];notify(`Abrís ${box.icon} ${box.name}.`,'magic');box.drops.forEach(([item,q])=>{addItem(item,q);notify(`Recibido: ${getItem(item).icon} ${getItem(item).name} x${q}`,'good')});render()}
function openBoxes(){const boxes=Object.keys(DB.lootBoxes).filter(id=>(game.inventory[id]||0)>0).sort((a,b)=>DB.lootBoxes[a].rarity-DB.lootBoxes[b].rarity);if(!boxes.length){notify('No tenés cajas para abrir. Qué pobreza conceptual.','warn');render();return}boxes.forEach(id=>{while((game.inventory[id]||0)>0)openOneBox(id)});}
function sleep(){game.player.hp=maxHp('player');game.donut.hp=maxHp('donut');game.player.mana=maxMana('player');game.donut.mana=maxMana('donut');advanceTime(8);notify('Dormís en una habitación segura. AGOTADO eliminado. Dónut usó tu cuello como almohada real.','good');render()}
function eat(){notify('Tally sirve vindaloo perfecto y paté de salmón. Moral restaurada; hambre cancelada.','good');advanceTime(.5);render()} function shower(){notify('Ducha caliente. El agua sale negra un rato. La dignidad sube 1 punto imaginario.','good');advanceTime(.35);render()} function talkTally(){notify('Tally: “Comida sí. Preguntas de mazmorra no. No fumar.”','warn');render()} function askMordecai(){notify('Mordecai: “Los primeros pisos son para descubrir tu build. No aceptes tratos malos antes del piso 12.”','magic');render()} function lootRebecca(){if(game.quests.find(q=>q.id==='lootRebeccaDone')){notify('Ya saqueaste este cadáver. No queda ni vergüenza.','warn');return}addItem('dignityBox',1);addItem('healingPotion',2);game.quests.push({id:'lootRebeccaDone',text:'Saqueaste el cadáver de Rebecca W. y eso te dejó una sensación horrible.',done:true});notify('Saqueás a Rebecca W.: caja de dignidad textil y pociones. Dónut aprueba demasiado.','warn');render()}
function peekNest(){notify('Dónut ve montones de cucarachas y algo grande. El olor atraviesa el concepto de nariz.','warn');render()} function throwDynamite(){if(!removeItem('dynamite',1)){notify('No tenés dinamita. La prudencia gana por falta de recursos.','warn');return}game.player.hp=clamp(game.player.hp-35,1,maxHp('player'));addItem('goldCrowd',1);addItem('silverGoblin',1);notify('¡BUM! La dinamita explota al caer. Matás un enjambre entero, casi te matás vos, y dañás algo grande.','bad');startBoss(true)}
function useNeighborhoodMap(){game.neighborhoodRevealed=true;notify('Usás el mapa de barrio. Se revelan safe rooms, cadáveres y amenazas cercanas.','magic');render()}
function startCombat(ids){const enemies=ids.map(id=>{const e=deepClone(DB.enemies[id]);e.id=id;e.maxHp=e.hp;e.statuses=[];return e});game.combat={boss:false,enemies,round:1,log:[],phase:'player'};game.mode='combat';openCombatModal(false)} function startBoss(preDamaged=false){const e=deepClone(DB.enemies.hoarder);e.id='hoarder';e.maxHp=e.hp;if(preDamaged)e.hp=45;e.statuses=[];game.location='boss_room';if(!game.explored.includes('boss_room'))game.explored.push('boss_room');game.combat={boss:true,enemies:[e],round:1,log:["VERSUS: El séquito de la Princesa Dónut vs La Acaparadora"],phase:'player',addsTimer:2};game.mode='combat';openCombatModal(true)}
function openCombatModal(isBoss){document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').textContent=isBoss?'☠️ ¡Batalla contra jefe!':'⚔️ Combate';renderCombatModal()}
function renderCombatModal(){const c=game.combat;if(!c)return;let body=c.boss?`<div class="big-versus">VERSUS</div>`:"";body+=`<div class="combat-grid"><div><h3>Party</h3><div class="enemy-card"><b>🧍 Carl</b>${hpBar(game.player.hp,maxHp('player'))}<div class="small muted">MP ${game.player.mana}/${maxMana('player')}</div></div><div class="enemy-card"><b>🐱 Dónut</b>${hpBar(game.donut.hp,maxHp('donut'),'mana')}<div class="small muted">MP ${game.donut.mana}/${maxMana('donut')}</div></div><h3>Acciones</h3><div class="actions" style="padding:0;border:0;background:none"><button onclick="combatAction('punch')">👊 Puñetazo</button><button onclick="combatAction('kick')">🦶 Patada</button><button onclick="combatAction('stomp')">🦶💥 Pisar</button><button onclick="combatAction('dynamite')">💣 Dinamita</button><button onclick="combatAction('heal')">🧪 Poción</button><button onclick="combatAction('iron')">🧴 Piel hierro</button>${c.boss?'':`<button onclick="fleeCombat()">🏃 Huir</button>`}</div></div><div><h3>Enemigos</h3>${c.enemies.map((e,i)=>`<div class="enemy-card"><b>${e.icon} ${e.name} Nv.${e.level}</b>${hpBar(e.hp,e.maxHp,e.hp/e.maxHp<.35?'bad':'')}<div class="small muted">${e.desc}</div><div class="small">Estados: ${e.statuses.join(', ')||'—'}</div><button onclick="targetIndex=${i};renderCombatModal()">${targetIndex===i?'🎯 Objetivo':'Elegir'}</button></div>`).join('')}</div></div><h3>Log de combate</h3><div class="log">${c.log.slice(-8).reverse().map(x=>`<div class="log-entry">${x}</div>`).join('')}</div>`;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalTitle').textContent=c.boss?'☠️ ¡Batalla contra jefe!':'⚔️ Combate'}
let targetIndex=0;
function activeEnemy(){const e=game.combat.enemies[targetIndex];return e||game.combat.enemies[0]}
function combatLog(s){game.combat.log.push(s)}
function unarmedDamage(kind){const st=calcStats('player');let dmg=st.strength+calcSkill('player','unarmed')*2+calcSkill('player','pugilism')*2; if(kind==='kick')dmg+=calcSkill('player','footSoldier')*3;if(kind==='stomp')dmg+=calcSkill('player','squish')*4;if(game.player.equipment.fist==='brassKnuckles'||game.player.equipment.hands==='warGauntlets')dmg+=8+calcSkill('player','ironFist')*2;return rnd(Math.floor(dmg*.75),Math.ceil(dmg*1.15))}
function combatAction(a){const c=game.combat;if(!c)return;let e=activeEnemy();if(!e)return;if(a==='heal'){if(removeItem('healingPotion',1)){game.player.hp=clamp(game.player.hp+Math.floor(maxHp('player')*.5),0,maxHp('player'));combatLog('Carl usa una poción de sanación.')}else combatLog('No quedan pociones.');enemyTurn();return} if(a==='iron'){if(removeItem('ironSkin',1)){game.player.temp.ironSkin=true;combatLog('Carl usa Piel de hierro.')}else combatLog('No queda Piel de hierro.');enemyTurn();return} if(a==='dynamite'){if(!removeItem('dynamite',1)){combatLog('No queda dinamita.')}else{const self=rnd(8,22);game.player.hp=clamp(game.player.hp-self,0,maxHp('player'));c.enemies.forEach(en=>en.hp-=rnd(35,60));combatLog(`Dinamita goblin: todo explota. Carl recibe ${self}.`);skillUp('player','explosives',1);checkDeadEnemies()}enemyTurn();return}
 let dmg=unarmedDamage(a); if(a==='punch'&&!hasHandProtection()) {const recoil=rnd(2,6);game.player.hp=clamp(game.player.hp-recoil,0,maxHp('player'));combatLog(`Te lastimás la mano (${recoil}) por pegarle a algo demasiado sólido.`)} if(a==='stomp'&&e.statuses.includes('stunned')){dmg=Math.floor(dmg*1.7);combatLog('¡Crítico preparado! Aturdido + pisotón al punto débil.')} e.hp-=dmg;combatLog(`Carl usa ${a==='punch'?'puñetazo':a==='kick'?'patada':'pisotón'} e inflige ${dmg}.`); if(Math.random()<.25){e.statuses.push('stunned');combatLog(`${e.name} queda aturdido.`)} checkDeadEnemies(); donutAuto(); enemyTurn()}
function hasHandProtection(){return game.player.equipment.hands==='warGauntlets'||game.player.equipment.fist==='brassKnuckles'}
function donutAuto(){const c=game.combat;if(!c||!c.enemies.length)return;let e=c.enemies.find(x=>x.hp>0);if(!e)return;if(game.donut.mana>=5){game.donut.mana-=5;let dmg=rnd(22,34)+calcSkill('donut','magicMissile')*3;e.hp-=dmg;combatLog(`Dónut dispara Proyectil mágico (${dmg}).`);if(Math.random()<.15){e.statuses.push('septicemia');combatLog(`${e.name} contrae SEPTICEMIA.`)}}else if((game.inventory.manaPotion||0)>0&&game.donut.potionCooldown<=0){removeItem('manaPotion',1);game.donut.mana=clamp(game.donut.mana+8,0,maxMana('donut'));game.donut.potionCooldown=2;combatLog('Dónut bebe una poción de maná con indignación.')}else{let dmg=rnd(10,18)+Math.floor(calcStats('donut').strength/3);e.hp-=dmg;combatLog(`Dónut usa garras (${dmg}) y se queja del trabajo manual.`)}checkDeadEnemies()}
function enemyTurn(){const c=game.combat;if(!c)return;if(game.donut.potionCooldown>0)game.donut.potionCooldown--;c.enemies=c.enemies.filter(e=>e.hp>0);if(!c.enemies.length){winCombat();return}if(c.boss&&c.round%2===0){const add=deepClone(DB.enemies.guardian);add.id='guardian';add.maxHp=add.hp;c.enemies.push(add);combatLog('La Acaparadora vomita un guardián de nidada. Lamentablemente.')}c.enemies.forEach(e=>{if(e.statuses.includes('septicemia')){e.hp-=18;combatLog(`${e.name} sufre septicemia.`);if(e.hp<=0)return}let target=Math.random()<.35?'donut':'player';let dmg=rnd(Math.floor(e.atk*.7),Math.ceil(e.atk*1.3));if(target==='player'){if(game.player.temp.ironSkin)dmg=Math.ceil(dmg/2);game.player.hp=clamp(game.player.hp-dmg,0,maxHp('player'));combatLog(`${e.name} golpea a Carl por ${dmg}.`);if(e.statusOnHit==='poison'&&!hasResist('poison'))game.player.statuses.push('poison');}else{game.donut.hp=clamp(game.donut.hp-dmg,0,maxHp('donut'));combatLog(`${e.name} alcanza a Dónut por ${dmg}.`)}});c.round++;regenTick();if(game.player.hp<=0||game.donut.hp<=0){alert('La mazmorra reclama otra estadística. Fin.');resetGame();return}checkDeadEnemies();renderCombatModal();render()}
function hasResist(r){const eq=game.player.equipment;return Object.values(eq).some(id=>DB.items[id]&&DB.items[id].resists&&DB.items[id].resists.includes(r))}
function regenTick(){let regen=calcSkill('player','regen');if(regen>0)game.player.hp=clamp(game.player.hp+regen*5,0,maxHp('player'));game.donut.mana=clamp(game.donut.mana+2,0,maxMana('donut'))}
function checkDeadEnemies(){const c=game.combat;if(!c)return;c.enemies.forEach(e=>{if(e.hp<=0&&!e.dead){e.dead=true;combatLog(`${e.name} muere.`);gainXP(e.xp||10);(e.loot||[]).forEach(([it,q])=>{addItem(it,q);combatLog(`Loot: ${getItem(it).icon} ${getItem(it).name} x${q}`)})}});c.enemies=c.enemies.filter(e=>e.hp>0)}
function gainXP(xp){game.player.xp+=Math.floor(xp*.6);game.donut.xp+=Math.floor(xp*.55);while(game.player.xp>=game.player.xpNext){game.player.xp-=game.player.xpNext;game.player.level++;game.player.statPoints+=3;game.player.xpNext=Math.floor(game.player.xpNext*1.32);notify(`Carl sube a nivel ${game.player.level}. +3 puntos bloqueados.`,'good');['pugilism','unarmed','footSoldier','squish'].forEach(s=>skillUp('player',s,1))}while(game.donut.xp>=game.donut.xpNext){game.donut.xp-=game.donut.xpNext;game.donut.level++;game.donut.stats.strength++;game.donut.stats.intelligence++;game.donut.stats.charisma+=2;game.donut.xpNext=Math.floor(game.donut.xpNext*1.32);notify(`Dónut sube a nivel ${game.donut.level}. Se vuelve más insoportable y más útil.`,'magic')}}
function skillUp(who,skill,amt){const actor=who==='donut'?game.donut:game.player;actor.skills[skill]=(actor.skills[skill]||0)+amt}
function winCombat(){const c=game.combat;if(c.boss){game.bossDefeated=true;game.quests.find(q=>q.id==='premiere').done=true;game.quests.find(q=>q.id==='nest').done=true;addItem('bronzeBoss',1);addItem('mapNeighborhood',1);addItem('dignityBox',1);game.player.badges.push('★ jefe');notify('¡Victoria contra jefe! Recibís caja de jefe, mapa de barrio y una estrella de prestigio.','gold');game.location='nest_door'}else{if(Math.random()<.35)addItem('bronzeAdventurer',1);notify('Combate ganado. Más sangre, más XP, más preguntas existenciales.','good')}game.combat=null;game.mode='explore';closeModal();advanceTime(.35);render()}
function fleeCombat(){if(game.combat&&game.combat.boss){combatLog('No se puede huir de un jefe. La puerta se ríe de vos.');renderCombatModal();return}game.combat=null;game.mode='explore';closeModal();notify('Huís del combate. No heroico, pero estadísticamente sensato.','warn');advanceTime(.2);render()}
function openModal(kind){document.getElementById('modal').classList.add('show');const title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');if(kind==='help'){title.textContent='❔ Ayuda rápida';body.innerHTML=`<p><b>Objetivo del MVP:</b> farmear, equiparte, vencer al jefe de barrio y sobrevivir.</p><p>Usá safe rooms para dormir, comer y abrir cajas. En combate, combiná Proyectil mágico de Dónut con golpes/pisotones de Carl. La dinamita pega fuerte, pero también te revienta.</p><p>Probá saquear a Rebecca, abrir cajas, equipar pantalones/guanteletes y usar el mapa de barrio.</p>`}if(kind==='notifications'){title.textContent='📁 Notificaciones';game.notifications.forEach(n=>n.read=true);body.innerHTML=game.notifications.map(n=>`<div class="log-entry ${n.type}">${n.msg}</div>`).join('')||'No hay notificaciones.';renderHUD()}}
function closeModal(){document.getElementById('modal').classList.remove('show'); if(game.mode==='combat'&&game.combat){} }
function saveGame(){localStorage.setItem('mazmorraMVP',JSON.stringify(game));notify('Partida guardada en este navegador.','good');render()} function loadGame(){const s=localStorage.getItem('mazmorraMVP');if(!s){notify('No hay partida guardada.','warn');render();return}game=JSON.parse(s);notify('Partida cargada.','good');render()} function resetGame(){game=defaultGame();targetIndex=0;notify('Nueva mazmorra inicializada. La dignidad sigue opcional.','warn');render()}
notify('MVP iniciado: Carl y Dónut están en una estancia segura. Abrí cajas, explorá y buscá problemas.','magic');render();
</script>
