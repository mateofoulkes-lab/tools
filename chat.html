<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat General</title>

<script type="module">
  import { init, tx, id } from "https://esm.sh/@instantdb/core";

  const APP_ID = "b1444761-2c88-4438-ae19-4c29c727d227";

  const db = init({ appId: APP_ID });

  const $ = (s) => document.querySelector(s);

  const state = {
    userId: localStorage.getItem("chat-user-id") || crypto.randomUUID(),
    nick: localStorage.getItem("chat-nick") || "Invitado",
    color: localStorage.getItem("chat-color") || "#66b3ff",
    messages: [],
    users: []
  };

  localStorage.setItem("chat-user-id", state.userId);

  const els = {
    nick: $("#nick"),
    color: $("#color"),
    users: $("#users"),
    messages: $("#messages"),
    form: $("#form"),
    input: $("#input"),
    status: $("#status")
  };

  els.nick.value = state.nick;
  els.color.value = state.color;

  function saveProfile() {
    state.nick = els.nick.value.trim() || "Invitado";
    state.color = els.color.value || "#66b3ff";
    localStorage.setItem("chat-nick", state.nick);
    localStorage.setItem("chat-color", state.color);
    heartbeat();
  }

  els.nick.addEventListener("input", saveProfile);
  els.color.addEventListener("input", saveProfile);

  async function heartbeat() {
    await db.transact(
      tx.activeUsers[state.userId].update({
        userId: state.userId,
        nick: state.nick,
        color: state.color,
        lastSeen: Date.now()
      })
    );
  }

  setInterval(heartbeat, 5000);
  heartbeat();

  window.addEventListener("beforeunload", () => {
    try {
      db.transact(tx.activeUsers[state.userId].delete());
    } catch {}
  });

  db.subscribeQuery(
    {
      messages: {},
      activeUsers: {}
    },
    (resp) => {
      if (resp.error) {
        els.status.textContent = "Error conectando.";
        console.error(resp.error);
        return;
      }

      els.status.textContent = "Conectado";

      const now = Date.now();

      state.messages = [...(resp.data.messages || [])]
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      state.users = [...(resp.data.activeUsers || [])]
        .filter(u => now - (u.lastSeen || 0) < 20000)
        .sort((a, b) => (a.nick || "").localeCompare(b.nick || ""));

      renderMessages();
      renderUsers();
    }
  );

  function renderMessages() {
    const atBottom =
      els.messages.scrollTop + els.messages.clientHeight >= els.messages.scrollHeight - 60;

    els.messages.innerHTML = state.messages.map(m => `
      <div class="msg">
        <div class="avatar" style="background:${escapeHtml(m.color || "#66b3ff")}"></div>
        <div class="bubble">
          <div class="meta">
            <span class="nick" style="color:${escapeHtml(m.color || "#66b3ff")}">${escapeHtml(m.nick || "Invitado")}</span>
            <span class="time">${formatTime(m.createdAt)}</span>
          </div>
          <div class="text">${escapeHtml(m.text || "")}</div>
        </div>
      </div>
    `).join("");

    if (atBottom) {
      els.messages.scrollTop = els.messages.scrollHeight;
    }
  }

  function renderUsers() {
    els.users.innerHTML = state.users.map(u => `
      <div class="user">
        <span class="user-dot" style="background:${escapeHtml(u.color || "#66b3ff")}"></span>
        <span>${escapeHtml(u.nick || "Invitado")}</span>
      </div>
    `).join("");
  }

  els.form.addEventListener("submit", async (ev) => {
    ev.preventDefault();

    const text = els.input.value.trim();
    if (!text) return;

    els.input.value = "";

    await db.transact(
      tx.messages[id()].update({
        text,
        userId: state.userId,
        nick: state.nick,
        color: state.color,
        createdAt: Date.now()
      })
    );

    heartbeat();
  });

  function formatTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleTimeString("es-AR", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }
</script>

<style>
  :root {
    --bg: #0f1115;
    --panel: #171b24;
    --panel2: #202635;
    --text: #eef2f7;
    --muted: #9aa7b8;
    --border: #2b3446;
    --accent: #66b3ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a2336, #0f1115 55%);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 260px;
  }

  .main {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-width: 0;
  }

  .topbar {
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: rgba(15, 18, 25, .78);
    backdrop-filter: blur(10px);
  }

  .topbar input[type="text"] {
    width: 180px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #101722;
    color: var(--text);
  }

  .topbar input[type="color"] {
    width: 44px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: transparent;
    padding: 4px;
  }

  .status {
    margin-left: auto;
    color: var(--muted);
    font-size: 13px;
  }

  .messages {
    padding: 18px;
    overflow-y: auto;
  }

  .msg {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    align-items: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    flex: 0 0 auto;
    box-shadow: 0 0 0 3px rgba(255,255,255,.06);
  }

  .bubble {
    max-width: min(760px, 90%);
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
  }

  .meta {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .nick {
    font-weight: 700;
  }

  .time {
    color: var(--muted);
    font-size: 12px;
  }

  .text {
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: rgba(15, 18, 25, .82);
    backdrop-filter: blur(10px);
  }

  .form input {
    flex: 1;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #101722;
    color: var(--text);
  }

  .form button {
    padding: 0 18px;
    border: 1px solid #4e90f7;
    border-radius: 14px;
    background: linear-gradient(180deg, #3a7ee8, #2962c9);
    color: white;
    cursor: pointer;
    font-weight: 700;
  }

  .side {
    border-left: 1px solid var(--border);
    background: rgba(12, 14, 19, .78);
    backdrop-filter: blur(10px);
    padding: 16px;
    overflow: auto;
  }

  .side h2 {
    margin: 0 0 12px;
    font-size: 15px;
  }

  .user {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 8px;
    border-radius: 12px;
    color: var(--text);
  }

  .user:hover {
    background: rgba(255,255,255,.04);
  }

  .user-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    flex: 0 0 auto;
  }

  @media (max-width: 800px) {
    .app {
      grid-template-columns: 1fr;
    }

    .side {
      display: none;
    }

    .topbar {
      flex-wrap: wrap;
    }

    .status {
      margin-left: 0;
    }
  }
</style>
</head>

<body>
  <div class="app">
    <main class="main">
      <header class="topbar">
        <input id="nick" type="text" maxlength="24" placeholder="Nick" />
        <input id="color" type="color" />
        <div id="status" class="status">Conectando...</div>
      </header>

      <section id="messages" class="messages"></section>

      <form id="form" class="form">
        <input id="input" type="text" autocomplete="off" placeholder="Escribí un mensaje..." />
        <button>Enviar</button>
      </form>
    </main>

    <aside class="side">
      <h2>Usuarios activos</h2>
      <div id="users"></div>
    </aside>
  </div>
</body>
</html>
