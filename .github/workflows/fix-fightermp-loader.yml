name: Fix fightermp loader
on:
  push:
    paths:
      - '.github/workflows/fix-fightermp-loader.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix SkeletonUtils import and add visible startup errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fightermp.html')
          s=p.read_text()
          old="import {SkeletonUtils} from 'three/addons/utils/SkeletonUtils.js';"
          new="import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';"
          assert old in s
          s=s.replace(old,new,1)
          marker="<script type=\"module\">"
          err="""<script>\nwindow.addEventListener('error',e=>{const s=document.getElementById('splash');if(s){s.style.display='grid';s.innerHTML='<div><b style=\\\"color:#ff9b9b\\\">ERROR DE ARRANQUE</b><br><small style=\\\"display:block;max-width:80vw;margin-top:8px;opacity:.8\\\">'+String(e.message||e.error||'Error desconocido')+'</small></div>';}});\nwindow.addEventListener('unhandledrejection',e=>{const s=document.getElementById('splash');if(s){s.style.display='grid';s.innerHTML='<div><b style=\\\"color:#ff9b9b\\\">ERROR DE ARRANQUE</b><br><small style=\\\"display:block;max-width:80vw;margin-top:8px;opacity:.8\\\">'+String(e.reason?.message||e.reason||'Promise rechazada')+'</small></div>';}});\n</script>\n"""
          assert marker in s
          s=s.replace(marker,err+marker,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q "import \* as SkeletonUtils" fightermp.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fightermp.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/fightermp.mjs').write_text(m.group(1))
          PY
          node --check /tmp/fightermp.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightermp.html
          git commit -m "Fix fightermp Three.js SkeletonUtils import"
          git push
