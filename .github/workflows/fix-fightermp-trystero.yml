name: Fix fightermp Trystero API
on:
  push:
    paths:
      - '.github/workflows/fix-fightermp-trystero.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fightermp to match working Soquetin Trystero API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fightermp.html')
          s=p.read_text()

          old="const ROOM='mateo-fightermp-v1';const room=joinRoom({appId:'mateo-tools-fightermp'},ROOM);const [sendState,getState]=room.makeAction('fighter-state');const [sendHit,getHit]=room.makeAction('fighter-hit');const [sendPing,getPing]=room.makeAction('fighter-ping');const [sendPong,getPong]=room.makeAction('fighter-pong');const [sendReset,getReset]=room.makeAction('fighter-reset');"
          new="const ROOM='mateo-fightermp-v1';const room=joinRoom({appId:'mateo-tools-fightermp'},ROOM,{onJoinError:({error})=>{console.warn('Fighter MP join error',error);const el=document.getElementById('netState');if(el){el.textContent='P2P · ERROR';el.className='bad'}}});const stateAction=room.makeAction('fighter-state');const hitAction=room.makeAction('fighter-hit');const resetAction=room.makeAction('fighter-reset');"
          assert old in s, 'action declaration not found'
          s=s.replace(old,new,1)

          s=s.replace("sendHit({id:crypto.randomUUID(),from:selfId,to:remoteId,damage:damageFor(local),type:local.attack,t:Date.now()})","hitAction.send({id:crypto.randomUUID(),from:selfId,to:remoteId,damage:damageFor(local),type:local.attack,t:Date.now()},{target:remoteId}).catch(()=>{})")
          s=s.replace("if(broadcast)sendReset({t:Date.now()})","if(broadcast)resetAction.send({t:Date.now()}).catch(()=>{})")
          s=s.replace("sendState({x:local.x,z:local.z,yaw:local.yaw,hp:local.hp,block:local.block,action:local.attack||local.current,t:Date.now()})","stateAction.send({x:local.x,z:local.z,yaw:local.yaw,hp:local.hp,block:local.block,action:local.attack||local.current,t:Date.now()}).catch(()=>{})")

          start=s.index("room.onPeerJoin(id=>")
          end=s.index("\n\nloader.load('fightermp/Barbarian.glb'", start)
          assert start!=-1 and end!=-1, 'network handler block not found'
          replacement="""room.onPeerJoin=id=>{remoteId=id;document.getElementById('netState').textContent='P2P · CONECTADO';document.getElementById('netState').className='ok';if(source&&!fighters.has(id))makeFighter(id,false);assignSides();if(local)stateAction.send({x:local.x,z:local.z,yaw:local.yaw,hp:local.hp,block:local.block,action:local.attack||local.current,t:Date.now()},{target:id}).catch(()=>{})};
room.onPeerLeave=id=>{if(fighters.has(id)){scene.remove(fighters.get(id).g);fighters.delete(id)}if(remoteId===id)remoteId=null;document.getElementById('netState').textContent='P2P · ESPERANDO RIVAL';document.getElementById('netState').className='wait'};
stateAction.onMessage=(d,{peerId:id})=>{if(!source||!d)return;if(!fighters.has(id))makeFighter(id,false);remoteId=id;const f=fighters.get(id);f.targetX=d.x;f.targetZ=d.z;f.targetYaw=d.yaw;f.targetHp=d.hp;f.block=!!d.block;f.lastSeen=performance.now();const a=d.action||'idle';if(a!==f.current)play(f,a,.08);assignSides()};
const seenHits=new Set();hitAction.onMessage=(d,{peerId:id})=>{if(!local||!d||d.to!==selfId||seenHits.has(d.id))return;seenHits.add(d.id);let dmg=d.damage||10;if(local.block)dmg=Math.max(2,Math.round(dmg*.25));local.hp=Math.max(0,local.hp-dmg);if(local.hp<=0)play(local,'death',.03);else play(local,'hit',.03)};
resetAction.onMessage=()=>resetLocal(false);"""
          s=s[:start]+replacement+s[end:]

          old_ping="if(remoteId&&now-lastPing>1000){lastPing=now;const seq=++pingSeq;pingSent.set(seq,performance.now());sendPing({seq,t:Date.now()},remoteId)}hud()"
          new_ping="if(remoteId&&now-lastPing>1000){lastPing=now;room.ping(remoteId).then(v=>{if(Number.isFinite(v)){rtts.push(v);if(rtts.length>8)rtts.shift();document.getElementById('rtt').textContent='RTT · '+Math.round(rtts.reduce((a,b)=>a+b,0)/rtts.length)+' ms'}}).catch(()=>{})}hud()"
          assert old_ping in s, 'ping block not found'
          s=s.replace(old_ping,new_ping,1)

          p.write_text(s)
          PY
      - name: Validate JavaScript and API shape
        run: |
          grep -q "const stateAction=room.makeAction" fightermp.html
          grep -q "stateAction.onMessage" fightermp.html
          grep -q "room.onPeerJoin=id=>" fightermp.html
          grep -q "room.ping(remoteId)" fightermp.html
          ! grep -q "const \[sendState,getState\]" fightermp.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fightermp.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/fightermp.mjs').write_text(m.group(1))
          PY
          node --check /tmp/fightermp.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightermp.html
          git commit -m "Fix fightermp Trystero API to match Soquetin"
          git push
