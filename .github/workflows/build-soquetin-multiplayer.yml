name: Build Soquetin multiplayer

on:
  push:
    paths:
      - '.github/workflows/build-soquetin-multiplayer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build multiplayer.html from canonical Soquetin
        run: python3 patch_soquetin_multiplayer.py
      - name: Syntax check module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('multiplayer.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          Path('/tmp/mp-check.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/mp-check.mjs
      - name: Verify multiplayer markers
        run: |
          grep -q "trystero@0.25.3" multiplayer.html
          grep -q "pose-v1" multiplayer.html
          grep -q "mpRoom.ping" multiplayer.html
          grep -q "JUGADORES" multiplayer.html
      - name: Commit multiplayer probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiplayer.html
          git commit -m "Add Soquetin P2P multiplayer probe" || exit 0
          git push
