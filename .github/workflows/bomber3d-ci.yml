name: Bomber3D CI

on:
  push:
    paths:
      - 'bomber3d/**'
      - '.github/workflows/bomber3d-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.6.0 upgrade if needed
        run: python bomber3d/upgrade_v060.py

      - name: Commit upgrade if needed
        run: |
          if ! git diff --quiet -- bomber3d/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bomber3d/index.html
            git commit -m "Bomber3D v0.6.0: per-bone axis and pose calibration"
            git push
          fi

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 >/tmp/bomber-http.log 2>&1 &
          echo $! > /tmp/bomber-http.pid
          sleep 2

      - name: Browser smoke test
        run: |
          cat > bomber-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const errors=[];

            const page = await browser.newPage();
            page.on('pageerror', e => errors.push('bomber pageerror: '+e.message));
            await page.goto('http://127.0.0.1:8000/bomber3d/', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(3000);
            const result = await page.waitForFunction(() => {
              const f=document.querySelector('#game');
              const w=f && f.contentWindow;
              const bodyText=document.body?.innerText||'';
              if (/ERROR|SyntaxError/i.test(bodyText)) return {done:true,error:bodyText.slice(0,1200)};
              if (w && w.__bomber3dRetarget) return {done:true,retarget:w.__bomber3dRetarget};
              return false;
            }, null, {timeout:60000}).then(h=>h.jsonValue()).catch(e=>({done:true,error:'timeout esperando calibrador: '+e.message}));

            const lab = await browser.newPage();
            lab.on('pageerror', e => errors.push('riglab pageerror: '+e.message));
            await lab.goto('http://127.0.0.1:8000/bomber3d/rig-lab.html', {waitUntil:'domcontentloaded', timeout:60000});
            const labResult = await lab.waitForFunction(() => {
              const status=document.querySelector('#load')?.textContent||'';
              const hb=document.querySelector('#hBone')?.options?.length||0;
              const kb=document.querySelector('#kBone')?.options?.length||0;
              const ready=window.__rigLabReady;
              if (/ERROR/i.test(status)) return {done:true,error:status};
              if (status.startsWith('✓') && ready && hb>8 && kb>8) return {done:true,status,hb,kb,ready};
              return false;
            }, null, {timeout:60000}).then(h=>h.jsonValue()).catch(e=>({done:true,error:'timeout Rig Lab: '+e.message}));

            if (errors.length){ result.pageErrors=errors; labResult.pageErrors=errors; }
            console.log('BOMBER',JSON.stringify(result,null,2));
            console.log('RIGLAB',JSON.stringify(labResult,null,2));
            await browser.close();
            if (result.error || labResult.error || errors.length || !result.retarget || !result.retarget.calibrated || result.retarget.profileCount < 6 || !labResult.ready) process.exit(1);
          })();
          JS
          node bomber-smoke.cjs
