<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Overlay (multi si hay)</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b0b0b; color:#fff; }
    header { padding: 12px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button { background:#1c1c1c; color:#fff; border:1px solid #333; padding:10px 12px; border-radius:10px; }
    #status { opacity:.8; font-size: 13px; }

    #wrap {
      position: relative;
      width: 100vw;
      height: calc(100vh - 64px);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    canvas { background:#000; touch-action:none; }
  </style>
</head>
<body>
  <header>
    <button id="btnStart">Iniciar cámara</button>
    <button id="btnFlip" disabled>Cambiar cámara</button>
    <span id="status">Listo.</span>
  </header>

  <div id="wrap">
    <canvas id="view"></canvas>
  </div>

  <!-- Fallback single-QR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    // ===== Datos hardcodeados (ahora con TALLES) =====
    // ID (string) -> { producto, precio, talles[] }
    const DB = {
      "1":  { producto: "Remera básica",        precio: 15.99,  talles: ["XS","S","M","L","XL"] },
      "2":  { producto: "Pantalón jean",        precio: 39.90,  talles: ["38","40","42","44","46"] },
      "3":  { producto: "Campera deportiva",    precio: 59.50,  talles: ["S","M","L","XL"] },
      "4":  { producto: "Buzo con capucha",     precio: 45.00,  talles: ["S","M","L","XL"] },
      "5":  { producto: "Camisa formal",        precio: 32.75,  talles: ["S","M","L","XL"] },
      "6":  { producto: "Zapatillas urbanas",   precio: 68.40,  talles: ["39","40","41","42","43","44"] },
      "7":  { producto: "Vestido casual",       precio: 54.30,  talles: ["XS","S","M","L"] },
      "8":  { producto: "Pollera midi",         precio: 28.90,  talles: ["XS","S","M","L"] },
      "9":  { producto: "Short deportivo",      precio: 22.10,  talles: ["S","M","L","XL"] },
      "10": { producto: "Sweater tejido",       precio: 47.60,  talles: ["S","M","L","XL"] },
      "11": { producto: "Chaleco acolchado",    precio: 52.00,  talles: ["S","M","L","XL"] },
      "12": { producto: "Blusa estampada",      precio: 26.80,  talles: ["XS","S","M","L"] },
      "13": { producto: "Jogging",              precio: 34.20,  talles: ["S","M","L","XL"] },
      "14": { producto: "Campera de cuero",     precio: 120.00, talles: ["S","M","L","XL"] },
      "15": { producto: "Top deportivo",        precio: 19.99,  talles: ["XS","S","M","L"] },
      "16": { producto: "Medias (pack x3)",     precio: 9.50,   talles: ["Único"] },
      "17": { producto: "Bufanda",              precio: 14.75,  talles: ["Único"] },
      "18": { producto: "Gorra",                precio: 12.40,  talles: ["Único"] },
      "19": { producto: "Traje de baño",        precio: 29.99,  talles: ["S","M","L","XL"] },
      "20": { producto: "Abrigo largo",         precio: 89.90,  talles: ["S","M","L","XL"] },
    };

    const wrapEl = document.getElementById("wrap");
    const viewCanvas = document.getElementById("view");
    const vctx = viewCanvas.getContext("2d", { willReadFrequently: false });

    const detectCanvas = document.createElement("canvas");
    const dctx = detectCanvas.getContext("2d", { willReadFrequently: true });

    const btnStart = document.getElementById("btnStart");
    const btnFlip  = document.getElementById("btnFlip");
    const statusEl = document.getElementById("status");

    const video = document.createElement("video");
    video.setAttribute("playsinline", "");

    let stream = null;
    let rafId = null;
    let facingMode = "environment";

    let detector = null;          // BarcodeDetector si existe
    let useNative = false;        // true si BarcodeDetector activo
    let detectBusy = false;       // lock anti solapado
    let lastDetections = [];      // cache para dibujar
    let lastDetectAt = 0;

    function setStatus(msg){ statusEl.textContent = msg; }

    function stopCamera(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream){
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      detector = null;
      useNative = false;
      lastDetections = [];
      detectBusy = false;
    }

    function setDetectSize(vw, vh){
      const targetW = 640; // 480 más rápido, 800 más sensible
      const scale = Math.min(1, targetW / vw);
      detectCanvas.width  = Math.max(320, Math.round(vw * scale));
      detectCanvas.height = Math.max(240, Math.round(vh * scale));
    }

    function fitCanvasCss(){
      const cw = viewCanvas.width, ch = viewCanvas.height;
      if (!cw || !ch) return;

      const maxW = wrapEl.clientWidth;
      const maxH = wrapEl.clientHeight;

      const scale = Math.min(maxW / cw, maxH / ch);
      viewCanvas.style.width  = Math.round(cw * scale) + "px";
      viewCanvas.style.height = Math.round(ch * scale) + "px";
    }

    window.addEventListener("resize", fitCanvasCss);

    async function tryLockPortrait(){
      // Mantener UI horizontal “siempre” (cuando el navegador lo permite)
      try{
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("portrait");
        }
      } catch(_) {
        // Ignorar: muchos navegadores no lo permiten sin “instalar” PWA, o lo bloquean en iOS.
      }
    }

    async function startCamera(){
      stopCamera();
      try{
        await tryLockPortrait();

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        viewCanvas.width  = video.videoWidth  || 1280;
        viewCanvas.height = video.videoHeight || 720;

        setDetectSize(viewCanvas.width, viewCanvas.height);
        fitCanvasCss();

        // Intentar BarcodeDetector (multi-QR)
        useNative = false;
        detector = null;
        if ("BarcodeDetector" in window){
          try {
            if (BarcodeDetector.getSupportedFormats) {
              const fmts = await BarcodeDetector.getSupportedFormats();
              if (fmts.includes("qr_code")) {
                detector = new BarcodeDetector({ formats: ["qr_code"] });
                useNative = true;
              }
            } else {
              detector = new BarcodeDetector({ formats: ["qr_code"] });
              useNative = true;
            }
          } catch (e){
            detector = null;
            useNative = false;
          }
        }

        btnFlip.disabled = false;
        setStatus(useNative ? "Cámara activa (multi-QR). Buscando…" : "Cámara activa (fallback 1 QR). Buscando…");
        tick();
      } catch(err){
        console.error(err);
        setStatus("Error accediendo a cámara. ¿Permisos denegados?");
      }
    }

    btnStart.addEventListener("click", startCamera);
    btnFlip.addEventListener("click", async () => {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      setStatus("Cambiando cámara…");
      await startCamera();
    });
    window.addEventListener("pagehide", stopCamera);

    // ==== Helpers overlay ====
    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function normalizeCorners(pts){
      // TL/TR/BR/BL por heurística sum/diff
      const p = pts.map(q => ({x:q.x, y:q.y}));
      let tl, tr, br, bl;
      let minSum=Infinity, maxSum=-Infinity, minDiff=Infinity, maxDiff=-Infinity;
      for (const q of p){
        const sum = q.x + q.y;
        const diff = q.x - q.y;
        if (sum < minSum){ minSum=sum; tl=q; }
        if (sum > maxSum){ maxSum=sum; br=q; }
        if (diff < minDiff){ minDiff=diff; bl=q; }
        if (diff > maxDiff){ maxDiff=diff; tr=q; }
      }
      return [tl, tr, br, bl];
    }

    function drawOutline(ctx, corners){
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      ctx.lineTo(corners[1].x, corners[1].y);
      ctx.lineTo(corners[2].x, corners[2].y);
      ctx.lineTo(corners[3].x, corners[3].y);
      ctx.closePath();
      ctx.stroke();
    }

    function formatPrice(num){
      // Si querés estilo Argentina (coma): descomentá el toLocaleString
      // return "$" + Number(num).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return "$" + Number(num).toFixed(2);
    }

    function drawProductCardUpright(ctx, row, corners){
      // Texto SIN rotación (horizontal a pantalla)
      const [tl, tr, br, bl] = corners;

      const cx = (tl.x + tr.x + br.x + bl.x) / 4;
      const topY = Math.min(tl.y, tr.y);
      const bottomY = Math.max(bl.y, br.y);

      const w = Math.hypot(tr.x - tl.x, tr.y - tl.y);
      const h = Math.hypot(bl.x - tl.x, bl.y - tl.y);
      const size = Math.max(1, Math.min(w, h));

      const productFont = Math.max(16, Math.round(size / 5.7));
      const priceFont   = Math.max(22, Math.round(productFont * 1.25));
      const sizesFont   = Math.max(14, Math.round(productFont * 0.85));
      const pad = Math.round(productFont * 0.7);

      const producto = row?.producto ?? "ID desconocida";
      const priceStr = row ? formatPrice(row.precio) : "";
      const sizesStr = row?.talles?.length ? row.talles.join(", ") : "";

      ctx.save();
      ctx.textBaseline = "top";

      // Medimos ancho máximo para caja
      ctx.font = `700 ${productFont}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      const productW = ctx.measureText(producto).width;

      ctx.font = `900 ${priceFont}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      const priceW = ctx.measureText(priceStr).width;

      ctx.font = `700 ${sizesFont}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      const sizesW = ctx.measureText(sizesStr).width;

      const boxW = Math.ceil(Math.max(productW, priceW, sizesW) + pad * 2);

      const line1H = productFont + 8;
      const line2H = priceFont + 6;
      const line3H = sizesStr ? (sizesFont + 2) : 0;
      const boxH = Math.ceil(pad * 2 + line1H + line2H + line3H);

      // Arriba del QR, si no entra: abajo
      let x = Math.round(cx - boxW / 2);
      let y = Math.round(topY - boxH - 10);
      if (y < 6) y = Math.round(bottomY + 10);

      // Clamp
      x = Math.max(6, Math.min(x, viewCanvas.width - boxW - 6));
      y = Math.max(6, Math.min(y, viewCanvas.height - boxH - 6));

      // Caja
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      roundRect(ctx, x, y, boxW, boxH, 16);
      ctx.fill();

      // Producto (arriba)
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.font = `700 ${productFont}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.fillText(producto, x + pad, y + pad);

      // Precio (centrado, más grande, bold)
      ctx.font = `900 ${priceFont}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      const px = x + (boxW - ctx.measureText(priceStr).width) / 2;
      const py = y + pad + line1H;
      ctx.fillText(priceStr, px, py);

      // Talles (debajo del precio, centrado)
      if (sizesStr){
        ctx.font = `700 ${sizesFont}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
        const sx = x + (boxW - ctx.measureText(sizesStr).width) / 2;
        const sy = py + line2H - 2;
        ctx.fillText(sizesStr, sx, sy);
      }

      ctx.restore();
    }

    // ==== Detección ====
    async function detect(){
      if (detectBusy) return;
      detectBusy = true;

      try{
        if (useNative && detector){
          const codes = await detector.detect(video);
          lastDetections = (codes || []).map(c => ({
            id: (c.rawValue || "").trim(),
            corners: normalizeCorners(c.cornerPoints || [])
          })).filter(d => d.id && d.corners[0] && d.corners[1] && d.corners[2] && d.corners[3]);
          return;
        }

        // Fallback jsQR (1 QR) sobre canvas chico
        dctx.drawImage(video, 0, 0, detectCanvas.width, detectCanvas.height);
        const img = dctx.getImageData(0, 0, detectCanvas.width, detectCanvas.height);
        const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });

        if (!qr) { lastDetections = []; return; }

        const loc = qr.location;
        const scaleX = viewCanvas.width / detectCanvas.width;
        const scaleY = viewCanvas.height / detectCanvas.height;

        const corners = [
          {x: loc.topLeftCorner.x * scaleX,     y: loc.topLeftCorner.y * scaleY},
          {x: loc.topRightCorner.x * scaleX,    y: loc.topRightCorner.y * scaleY},
          {x: loc.bottomRightCorner.x * scaleX, y: loc.bottomRightCorner.y * scaleY},
          {x: loc.bottomLeftCorner.x * scaleX,  y: loc.bottomLeftCorner.y * scaleY},
        ];
        lastDetections = [{ id: (qr.data || "").trim(), corners }];
      } catch (e){
        console.warn("Detect error:", e);
        useNative = false;
        detector = null;
        lastDetections = [];
      } finally {
        detectBusy = false;
      }
    }

    function tick(){
      vctx.drawImage(video, 0, 0, viewCanvas.width, viewCanvas.height);

      const now = performance.now();
      const intervalMs = 80;
      if (now - lastDetectAt >= intervalMs){
        lastDetectAt = now;
        detect();
      }

      if (lastDetections.length){
        vctx.lineWidth = Math.max(2, Math.round(viewCanvas.width / 500));
        vctx.strokeStyle = "rgba(0,255,200,0.9)";

        for (const d of lastDetections){
          drawOutline(vctx, d.corners);

          const row = DB[d.id];
          if (row){
            drawProductCardUpright(vctx, row, d.corners);
          } else {
            drawProductCardUpright(vctx, { producto: `ID desconocida: ${d.id}`, precio: 0, talles: [] }, d.corners);
          }
        }

        setStatus(useNative ? `Detectados: ${lastDetections.length}` : `Detectado: ${lastDetections[0].id} (fallback)`);
      } else {
        setStatus(useNative ? "Buscando QRs… (multi)" : "Buscando QR… (fallback 1)");
      }

      rafId = requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
