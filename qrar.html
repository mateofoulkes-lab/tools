<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Overlay</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b0b0b; color:#fff; }
    header { padding: 12px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button, select {
      background:#1c1c1c; color:#fff; border:1px solid #333; padding:10px 12px; border-radius:10px;
    }
    #wrap { position: relative; width: 100vw; height: calc(100vh - 64px); display:grid; place-items:center; }
    canvas { width: 100vw; height: 100%; max-height: 100%; background:#000; }
    #status { opacity:.8; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <button id="btnStart">Iniciar cámara</button>
    <button id="btnFlip" disabled>Cambiar cámara</button>
    <span id="status">Listo.</span>
  </header>

  <div id="wrap">
    <canvas id="c"></canvas>
  </div>

  <!-- jsQR desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // 2) "Base de datos" hardcodeada: QR_ID -> texto
    const DB = {
      "MOTZA": "Motza — Entrada al arroyo (Israel)",
      "FRIEDBERG": "Friedberg — Pasaje subterráneo (Alemania)",
      "SPEYER": "Speyer — Acceso a mikve medieval (Alemania)",
      "SIRACUSA": "Siracusa — Catacumbas / acceso antiguo (Italia)",
      "BALTIMORE": "Baltimore — Mikve histórica (EE.UU.)",
      "BA_PALERMO": "Buenos Aires — Palermo (moderna)"
    };

    const statusEl = document.getElementById("status");
    const btnStart = document.getElementById("btnStart");
    const btnFlip = document.getElementById("btnFlip");
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const video = document.createElement("video");
    video.setAttribute("playsinline", ""); // iOS: no fullscreen

    let stream = null;
    let facingMode = "environment"; // cámara trasera por default
    let rafId = null;
    let lastHit = { id: null, t: 0 };

    function setStatus(msg) { statusEl.textContent = msg; }

    function resizeCanvasToVideo() {
      const vw = video.videoWidth || 1280;
      const vh = video.videoHeight || 720;
      canvas.width = vw;
      canvas.height = vh;
    }

    async function startCamera() {
      stopCamera();

      try {
        // iOS Safari exige HTTPS (GitHub Pages lo es) y gesto de usuario para getUserMedia.
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        resizeCanvasToVideo();
        btnFlip.disabled = false;
        setStatus("Cámara activa. Buscando QR…");

        tick();
      } catch (err) {
        console.error(err);
        setStatus("Error: no pude acceder a la cámara. ¿Permiso denegado?");
      }
    }

    function stopCamera() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function drawOverlayForQR(qr) {
      // Dibuja un contorno del QR (opcional, pero útil)
      ctx.lineWidth = Math.max(2, Math.round(canvas.width / 400));
      ctx.strokeStyle = "rgba(0,255,200,0.9)";
      ctx.beginPath();
      ctx.moveTo(qr.location.topLeftCorner.x, qr.location.topLeftCorner.y);
      ctx.lineTo(qr.location.topRightCorner.x, qr.location.topRightCorner.y);
      ctx.lineTo(qr.location.bottomRightCorner.x, qr.location.bottomRightCorner.y);
      ctx.lineTo(qr.location.bottomLeftCorner.x, qr.location.bottomLeftCorner.y);
      ctx.closePath();
      ctx.stroke();

      const id = (qr.data || "").trim();
      const label = DB[id] ?? `ID desconocida: ${id}`;

      // Punto de anclaje: cerca del borde superior del QR
      const ax = qr.location.topLeftCorner.x;
      const ay = qr.location.topLeftCorner.y;

      // Fondo del texto
      const fontSize = Math.max(18, Math.round(canvas.width / 28));
      ctx.font = `700 ${fontSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.textBaseline = "top";

      const padding = Math.round(fontSize * 0.5);
      const maxWidth = Math.round(canvas.width * 0.85);

      // Medición simple + wrap (2 líneas máx)
      const lines = wrapText(ctx, label, maxWidth, 2);
      const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const textH = lines.length * (fontSize + 6);

      // Si queda fuera de pantalla, lo movemos abajo/derecha
      let x = ax;
      let y = ay - (textH + padding * 2 + 8);
      if (y < 0) y = ay + 8;
      if (x + textW + padding * 2 > canvas.width) x = canvas.width - (textW + padding * 2) - 8;
      if (x < 0) x = 8;

      // Rectángulo semi-transparente
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      roundRect(ctx, x, y, textW + padding * 2, textH + padding * 2, 14);
      ctx.fill();

      // Texto
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      let ty = y + padding;
      for (const line of lines) {
        ctx.fillText(line, x + padding, ty);
        ty += fontSize + 6;
      }

      // estado “pega” la última lectura para que no parpadee
      lastHit = { id, t: performance.now() };
      setStatus(`QR: ${id}`);
    }

    function wrapText(context, text, maxWidth, maxLines) {
      const words = text.split(/\s+/);
      const lines = [];
      let line = "";

      for (const w of words) {
        const test = line ? (line + " " + w) : w;
        if (context.measureText(test).width <= maxWidth) {
          line = test;
        } else {
          if (line) lines.push(line);
          line = w;
          if (lines.length === maxLines - 1) break;
        }
      }
      if (line) lines.push(line);

      // Si sobran palabras y ya llegamos al máximo, agregamos "…"
      if (lines.length === maxLines && words.join(" ").length > lines.join(" ").length) {
        lines[lines.length - 1] = lines[lines.length - 1].replace(/\s+$/, "") + "…";
      }
      return lines;
    }

    function roundRect(context, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      context.beginPath();
      context.moveTo(x + rr, y);
      context.arcTo(x + w, y, x + w, y + h, rr);
      context.arcTo(x + w, y + h, x, y + h, rr);
      context.arcTo(x, y + h, x, y, rr);
      context.arcTo(x, y, x + w, y, rr);
      context.closePath();
    }

    function tick() {
      // Dibuja el frame actual de video al canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Extrae pixels para decodificar
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });

      if (qr) {
        drawOverlayForQR(qr);
      } else {
        // Si hace poco había un QR, mantenemos status sin “parpadeo”
        const dt = performance.now() - lastHit.t;
        if (dt > 800) setStatus("Buscando QR…");
      }

      rafId = requestAnimationFrame(tick);
    }

    btnStart.addEventListener("click", startCamera);

    btnFlip.addEventListener("click", async () => {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      setStatus("Cambiando cámara…");
      await startCamera();
    });

    // Limpieza al cerrar
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
