<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Overlay (rápido, multi si hay)</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b0b0b; color:#fff; }
    header { padding: 12px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button { background:#1c1c1c; color:#fff; border:1px solid #333; padding:10px 12px; border-radius:10px; }
    #status { opacity:.8; font-size: 13px; }

    /* Contenedor que centra el canvas y evita estirado */
    #wrap {
      position: relative;
      width: 100vw;
      height: calc(100vh - 64px);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }

    /* El canvas NO fuerza height=100%. JS ajusta el size manteniendo ratio */
    canvas {
      background: #000;
      touch-action: none;
    }
  </style>
</head>
<body>
  <header>
    <button id="btnStart">Iniciar cámara</button>
    <button id="btnFlip" disabled>Cambiar cámara</button>
    <span id="status">Listo.</span>
  </header>

  <div id="wrap">
    <canvas id="view"></canvas>
  </div>

  <!-- Fallback single-QR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    // ===== DB hardcodeada =====
    const DB = {
      "MOTZA": "Motza — Entrada al arroyo (Israel)",
      "FRIEDBERG": "Friedberg — Pasaje subterráneo (Alemania)",
      "SPEYER": "Speyer — Acceso a mikve medieval (Alemania)",
      "SIRACUSA": "Siracusa — Catacumbas / acceso antiguo (Italia)",
      "BALTIMORE": "Baltimore — Mikve histórica (EE.UU.)",
      "BA_PALERMO": "Buenos Aires — Palermo (moderna)"
    };

    const wrapEl = document.getElementById("wrap");
    const viewCanvas = document.getElementById("view");
    const vctx = viewCanvas.getContext("2d", { willReadFrequently: false });

    const detectCanvas = document.createElement("canvas");
    const dctx = detectCanvas.getContext("2d", { willReadFrequently: true });

    const btnStart = document.getElementById("btnStart");
    const btnFlip  = document.getElementById("btnFlip");
    const statusEl = document.getElementById("status");

    const video = document.createElement("video");
    video.setAttribute("playsinline", "");

    let stream = null;
    let rafId = null;
    let facingMode = "environment";

    let detector = null;          // BarcodeDetector si existe
    let useNative = false;        // true si BarcodeDetector activo
    let detectBusy = false;       // lock anti solapado
    let lastDetections = [];      // cache de resultados para dibujar cada frame
    let lastDetectAt = 0;

    function setStatus(msg){ statusEl.textContent = msg; }

    function stopCamera(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream){
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      detector = null;
      useNative = false;
      lastDetections = [];
      detectBusy = false;
    }

    function setDetectSize(vw, vh){
      const targetW = 640; // ajustable: 480 más rápido, 800 más sensible
      const scale = Math.min(1, targetW / vw);
      detectCanvas.width  = Math.max(320, Math.round(vw * scale));
      detectCanvas.height = Math.max(240, Math.round(vh * scale));
    }

    // Ajusta el tamaño VISUAL del canvas manteniendo aspect ratio (sin estirar)
    function fitCanvasCss(){
      const cw = viewCanvas.width, ch = viewCanvas.height;
      if (!cw || !ch) return;

      const maxW = wrapEl.clientWidth;
      const maxH = wrapEl.clientHeight;

      const scale = Math.min(maxW / cw, maxH / ch);
      const cssW = Math.round(cw * scale);
      const cssH = Math.round(ch * scale);

      viewCanvas.style.width  = cssW + "px";
      viewCanvas.style.height = cssH + "px";
    }

    window.addEventListener("resize", fitCanvasCss);

    async function startCamera(){
      stopCamera();
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        // Canvas interno = resolución real del video (para overlay perfecto)
        viewCanvas.width  = video.videoWidth  || 1280;
        viewCanvas.height = video.videoHeight || 720;

        // Canvas de detección downscale
        setDetectSize(viewCanvas.width, viewCanvas.height);

        // Ajuste visual sin estirar
        fitCanvasCss();

        // Intentar BarcodeDetector (multi-QR)
        useNative = false;
        detector = null;
        if ("BarcodeDetector" in window){
          try {
            // Algunos navegadores soportan getSupportedFormats
            if (BarcodeDetector.getSupportedFormats) {
              const fmts = await BarcodeDetector.getSupportedFormats();
              if (fmts.includes("qr_code")) {
                detector = new BarcodeDetector({ formats: ["qr_code"] });
                useNative = true;
              }
            } else {
              detector = new BarcodeDetector({ formats: ["qr_code"] });
              useNative = true;
            }
          } catch (e){
            detector = null;
            useNative = false;
          }
        }

        btnFlip.disabled = false;
        setStatus(useNative ? "Cámara activa (multi-QR nativo). Buscando…" : "Cámara activa (fallback 1 QR). Buscando…");

        tick();
      } catch(err){
        console.error(err);
        setStatus("Error accediendo a cámara. ¿Permisos denegados?");
      }
    }

    btnStart.addEventListener("click", startCamera);
    btnFlip.addEventListener("click", async () => {
      facingMode = (facingMode === "environment") ? "user" : "environment";
      setStatus("Cambiando cámara…");
      await startCamera();
    });

    window.addEventListener("pagehide", stopCamera);

    // ==== Helpers overlay ====
    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function wrapText(ctx, text, maxWidth, maxLines){
      const words = (text || "").split(/\s+/).filter(Boolean);
      const lines = [];
      let line = "";
      for (const w of words){
        const test = line ? (line + " " + w) : w;
        if (ctx.measureText(test).width <= maxWidth){
          line = test;
        } else {
          if (line) lines.push(line);
          line = w;
          if (lines.length === maxLines - 1) break;
        }
      }
      if (line) lines.push(line);
      if (lines.length === maxLines && words.join(" ").length > lines.join(" ").length){
        lines[lines.length - 1] = lines[lines.length - 1].replace(/\s+$/, "") + "…";
      }
      return lines;
    }

    function angleFrom(a, b){
      return Math.atan2(b.y - a.y, b.x - a.x);
    }

    function normalizeCorners(pts){
      // TL/TR/BR/BL por heurística sum/diff
      const p = pts.map(q => ({x:q.x, y:q.y}));
      let tl, tr, br, bl;
      let minSum=Infinity, maxSum=-Infinity, minDiff=Infinity, maxDiff=-Infinity;
      for (const q of p){
        const sum = q.x + q.y;
        const diff = q.x - q.y;
        if (sum < minSum){ minSum=sum; tl=q; }
        if (sum > maxSum){ maxSum=sum; br=q; }
        if (diff < minDiff){ minDiff=diff; bl=q; }
        if (diff > maxDiff){ maxDiff=diff; tr=q; }
      }
      return [tl, tr, br, bl];
    }

    function drawOutline(ctx, corners){
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      ctx.lineTo(corners[1].x, corners[1].y);
      ctx.lineTo(corners[2].x, corners[2].y);
      ctx.lineTo(corners[3].x, corners[3].y);
      ctx.closePath();
      ctx.stroke();
    }

    function drawRotatedLabel(ctx, label, corners){
      const [tl, tr, br, bl] = corners;
      const angle = angleFrom(tl, tr);
      const topLen = Math.hypot(tr.x - tl.x, tr.y - tl.y);
      const leftLen = Math.hypot(bl.x - tl.x, bl.y - tl.y);
      const size = Math.max(1, Math.min(topLen, leftLen));

      const fontSize = Math.max(16, Math.round(size / 5));
      const pad = Math.round(fontSize * 0.55);
      const lineH = fontSize + 6;

      ctx.save();
      ctx.translate(tl.x, tl.y);
      ctx.rotate(angle);
      ctx.font = `800 ${fontSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.textBaseline = "top";

      const maxWidth = Math.min(viewCanvas.width * 0.8, Math.max(260, size * 3));
      const lines = wrapText(ctx, label, maxWidth, 2);
      const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
      const textH = lines.length * lineH;

      // Preferimos arriba del QR; si se va fuera, abajo
      const offset = Math.round(fontSize * 1.1);
      let x = 0;
      let y = -(textH + pad*2 + offset);

      // chequeo aproximado en coords globales: si arriba se va, mandamos abajo
      if (tl.y + y < 0) y = Math.round(leftLen + offset);

      ctx.fillStyle = "rgba(0,0,0,0.65)";
      roundRect(ctx, x, y, textW + pad*2, textH + pad*2, 14);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.95)";
      let ty = y + pad;
      for (const line of lines){
        ctx.fillText(line, x + pad, ty);
        ty += lineH;
      }
      ctx.restore();
    }

    // ==== Detección ====
    async function detect(){
      if (detectBusy) return;
      detectBusy = true;

      try{
        // Native multi: detect sobre el video (más estable)
        if (useNative && detector){
          const codes = await detector.detect(video);
          lastDetections = (codes || []).map(c => ({
            id: (c.rawValue || "").trim(),
            corners: normalizeCorners(c.cornerPoints || [])
          })).filter(d => d.id && d.corners[0] && d.corners[1] && d.corners[2] && d.corners[3]);

          return;
        }

        // Fallback jsQR (1 QR) sobre canvas chico (rápido)
        dctx.drawImage(video, 0, 0, detectCanvas.width, detectCanvas.height);
        const img = dctx.getImageData(0, 0, detectCanvas.width, detectCanvas.height);
        const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });

        if (!qr) { lastDetections = []; return; }

        const loc = qr.location;
        const scaleX = viewCanvas.width / detectCanvas.width;
        const scaleY = viewCanvas.height / detectCanvas.height;

        const corners = [
          {x: loc.topLeftCorner.x * scaleX,     y: loc.topLeftCorner.y * scaleY},
          {x: loc.topRightCorner.x * scaleX,    y: loc.topRightCorner.y * scaleY},
          {x: loc.bottomRightCorner.x * scaleX, y: loc.bottomRightCorner.y * scaleY},
          {x: loc.bottomLeftCorner.x * scaleX,  y: loc.bottomLeftCorner.y * scaleY},
        ];
        lastDetections = [{ id: (qr.data || "").trim(), corners }];
      } catch (e){
        // Si el native falla en runtime, apagamos native y seguimos con fallback
        console.warn("Detect error:", e);
        useNative = false;
        detector = null;
        lastDetections = [];
      } finally {
        detectBusy = false;
      }
    }

    function tick(){
      // Dibujar frame
      vctx.drawImage(video, 0, 0, viewCanvas.width, viewCanvas.height);

      // Detección por intervalos (no cada frame)
      const now = performance.now();
      const intervalMs = 80; // 50 = más responsive, 120 = menos CPU
      if (now - lastDetectAt >= intervalMs){
        lastDetectAt = now;
        detect(); // NO await (usamos lock + cache)
      }

      // Overlay de última detección cacheada
      if (lastDetections.length){
        vctx.lineWidth = Math.max(2, Math.round(viewCanvas.width / 500));
        vctx.strokeStyle = "rgba(0,255,200,0.9)";

        for (const d of lastDetections){
          const label = DB[d.id] ?? `ID desconocida: ${d.id}`;
          drawOutline(vctx, d.corners);
          drawRotatedLabel(vctx, label, d.corners);
        }
        setStatus(useNative ? `Detectados: ${lastDetections.length}` : `Detectado: ${lastDetections[0].id} (fallback)`);
      } else {
        setStatus(useNative ? "Buscando QRs… (multi)" : "Buscando QR… (fallback 1)");
      }

      rafId = requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
