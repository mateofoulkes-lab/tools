<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Bomber3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.touch{display:none;position:fixed;inset:0;z-index:9999;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none}.stickZone{position:absolute;bottom:18px;width:42vw;height:42vh;pointer-events:auto;touch-action:none}.leftZone{left:0}.rightZone{right:0}.base{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid #ffffff38;background:#0004;transform:translate(-50%,-50%);display:none;backdrop-filter:blur(3px)}.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffff2e;border:2px solid #ffffff48}.buttons{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(2,66px);gap:10px;pointer-events:auto}.btn{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#0009;border:2px solid #ffffff45;color:#fff;font:800 11px/1 system-ui;touch-action:none;backdrop-filter:blur(4px)}.jump{grid-column:2}.camHint{position:absolute;right:118px;bottom:118px;color:#fff8;font:700 10px system-ui;pointer-events:none}.moveHint{position:absolute;left:36px;bottom:152px;color:#fff8;font:700 10px system-ui;pointer-events:none}@media(pointer:coarse){.touch{display:block}}</style></head><body><iframe id="game" allow="fullscreen"></iframe><div class="touch"><div class="stickZone leftZone" id="leftZone"><div class="base" id="leftBase"><div class="knob"></div></div></div><div class="stickZone rightZone" id="rightZone"><div class="base" id="rightBase"><div class="knob"></div></div><div class="moveHint">MOVER</div><div class="camHint">MIRAR</div><div class="buttons"><div class="btn" data-button="0">C4<br>BAJA</div><div class="btn" data-button="2">C4<br>MEDIA</div><div class="btn" data-key="f">DET</div><div class="btn jump" data-key=" ">SALTO</div></div></div><script>
const frame=document.getElementById('game');let gw=null,gdoc=null,canvas=null;
async function loadGame(){try{let html=await fetch('game.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar game.html');return r.text()});const base=new URL('.',location.href).href;html=html.replace('<head>','<head><base href="'+base+'">');html=html.replace("import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';","import{FBXLoader}from'three/addons/loaders/FBXLoader.js';");html=html.replace(/function pick\(rx,fb\)\{return clips\.find\(c=>rx\.test\(c\.name\)\)\|\|fb\|\|clips\[0\]\}let cmap=\{\};function mkClips\(\)\{.*?\}function avatar\(\)/s,`function normAnim(v){return String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase()}function clipLike(words,fallback){const w=words.map(normAnim);return clips.find(c=>{const n=normAnim(c.name);return w.some(x=>n.includes(x))})||fallback||clips[0]}let cmap={};function mkClips(){const idle=clipLike(['idle 1','idle_1','idle01','idle'],clips[0]),idle2=clipLike(['idle 2','idle_2','idle02'],idle),run=clipLike(['correr','running','run','sprint'],idle),walk=clipLike(['caminar','walking','walk'],run),jump=clipLike(['saltar','salto','jumping','jump','takeoff'],idle),fall=clips.find(c=>{const n=normAnim(c.name);return(n.includes('fall')||n.includes('caer'))&&!n.includes('dead')&&!n.includes('death')&&!n.includes('muert')})||jump,death=clipLike(['caer muerto','fall dead','dead','death','dying','die','muerto'],fall),punch=clipLike(['punch','golpe','attack','hit'],idle),push=clipLike(['empujar','push','shove'],punch),throwClip=clipLike(['lanzar','throw'],punch);cmap={idle,idle2,walk,run,jump,fall,death,placeLow:punch,placeMid:punch,push,throw:throwClip};window.__bomber3dClips=clips.map(c=>c.name);window.__bomber3dAnimMap=Object.fromEntries(Object.entries(cmap).map(([k,c])=>[k,c?.name||null]));console.info('Bomber3D FBX clips',window.__bomber3dClips);console.info('Bomber3D animation map',window.__bomber3dAnimMap)}function avatar()`);html=html.replace("['jump','placeLow','placeMid','push','throw'].includes(n)","['jump','placeLow','placeMid','push','throw','death','idle2'].includes(n)");html=html.replace(/new GLTFLoader\(\)\.load\('\.\.\/fightermp\/Barbarian\.glb',g=>\{source=g\.scene;clips=g\.animations\|\|\[\];mkClips\(\);player=avatar\(\);player\.x=-11;player\.z=-11;play\(player,'idle'\);document\.getElementById\('splash'\)\.style\.display='none'\},undefined,e=>fatal\(e\?\.message\|\|e\)\)/,`new FBXLoader().load('main.fbx',fbx=>{source=fbx;clips=fbx.animations||[];mkClips();player=avatar();player.x=-11;player.z=-11;play(player,'idle');document.getElementById('splash').style.display='none'},undefined,e=>fatal(e?.message||e))`);html=html.replace('const roomId=new URLSearchParams(location.search)',`const roomId=new URLSearchParams(${JSON.stringify(location.search)})`);html=html.replace('player.root.position.set(player.x,player.y,player.z);player.root.rotation.y=player.yaw;collectPowerups(dt);',`if(player.hp<=0)play(player,'death');else if(performance.now()>=pushingUntil&&!grounded())play(player,player.vy>.15?'jump':'fall');player.root.position.set(player.x,player.y,player.z);player.root.rotation.y=player.yaw;collectPowerups(dt);`);frame.srcdoc=html}catch(e){document.body.innerHTML='<div style="color:white;font:16px system-ui;padding:30px">ERROR cargando Bomber3D: '+String(e.message||e)+'</div>'}}loadGame();
frame.addEventListener('load',()=>{gw=frame.contentWindow;gdoc=frame.contentDocument;canvas=gdoc.querySelector('canvas')});function key(k,on){if(!gw)return;gw.dispatchEvent(new KeyboardEvent(on?'keydown':'keyup',{key:k,code:k===' '?'Space':'',bubbles:true}))}function tapKey(k){key(k,true);setTimeout(()=>key(k,false),70)}function mouseButton(button){if(!canvas)return;const r=canvas.getBoundingClientRect(),x=r.width/2,y=r.height/2;canvas.dispatchEvent(new PointerEvent('pointerdown',{pointerId:91,pointerType:'mouse',button,buttons:1<<button,clientX:x,clientY:y,bubbles:true}));gw.dispatchEvent(new PointerEvent('pointerup',{pointerId:91,pointerType:'mouse',button,clientX:x,clientY:y,bubbles:true}))}document.querySelectorAll('.btn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(b.dataset.button!==undefined)mouseButton(Number(b.dataset.button));else tapKey(b.dataset.key)}));function stick(zone,base,onMove,onEnd){let id=null,cx=0,cy=0;const knob=base.firstElementChild,rad=42;zone.addEventListener('pointerdown',e=>{if(e.target.closest?.('.btn')||id!==null)return;id=e.pointerId;zone.setPointerCapture(id);cx=e.clientX;cy=e.clientY;base.style.left=cx+'px';base.style.top=cy+'px';base.style.display='block';onMove(0,0,0,e)});zone.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);if(d>rad){dx*=rad/d;dy*=rad/d;d=rad}knob.style.transform=`translate(${dx}px,${dy}px)`;onMove(dx/rad,dy/rad,d/rad,e)});function end(e){if(e.pointerId!==id)return;id=null;base.style.display='none';knob.style.transform='';onEnd(e)}zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end)}let held=new Set();function setMove(x,y,m){const next=new Set();if(y<-.28)next.add('w');if(y>.28)next.add('s');if(x<-.28)next.add('a');if(x>.28)next.add('d');if(m>.82)next.add('shift');for(const k of held)if(!next.has(k))key(k,false);for(const k of next)if(!held.has(k))key(k,true);held=next}stick(document.getElementById('leftZone'),document.getElementById('leftBase'),setMove,()=>{for(const k of held)key(k,false);held.clear()});let camX=0,camY=0;stick(document.getElementById('rightZone'),document.getElementById('rightBase'),(x,y,m,e)=>{if(!gw)return;const nx=e.clientX+x*10,ny=e.clientY+y*8;gw.dispatchEvent(new PointerEvent('pointermove',{pointerId:77,pointerType:'mouse',movementX:nx-camX,movementY:ny-camY,clientX:nx,clientY:ny,bubbles:true}));camX=nx;camY=ny},()=>{});
</script></body></html>
