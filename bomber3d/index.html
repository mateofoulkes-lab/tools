<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Bomber3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.touch{display:none;position:fixed;inset:0;z-index:9999;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none}.stickZone{position:absolute;bottom:18px;width:42vw;height:42vh;pointer-events:auto;touch-action:none}.leftZone{left:0}.rightZone{right:0}.base{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid #ffffff38;background:#0004;transform:translate(-50%,-50%);display:none;backdrop-filter:blur(3px)}.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffff2e;border:2px solid #ffffff48}.buttons{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(2,66px);gap:10px;pointer-events:auto}.btn{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#0009;border:2px solid #ffffff45;color:#fff;font:800 11px/1 system-ui;touch-action:none;backdrop-filter:blur(4px)}.jump{grid-column:2}.camHint{position:absolute;right:118px;bottom:118px;color:#fff8;font:700 10px system-ui;pointer-events:none}.moveHint{position:absolute;left:36px;bottom:152px;color:#fff8;font:700 10px system-ui;pointer-events:none}@media(pointer:coarse){.touch{display:block}}</style></head><body><iframe id="game" allow="fullscreen"></iframe><div class="touch"><div class="stickZone leftZone" id="leftZone"><div class="base" id="leftBase"><div class="knob"></div></div></div><div class="stickZone rightZone" id="rightZone"><div class="base" id="rightBase"><div class="knob"></div></div><div class="moveHint">MOVER</div><div class="camHint">MIRAR</div><div class="buttons"><div class="btn" data-key="e">C4<br>BAJA</div><div class="btn" data-key="q">C4<br>MEDIA</div><div class="btn" data-key="f">DET</div><div class="btn jump" data-key=" ">SALTO</div></div></div><script>const frame=document.getElementById('game');frame.src='game.html'+location.search;let gw=null,gdoc=null,canvas=null;frame.addEventListener('load',()=>{gw=frame.contentWindow;gdoc=frame.contentDocument;canvas=gdoc.querySelector('canvas')});function key(k,on){if(!gw)return;gw.dispatchEvent(new KeyboardEvent(on?'keydown':'keyup',{key:k,bubbles:true}))}function tapKey(k){key(k,true);setTimeout(()=>key(k,false),70)}document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();tapKey(b.dataset.key)})});function stick(zone,base,onMove,onEnd){let id=null,cx=0,cy=0;const knob=base.firstElementChild,rad=42;zone.addEventListener('pointerdown',e=>{if(id!==null)return;id=e.pointerId;zone.setPointerCapture(id);cx=e.clientX;cy=e.clientY;base.style.left=cx+'px';base.style.top=cy+'px';base.style.display='block';onMove(0,0,0,e)});zone.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);if(d>rad){dx*=rad/d;dy*=rad/d;d=rad}knob.style.transform=`translate(${dx}px,${dy}px)`;onMove(dx/rad,dy/rad,d/rad,e)});function end(e){if(e.pointerId!==id)return;id=null;base.style.display='none';knob.style.transform='';onEnd(e)}zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end)}let held=new Set();function setMove(x,y,m){const next=new Set();if(y<-.28)next.add('w');if(y>.28)next.add('s');if(x<-.28)next.add('a');if(x>.28)next.add('d');if(m>.82)next.add('shift');for(const k of held)if(!next.has(k))key(k,false);for(const k of next)if(!held.has(k))key(k,true);held=next}stick(document.getElementById('leftZone'),document.getElementById('leftBase'),setMove,()=>{for(const k of held)key(k,false);held.clear()});let camDown=false,camX=0,camY=0;stick(document.getElementById('rightZone'),document.getElementById('rightBase'),(x,y,m,e)=>{if(!gw||!canvas)return;if(!camDown){camDown=true;camX=e.clientX;camY=e.clientY;canvas.dispatchEvent(new PointerEvent('pointerdown',{pointerId:77,clientX:camX,clientY:camY,bubbles:true}))}const nx=camX+x*10,ny=camY+y*8;gw.dispatchEvent(new PointerEvent('pointermove',{pointerId:77,clientX:nx,clientY:ny,bubbles:true}));camX=nx;camY=ny},()=>{if(gw&&camDown)gw.dispatchEvent(new PointerEvent('pointerup',{pointerId:77,clientX:camX,clientY:camY,bubbles:true}));camDown=false});</script></body></html>
