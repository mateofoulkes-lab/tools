<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EPUB VR Reader Minimal Quest</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    :root{
      --text:#eef2f7;
      --muted:#aab4c4;
      --border:rgba(255,255,255,.12);
      --panel:rgba(14,18,24,.92);
      --panel-soft:rgba(15,18,25,.52);
      --reader-bg:#ffffff;
      --reader-text:#12151b;
      --accent:#66b3ff;
      --shadow:0 10px 30px rgba(0,0,0,.28);
    }body[data-theme="dark"]{
  --reader-bg:#111418;
  --reader-text:#e8edf5;
  --accent:#8bbcff;
}

body[data-theme="sepia"]{
  --reader-bg:#f5ecd8;
  --reader-text:#4b3f2e;
  --accent:#f0b66c;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0f1115;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

button, select, input{font:inherit}
button{touch-action:manipulation}

.app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111622;
}

.viewer-shell{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--reader-bg);
}

.viewer{
  width:100%;
  height:100%;
  background:var(--reader-bg);
  color:var(--reader-text);
}

.menu-toggle{
  position:absolute;
  top:12px;
  left:12px;
  z-index:70;
  width:48px;
  height:48px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--panel-soft);
  color:var(--text);
  backdrop-filter:blur(10px);
  cursor:pointer;
  font-size:20px;
  line-height:1;
  box-shadow:var(--shadow);
}

.reader-menu{
  position:absolute;
  top:68px;
  left:12px;
  z-index:80;
  width:min(318px, calc(100vw - 24px));
  display:none;
  padding:11px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel);
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}

.reader-menu.open{display:block}
.menu-section{display:grid;gap:8px}
.menu-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.menu-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

.menu-btn,.mini-btn{
  border:1px solid var(--border);
  background:#1a2030;
  color:var(--text);
  border-radius:11px;
  cursor:pointer;
}

.menu-btn{width:100%;padding:11px 12px;text-align:left}
.mini-btn{min-width:58px;padding:9px 10px;text-align:center}
.menu-btn:hover,.mini-btn:hover{border-color:rgba(255,255,255,.24)}

.mini-btn.active{
  background:linear-gradient(180deg, rgba(102,179,255,.22), rgba(138,125,255,.16));
  border-color:rgba(102,179,255,.45);
}

.menu-row{display:flex;gap:8px;flex-wrap:wrap}
.hidden-file{display:none}

.book-status{
  position:absolute;
  top:14px;
  left:72px;
  z-index:60;
  max-width:min(55vw, 720px);
  padding:9px 13px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(15,18,25,.36);
  backdrop-filter:blur(10px);
  color:rgba(255,255,255,.88);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none;
}

.clock{
  position:absolute;
  top:14px;
  right:14px;
  z-index:60;
  padding:9px 13px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(15,18,25,.36);
  backdrop-filter:blur(10px);
  color:rgba(255,255,255,.9);
  font-size:13px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}

.empty-state{
  position:absolute;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  text-align:center;
  padding:28px;
  color:var(--reader-text);
  pointer-events:none;
}

.empty-card{
  max-width:680px;
  padding:28px;
  border-radius:28px;
  border:1px solid color-mix(in srgb, var(--reader-text) 16%, transparent);
  background:color-mix(in srgb, var(--reader-bg) 84%, var(--reader-text) 7%);
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.empty-card h1{margin:0 0 10px;font-size:clamp(28px,4vw,48px)}
.empty-card p{margin:0;opacity:.75;font-size:clamp(15px,1.8vw,19px);line-height:1.45}

.hover-zone{
  position:absolute;
  top:0;
  bottom:0;
  width:140px;
  z-index:42;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity .16s ease;
}

.hover-zone-left{left:0;background:linear-gradient(to right, rgba(0,0,0,.12), rgba(0,0,0,0))}
.hover-zone-right{right:0;background:linear-gradient(to left, rgba(0,0,0,.12), rgba(0,0,0,0))}
.hover-zone.show{opacity:1}

.hover-nav-btn{
  width:54px;
  height:108px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(15,18,25,.34);
  color:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  cursor:pointer;
  font-size:30px;
  line-height:1;
  box-shadow:var(--shadow);
}

.hover-nav-btn:hover,.hover-nav-btn:focus-visible{background:rgba(15,18,25,.6);outline:none}

.bottom-bar{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:65;
  width:min(720px, calc(100vw - 28px));
  display:flex;
  flex-direction:column;
  gap:8px;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s ease;
}

.bottom-bar.show,
.bottom-bar.pinned{
  opacity:1;
  pointer-events:auto;
}

.progress-wrap{
  width:100%;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.10);
  overflow:hidden;
  pointer-events:none;
}

.progress-bar{
  width:0%;
  height:100%;
  background:rgba(255,255,255,.42);
  transition:width .18s ease;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.control-btn{
  width:44px;
  height:44px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(15,18,25,.58);
  color:var(--text);
  backdrop-filter:blur(8px);
  cursor:pointer;
  font-size:16px;
  flex:0 0 auto;
}

.control-btn:hover,.control-btn:focus-visible{background:rgba(25,30,40,.82);outline:none}

.page-indicator{
  min-width:210px;
  text-align:center;
  padding:10px 13px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(15,18,25,.48);
  color:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  font-size:13px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

body .viewer-shell.quest-mode .menu-toggle{
  width:58px;
  height:58px;
  font-size:24px;
}

body .viewer-shell.quest-mode .control-btn{
  width:58px;
  height:58px;
  font-size:19px;
}

body .viewer-shell.quest-mode .page-indicator{
  min-width:260px;
  font-size:15px;
  padding:14px 18px;
}

body .viewer-shell.quest-mode .hover-zone{
  width:180px;
  opacity:.28;
}

body .viewer-shell.quest-mode .hover-zone.show{
  opacity:1;
}

body .viewer-shell.quest-mode .hover-nav-btn{
  width:68px;
  height:128px;
  font-size:36px;
}

.page-turn{
  position:absolute;
  inset:0;
  z-index:50;
  pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
  opacity:0;
  transform:translateX(0) skewX(-9deg);
}
.page-turn.next{animation:turnNext 420ms ease}
.page-turn.prev{animation:turnPrev 420ms ease}
@keyframes turnNext{0%{opacity:0;transform:translateX(45%) skewX(-9deg)}38%{opacity:.65}100%{opacity:0;transform:translateX(-55%) skewX(-9deg)}}
@keyframes turnPrev{0%{opacity:0;transform:translateX(-55%) skewX(9deg)}38%{opacity:.65}100%{opacity:0;transform:translateX(45%) skewX(9deg)}}

@media (pointer:coarse){
  .hover-zone{opacity:.34}
  .bottom-bar{opacity:.96;pointer-events:auto}
  .book-status{max-width:calc(100vw - 150px)}
}

  </style>
</head>
<body data-theme="normal">
  <div class="app">
    <div class="viewer-shell" id="viewerShell">
      <div id="viewer" class="viewer"></div><button id="menuToggle" class="menu-toggle" aria-label="Menú">☰</button>

  <div id="readerMenu" class="reader-menu">
    <div class="menu-section">
      <button id="loadBookBtn" class="menu-btn">Cargar libro</button>
      <input id="epubInput" class="hidden-file" type="file" accept=".epub,application/epub+zip" />
      <button id="fullscreenBtn" class="menu-btn">Pantalla completa</button>
      <button id="xrBtn" class="menu-btn">Modo Quest / mandos</button>
    </div>

    <div class="menu-sep"></div>

    <div class="menu-section">
      <div class="menu-label">Tema</div>
      <div class="menu-row">
        <button class="mini-btn" data-theme="normal">Claro</button>
        <button class="mini-btn" data-theme="dark">Oscuro</button>
        <button class="mini-btn" data-theme="sepia">Sepia</button>
      </div>
    </div>

    <div class="menu-sep"></div>

    <div class="menu-section">
      <div class="menu-label">Texto</div>
      <div class="menu-row">
        <button id="fontDecreaseBtn" class="mini-btn">A−</button>
        <button id="fontResetBtn" class="mini-btn">A</button>
        <button id="fontIncreaseBtn" class="mini-btn">A+</button>
      </div>
    </div>

    <div class="menu-sep"></div>

    <div class="menu-section">
      <div class="menu-label">Columnas</div>
      <div class="menu-row">
        <button class="mini-btn" data-columns="1">1</button>
        <button class="mini-btn" data-columns="2">2</button>
        <button class="mini-btn" data-columns="3">3</button>
      </div>
    </div>
  </div>

  <div id="bookStatus" class="book-status">Sin libro cargado.</div>
  <div id="clock" class="clock">--:--</div>

  <div id="emptyState" class="empty-state">
    <div class="empty-card">
      <h1>EPUB VR Reader</h1>
      <p>Cargá un EPUB desde el menú. En Quest Browser: GitHub Pages + HTTPS, cargar archivo, pantalla completa y mandos.</p>
    </div>
  </div>

  <div id="leftHoverNav" class="hover-zone hover-zone-left">
    <button id="hoverPrevPageBtn" class="hover-nav-btn" aria-label="Página anterior">❮</button>
  </div>

  <div id="rightHoverNav" class="hover-zone hover-zone-right">
    <button id="hoverNextPageBtn" class="hover-nav-btn" aria-label="Página siguiente">❯</button>
  </div>

  <div id="pageTurn" class="page-turn"></div>

  <div id="bottomBar" class="bottom-bar pinned">
    <div class="progress-wrap">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div class="controls">
      <button id="prevSectionBtn" class="control-btn" title="Capítulo anterior">⏮</button>
      <button id="prevPageBtn" class="control-btn" title="Página anterior">⏪</button>
      <div id="pageIndicator" class="page-indicator">Página — / — · 0%</div>
      <button id="nextPageBtn" class="control-btn" title="Página siguiente">⏩</button>
      <button id="nextSectionBtn" class="control-btn" title="Capítulo siguiente">⏭</button>
    </div>
  </div>
</div>

  </div>  <script>
    const state = {
      book: null,
      rendition: null,
      loaded: false,
      currentSectionIndex: 0,
      currentCfi: null,
      locationsReady: false,
      totalLocations: 0,
      reader: {
        fontSize: 100,
        columns: 1,
        theme: 'normal',
        currentPage: 0,
        totalPages: 0,
        percentage: 0
      },
      ui: { bottomBarTimer: null },
      xrSession: null,
      lastGamepadActions: new Map()
    };

    const $ = (s) => document.querySelector(s);
    const els = {
      viewerShell: $('#viewerShell'), viewer: $('#viewer'), menuToggle: $('#menuToggle'), readerMenu: $('#readerMenu'),
      loadBookBtn: $('#loadBookBtn'), epubInput: $('#epubInput'), fullscreenBtn: $('#fullscreenBtn'), xrBtn: $('#xrBtn'),
      bookStatus: $('#bookStatus'), clock: $('#clock'), emptyState: $('#emptyState'), leftHoverNav: $('#leftHoverNav'), rightHoverNav: $('#rightHoverNav'),
      hoverPrevPageBtn: $('#hoverPrevPageBtn'), hoverNextPageBtn: $('#hoverNextPageBtn'), bottomBar: $('#bottomBar'),
      progressBar: $('#progressBar'), pageIndicator: $('#pageIndicator'), prevSectionBtn: $('#prevSectionBtn'), nextSectionBtn: $('#nextSectionBtn'),
      prevPageBtn: $('#prevPageBtn'), nextPageBtn: $('#nextPageBtn'), fontDecreaseBtn: $('#fontDecreaseBtn'), fontResetBtn: $('#fontResetBtn'),
      fontIncreaseBtn: $('#fontIncreaseBtn'), pageTurn: $('#pageTurn')
    };

    init();

    function init(){
      initSavedPreferences(); bindUi(); updateMenuState(); applyBodyTheme(); updateClock(); setInterval(updateClock, 15000); updatePageIndicator();
      requestAnimationFrame(pollStandardGamepads);
    }

    function bindUi(){
      els.menuToggle.addEventListener('click', ev => { ev.stopPropagation(); els.readerMenu.classList.toggle('open'); showBottomBar(true); });
      document.addEventListener('click', ev => { if (!els.readerMenu.contains(ev.target) && ev.target !== els.menuToggle) els.readerMenu.classList.remove('open'); });

      els.loadBookBtn.addEventListener('click', () => els.epubInput.click());
      els.epubInput.addEventListener('change', onFilePicked);
      els.fullscreenBtn.addEventListener('click', toggleFullscreen);
      els.xrBtn.addEventListener('click', enterXR);

      els.hoverPrevPageBtn.addEventListener('click', prevPage);
      els.hoverNextPageBtn.addEventListener('click', nextPage);
      els.prevPageBtn.addEventListener('click', prevPage);
      els.nextPageBtn.addEventListener('click', nextPage);
      els.prevSectionBtn.addEventListener('click', () => jumpSection(-1));
      els.nextSectionBtn.addEventListener('click', () => jumpSection(1));

      els.fontDecreaseBtn.addEventListener('click', () => changeFontSize(-10));
      els.fontResetBtn.addEventListener('click', () => setFontSize(100));
      els.fontIncreaseBtn.addEventListener('click', () => changeFontSize(10));

      document.querySelectorAll('[data-theme]').forEach(btn => btn.addEventListener('click', () => {
        state.reader.theme = btn.dataset.theme; localStorage.setItem('vr-reader-theme', state.reader.theme); applyBodyTheme(); applyReaderStyles(); updateMenuState();
      }));

      document.querySelectorAll('[data-columns]').forEach(btn => btn.addEventListener('click', () => {
        state.reader.columns = clamp(parseInt(btn.dataset.columns, 10), 1, 3); localStorage.setItem('vr-reader-columns', String(state.reader.columns)); applyReaderStyles(); updateMenuState();
      }));

      window.addEventListener('mousemove', onGlobalMouseMove);
      els.viewerShell.addEventListener('mouseleave', () => { hideHoverNav(); hideBottomBar(); });

      document.addEventListener('keydown', ev => {
        if (ev.target && ['INPUT','SELECT','TEXTAREA'].includes(ev.target.tagName)) return;
        if (ev.key === 'Escape') els.readerMenu.classList.remove('open');
        if (ev.key === 'ArrowLeft') prevPage();
        if (ev.key === 'ArrowRight') nextPage();
        if (ev.key === 'ArrowUp') jumpSection(-1);
        if (ev.key === 'ArrowDown') jumpSection(1);
        if (ev.key === '+' || ev.key === '=') changeFontSize(10);
        if (ev.key === '-' || ev.key === '_') changeFontSize(-10);
        if (ev.key.toLowerCase() === 'f') toggleFullscreen();
      });

      window.addEventListener('resize', debounce(() => state.rendition?.resize('100%', '100%'), 180));
    }

    function initSavedPreferences(){
      state.reader.theme = localStorage.getItem('vr-reader-theme') || 'normal';
      state.reader.columns = clamp(parseInt(localStorage.getItem('vr-reader-columns') || '1', 10), 1, 3);
      state.reader.fontSize = clamp(parseInt(localStorage.getItem('vr-reader-font-size') || '100', 10), 70, 220);
    }

    async function onFilePicked(e){
      const file = e.target.files?.[0]; if (!file) return;
      cleanup(); setStatus(`Cargando: ${file.name}...`);
      try{
        const buffer = await file.arrayBuffer();
        state.book = ePub(buffer);
        state.rendition = state.book.renderTo('viewer', { width:'100%', height:'100%', spread:'none', flow:'paginated', manager:'default' });
        state.rendition.on('rendered', onRendered);
        state.rendition.on('relocated', onRelocated);
        await state.book.ready;
        await state.rendition.display();
        state.loaded = true; els.emptyState.style.display = 'none';
        generateLocationsSoon();
        const meta = await state.book.loaded.metadata.catch(() => ({}));
        setStatus(`Libro cargado: ${meta?.title || file.name}`);
        els.readerMenu.classList.remove('open');
        applyReaderStyles();
      }catch(err){ console.error(err); setStatus('No pude abrir el EPUB.'); els.emptyState.style.display = 'grid'; }
    }

    function cleanup(){
      if (state.rendition) { try{ state.rendition.destroy(); }catch(e){} }
      if (state.book) { try{ state.book.destroy(); }catch(e){} }
      state.book=null; state.rendition=null; state.loaded=false; state.currentSectionIndex=0; state.currentCfi=null; state.locationsReady=false; state.totalLocations=0;
      state.reader.currentPage=0; state.reader.totalPages=0; state.reader.percentage=0; els.viewer.innerHTML=''; els.progressBar.style.width='0%'; updatePageIndicator(); hideHoverNav(); showBottomBar(true);
    }

    async function generateLocationsSoon(){
      try{
        await state.book.locations.generate(1000);
        state.locationsReady = true;
        state.totalLocations = state.book.locations.total || 0;
        updatePageFromCfi(state.currentCfi);
      }catch(e){ state.locationsReady = false; }
    }

    function onRendered(section){
      state.currentSectionIndex = section.index ?? state.currentSectionIndex;
      applyReaderStyles();
    }

    function onRelocated(location){
      const start = location?.start; if (!start) return;
      if (typeof start.index === 'number') state.currentSectionIndex = start.index;
      state.currentCfi = start.cfi || state.currentCfi;
      state.reader.percentage = typeof start.percentage === 'number' ? start.percentage : state.reader.percentage;
      updatePageFromCfi(state.currentCfi);
      updateProgress(); updatePageIndicator();
    }

    function updatePageFromCfi(cfi){
      if (state.locationsReady && cfi && state.book?.locations){
        const loc = state.book.locations.locationFromCfi(cfi);
        state.reader.currentPage = Math.max(1, loc || 1);
        state.reader.totalPages = Math.max(1, state.book.locations.total || 1);
      } else if (state.reader.percentage > 0) {
        state.reader.totalPages = state.reader.totalPages || 100;
        state.reader.currentPage = Math.max(1, Math.round(state.reader.percentage * state.reader.totalPages));
      }
    }

    function applyBodyTheme(){ document.body.dataset.theme = state.reader.theme; }

    function applyReaderStyles(){
      if (!state.rendition) return;
      try { state.rendition.themes.fontSize(`${state.reader.fontSize}%`); } catch(e){}
      state.rendition.getContents().forEach(content => {
        const doc = content.document; const body = doc.body; if (!body) return;
        body.style.background = getThemeColors().bg;
        body.style.color = getThemeColors().text;
        body.style.fontFamily = 'Georgia, Cambria, serif';
        body.style.lineHeight = '1.56';
        body.style.paddingLeft = '32px';
        body.style.paddingRight = '32px';
        body.style.columnCount = String(clamp(state.reader.columns, 1, 3));
        body.style.columnGap = state.reader.columns === 1 ? '0' : '42px';
        body.style.columnFill = 'balance';
      });
    }

    function getThemeColors(){
      if (state.reader.theme === 'dark') return { bg:'#111418', text:'#e8edf5' };
      if (state.reader.theme === 'sepia') return { bg:'#f5ecd8', text:'#4b3f2e' };
      return { bg:'#ffffff', text:'#12151b' };
    }

    function animateTurn(dir){ els.pageTurn.className='page-turn'; void els.pageTurn.offsetWidth; els.pageTurn.classList.add(dir === 'prev' ? 'prev' : 'next'); }
    async function nextPage(){ if(!state.rendition) return; animateTurn('next'); showBottomBar(); await state.rendition.next(); }
    async function prevPage(){ if(!state.rendition) return; animateTurn('prev'); showBottomBar(); await state.rendition.prev(); }

    async function jumpSection(direction){
      if (!state.book || !state.rendition) return;
      const spineItems = state.book.spine?.spineItems || []; if (!spineItems.length) return;
      const targetIndex = clamp(state.currentSectionIndex + direction, 0, spineItems.length - 1);
      const target = spineItems[targetIndex]; if (!target) return;
      animateTurn(direction < 0 ? 'prev' : 'next'); showBottomBar(); await state.rendition.display(target.href);
    }

    function updateProgress(){
      const pct = clamp(state.reader.percentage * 100, 0, 100);
      els.progressBar.style.width = `${pct}%`;
    }

    function updatePageIndicator(){
      const pct = clamp(state.reader.percentage * 100, 0, 100).toFixed(1);
      const cur = state.reader.currentPage || '—'; const total = state.reader.totalPages || '—';
      els.pageIndicator.textContent = `Página ${cur} / ${total} · ${pct}%`;
    }

    function setStatus(text){ els.bookStatus.textContent = text; }
    function setFontSize(value){ state.reader.fontSize = clamp(parseInt(value,10)||100,70,220); localStorage.setItem('vr-reader-font-size', String(state.reader.fontSize)); applyReaderStyles(); }
    function changeFontSize(delta){ setFontSize(state.reader.fontSize + delta); }

    function updateMenuState(){
      document.querySelectorAll('[data-theme]').forEach(btn => btn.classList.toggle('active', btn.dataset.theme === state.reader.theme));
      document.querySelectorAll('[data-columns]').forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.columns,10) === state.reader.columns));
    }

    function onGlobalMouseMove(ev){
      const rect = els.viewerShell.getBoundingClientRect();
      const inside = ev.clientX>=rect.left && ev.clientX<=rect.right && ev.clientY>=rect.top && ev.clientY<=rect.bottom;
      if(!inside){ hideHoverNav(); hideBottomBar(); return; }
      const x = ev.clientX - rect.left; const y = ev.clientY - rect.top;
      const edge = 145; const bottomBand = 130;
      const showLeft = x <= edge; const showRight = x >= rect.width - edge; const showBottom = y >= rect.height - bottomBand || showLeft || showRight;
      els.leftHoverNav.classList.toggle('show', showLeft);
      els.rightHoverNav.classList.toggle('show', showRight);
      if(showBottom) showBottomBar();
    }

    function hideHoverNav(){ els.leftHoverNav.classList.remove('show'); els.rightHoverNav.classList.remove('show'); }
    function showBottomBar(pin=false){ els.bottomBar.classList.add('show'); if(pin) els.bottomBar.classList.add('pinned'); clearTimeout(state.ui.bottomBarTimer); state.ui.bottomBarTimer=setTimeout(hideBottomBar, 1800); }
    function hideBottomBar(){ clearTimeout(state.ui.bottomBarTimer); if(!els.readerMenu.classList.contains('open')) { els.bottomBar.classList.remove('show'); els.bottomBar.classList.remove('pinned'); } }

    async function toggleFullscreen(){
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen().catch(()=>{});
      else await document.exitFullscreen().catch(()=>{});
      els.readerMenu.classList.remove('open');
    }

    async function enterXR(){
      // IMPORTANTE:
      // Esta v1 NO entra en immersive-vr real, porque Quest Browser necesita una escena WebGL/WebXR
      // con framebuffer XR. Si pedimos immersive-vr sin render 3D real, puede quedar cargando eternamente.
      // En cambio activamos un “modo Quest”: pantalla completa + UI grande + lectura de gamepads/mandos.
      await toggleFullscreen();
      els.viewerShell.classList.add('quest-mode');
      setStatus('Modo Quest activo: pantalla completa + mandos/gamepad.');
      els.readerMenu.classList.remove('open');
      showBottomBar(true);
    }

    function pollStandardGamepads(){
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const now = performance.now();
      for(const gp of pads){ if(gp) handleGamepad(gp, gp.id || gp.index, now); }
      requestAnimationFrame(pollStandardGamepads);
    }

    function handleGamepad(gp, id, time=performance.now()){
      const key = String(id); const last = state.lastGamepadActions.get(key) || { buttons:[], axesTime:0 };
      gp.buttons.forEach((btn,i)=>{
        const was = !!last.buttons[i]; const is = !!btn.pressed || btn.value > .72;
        if(is && !was){
          if(i===0 || i===1) key.includes('left') ? prevPage() : nextPage();
          else if(i===2) jumpSection(-1);
          else if(i===3) jumpSection(1);
          else if(i===4 || i===5) toggleFullscreen();
        }
        last.buttons[i]=is;
      });
      const axX = gp.axes[2] ?? gp.axes[0] ?? 0; const axY = gp.axes[3] ?? gp.axes[1] ?? 0;
      if(time - last.axesTime > 430){
        if(axX > .65){ nextPage(); last.axesTime=time; }
        else if(axX < -.65){ prevPage(); last.axesTime=time; }
        else if(axY > .65){ jumpSection(1); last.axesTime=time; }
        else if(axY < -.65){ jumpSection(-1); last.axesTime=time; }
      }
      state.lastGamepadActions.set(key,last);
    }

    function updateClock(){ els.clock.textContent = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
    function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
    function debounce(fn, wait){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); }; }
  </script></body>
</html>
